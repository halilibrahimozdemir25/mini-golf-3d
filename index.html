    // Dünya koordinatlı dikişsiz UV haritalama (Tüm bölümler ve tüm zemin parçaları 100% aynı hizalı)
    function applyWorldUVs(geo, meshX, meshZ, scale = 2.4) {
      const pos = geo.attributes.position;
      const count = pos.count;
      const uvs = new Float32Array(count * 2);
      for (let i = 0; i < count; i++) {
        const wx = pos.getX(i) + meshX;
        const wz = pos.getZ(i) + meshZ;
        uvs[i * 2] = wx / scale;
        uvs[i * 2 + 1] = wz / scale;
      }
      geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    }

    function addFloor(x, y, z, w, h, d, mat = null) {
      const geo = new THREE.BoxGeometry(w, h, d);
      applyWorldUVs(geo, x, z, 1.8);
      const floorMat = mat || grassMat;
      const mesh = new THREE.Mesh(geo, floorMat);
      mesh.position.set(x, y, z);
      mesh.receiveShadow = true;
      courseGroup.add(mesh);
      floorMeshes.push(mesh);
      return mesh;
    }

    // --- Yuvarlak Delik Çukuru Açılmış Tek Parça Dikişsiz Zemin ---
    // Deliğin önü, arkası ve yanları %100 yemyeşil zeminle kaplıdır; sadece yuvarlak delik çukurdur!
    function addFloorWithCupHole(x, y, z, w, h, d, cupWorldX, cupWorldZ, cupRadius) {
      const hw = w * 0.5;
      const hd = d * 0.5;
      const shape = new THREE.Shape();
      shape.moveTo(-hw, hd);
      shape.lineTo(hw, hd);
      shape.lineTo(hw, -hd);
      shape.lineTo(-hw, -hd);
      shape.closePath();

      const localCupX = cupWorldX - x;
      const localCupZ = cupWorldZ - z;
      const hole = new THREE.Path();
      hole.absarc(localCupX, -localCupZ, cupRadius, 0, Math.PI * 2, true);
      shape.holes = [hole];

      const extrudeSettings = { depth: h, bevelEnabled: false };
      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.rotateX(-Math.PI / 2);
      geo.translate(0, -h * 0.5, 0);

      applyWorldUVs(geo, x, z, 1.8);

      const floorMat = grassMat;
      const mesh = new THREE.Mesh(geo, floorMat);
      mesh.position.set(x, y, z);
      mesh.receiveShadow = true;
      courseGroup.add(mesh);
      floorMeshes.push(mesh);
      return mesh;
    }

    // Duvarların yan ve üst yüzeylerine piksel kalitesinde, açı değiştikçe ASLA bozulmayan UV haritalaması
    function setupWallUVs(geo, w, h, d) {
      const uvs = geo.attributes.uv.array;
      const isAlongZ = d >= w;
      const len = isAlongZ ? d : w;
      const repLen = Math.max(1, len / 1.6);

      function setFaceUV(faceIdx, u0, v0, u1, v1, u2, v2, u3, v3) {
        const base = faceIdx * 8;
        uvs[base + 0] = u0; uvs[base + 1] = v0;
        uvs[base + 2] = u1; uvs[base + 3] = v1;
        uvs[base + 4] = u2; uvs[base + 5] = v2;
        uvs[base + 6] = u3; uvs[base + 7] = v3;
      }

      if (isAlongZ) {
        // Face 2 (+Y Üst Küpeşte / Rail Cap): Boyuna pürüzsüz akış, kenarlarda 3D pah ışıltısı
        setFaceUV(2, 0, 0,  0, 1,  repLen, 0,  repLen, 1);
        // Face 3 (-Y Alt):
        setFaceUV(3, 0, 0,  0, 1,  repLen, 0,  repLen, 1);
        // Face 0 (+X) ve 1 (-X) Uzun Yan Yüzeyler: Boyuna ahşap kalaslar
        setFaceUV(0, 0, 1,  repLen, 1,  0, 0,  repLen, 0);
        setFaceUV(1, 0, 1,  repLen, 1,  0, 0,  repLen, 0);
        // Face 4 (+Z) ve 5 (-Z) Kısa Uç Kapaklar
        setFaceUV(4, 0, 1, 1, 1, 0, 0, 1, 0);
        setFaceUV(5, 0, 1, 1, 1, 0, 0, 1, 0);
      } else {
        // isAlongX:
        // Face 2 (+Y Üst Küpeşte / Rail Cap): Boyuna pürüzsüz akış, kenarlarda 3D pah ışıltısı
        setFaceUV(2, 0, 0,  repLen, 0,  0, 1,  repLen, 1);
        // Face 3 (-Y Alt):
        setFaceUV(3, 0, 0,  repLen, 0,  0, 1,  repLen, 1);
        // Face 4 (+Z) ve 5 (-Z) Uzun Yan Yüzeyler
        setFaceUV(4, 0, 1,  repLen, 1,  0, 0,  repLen, 0);
        setFaceUV(5, 0, 1,  repLen, 1,  0, 0,  repLen, 0);
        // Face 0 (+X) ve 1 (-X) Kısa Uç Kapaklar
        setFaceUV(0, 0, 1, 1, 1, 0, 0, 1, 0);
        setFaceUV(1, 0, 1, 1, 1, 0, 0, 1, 0);
      }
      geo.attributes.uv.needsUpdate = true;
    }

    
    function isPointInTriangle2D(px, pz, x1, z1, x2, z2, x3, z3) {
      const d1 = (px - x2) * (z1 - z2) - (x1 - x2) * (pz - z2);
      const d2 = (px - x3) * (z2 - z3) - (x2 - x3) * (pz - z3);
      const d3 = (px - x1) * (z3 - z1) - (x3 - x1) * (pz - z1);
      const hasNeg = (d1 < -0.0001) || (d2 < -0.0001) || (d3 < -0.0001);
      const hasPos = (d1 > 0.0001) || (d2 > 0.0001) || (d3 > 0.0001);
      return !(hasNeg && hasPos);
    }

    // --- Golf Battle 45-Derece Açılı Ahşap Köşe Pahları (Bank Corner Wedges) ---
    // Altı, üstü ve tüm kenarları 100% kapalı, masif 3D üçgen prizma ahşap blok!
    function addCornerWedge(cx, cz, dirX, dirZ, size = 0.72, y = 0.29, h = 0.58) {
      const extraDepth = 0.35;
      const visualH = h + extraDepth;
      const yBot = (y - h * 0.5) - extraDepth;
      const yTop = y + h * 0.5;

      const geo = new THREE.BufferGeometry();
      const T0 = [cx, yTop, cz];
      const T1 = [cx + dirX * size, yTop, cz];
      const T2 = [cx, yTop, cz + dirZ * size];
      const B0 = [cx, yBot, cz];
      const B1 = [cx + dirX * size, yBot, cz];
      const B2 = [cx, yBot, cz + dirZ * size];

      const nx = dirX * 0.70710678;
      const nz = dirZ * 0.70710678;

      let positions = [];
      let normals = [];
      let uvs = [];

      function addTri(pA, pB, pC, n, uvA, uvB, uvC) {
        positions.push(...pA, ...pB, ...pC);
        normals.push(...n, ...n, ...n);
        uvs.push(...uvA, ...uvB, ...uvC);
      }

      function addQuadPoints(pBL, pBR, pTR, pTL, targetNorm, uvBL, uvBR, uvTR, uvTL) {
        const v1x = pBR[0] - pBL[0], v1y = pBR[1] - pBL[1], v1z = pBR[2] - pBL[2];
        const v2x = pTL[0] - pBL[0], v2y = pTL[1] - pBL[1], v2z = pTL[2] - pBL[2];
        const cxNorm = v1y * v2z - v1z * v2y;
        const cyNorm = v1z * v2x - v1x * v2z;
        const czNorm = v1x * v2y - v1y * v2x;
        const dot = cxNorm * targetNorm[0] + cyNorm * targetNorm[1] + czNorm * targetNorm[2];
        if (dot >= 0) {
          addTri(pBL, pBR, pTR, targetNorm, uvBL, uvBR, uvTR);
          addTri(pBL, pTR, pTL, targetNorm, uvBL, uvTR, uvTL);
        } else {
          addTri(pBL, pTR, pBR, targetNorm, uvBL, uvTR, uvBR);
          addTri(pBL, pTL, pTR, targetNorm, uvBL, uvTL, uvTR);
        }
      }

      // Group 0 (3 vertices): Üst Kapak (Top Cap) - wedgeTopMat (üst ray pahı)
      if (dirX * dirZ > 0) {
        addTri(T0, T2, T1, [0, 1, 0], [0.5, 0.5], [0, 1], [1, 0]);
      } else {
        addTri(T0, T1, T2, [0, 1, 0], [0.5, 0.5], [1, 0], [0, 1]);
      }

      // Group 1 (21 vertices): Masif Ahşap Yan ve Alt Yüzeyler - wedgeMat
      // 1. Alt Kapak (Bottom Cap) - Tam Kapalı Masif Taban!
      if (dirX * dirZ > 0) {
        addTri(B0, B1, B2, [0, -1, 0], [0.5, 0.5], [1, 0], [0, 1]);
      } else {
        addTri(B0, B2, B1, [0, -1, 0], [0.5, 0.5], [0, 1], [1, 0]);
      }

      // 2. Çarpışma ve Bant Yüzeyi (Front 45-deg Face)
      addQuadPoints(B1, B2, T2, T1, [nx, 0, nz], [0, 0], [1, 0], [1, 1], [0, 1]);

      // 3. Arka Yan Yüzey 1 (X eksenine paralel arka yüzey)
      addQuadPoints(B0, B1, T1, T0, [0, 0, -dirZ], [0, 0], [1, 0], [1, 1], [0, 1]);

      // 4. Arka Yan Yüzey 2 (Z eksenine paralel arka yüzey)
      addQuadPoints(B0, B2, T2, T0, [-dirX, 0, 0], [0, 0], [1, 0], [1, 1], [0, 1]);

      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
      geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));

      // Multi-material grupları: 0: wedgeTopMat (üst ray pahı), 1: wedgeMat (masif ahşap yan/alt)
      geo.addGroup(0, 3, 0);
      geo.addGroup(3, 21, 1);

      const mesh = new THREE.Mesh(geo, [wedgeTopMat, wedgeMat]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      courseGroup.add(mesh);

      // Fizik verileri
      const v1x = cx + dirX * size;
      const v1z = cz;
      const v2x = cx;
      const v2z = cz + dirZ * size;
      const segDx = v2x - v1x;
      const segDz = v2z - v1z;
      const segLenSq = segDx * segDx + segDz * segDz;

      const minX = Math.min(cx, v1x, v2x) - 0.25;
      const maxX = Math.max(cx, v1x, v2x) + 0.25;
      const minZ = Math.min(cz, v1z, v2z) - 0.25;
      const maxZ = Math.max(cz, v1z, v2z) + 0.25;

      cornerWedges.push({
        cx: cx,
        cz: cz,
        dirX: dirX,
        dirZ: dirZ,
        size: size,
        v1x: v1x,
        v1z: v1z,
        v2x: v2x,
        v2z: v2z,
        segDx: segDx,
        segDz: segDz,
        segLenSq: segLenSq,
        nx: nx,
        nz: nz,
        midX: cx + dirX * size * 0.5,
        midZ: cz + dirZ * size * 0.5,
        minX: minX,
        maxX: maxX,
        minZ: minZ,
        maxZ: maxZ,
        yMin: yBot,
        yMax: yTop + 2.0
      });

      return mesh;
    }

    function addWall(x, y, z, w, h, d) {
      // Duvarın zeminin altına derinlemesine (0.35m aşağıya) uzanması sağlanır.
      // Bu sayede alttan ışık kaçması (peter-panning / light leakage) kesinlikle engellenir!
      const extraDepth = 0.35;
      const visualH = h + extraDepth;
      const visualY = y - extraDepth * 0.5;

      const geo = new THREE.BoxGeometry(w, visualH, d);
      setupWallUVs(geo, w, visualH, d);

      const mesh = new THREE.Mesh(geo, wallMaterials);
      mesh.position.set(x, visualY, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      courseGroup.add(mesh);

      colliders.push({
        box: new THREE.Box3().setFromObject(mesh),
        normal: null
      });
      return mesh;
    }

    // --- Dinamik Tramplin / Zıplama Rampası (Jump Ramp) ---
    function addJumpRamp(x, y, z, w, h, d, pitch) {
      const ramp = addFloor(x, y, z, w, h, d);
      ramp.rotation.x = pitch;
      ramp.updateMatrixWorld(true);

      const rw1 = addWall(x - w * 0.5 + 0.13, y + 0.35, z, 0.26, 0.8, d + 0.1);
      rw1.rotation.x = pitch;
      const rw2 = addWall(x + w * 0.5 - 0.13, y + 0.35, z, 0.26, 0.8, d + 0.1);
      rw2.rotation.x = pitch;

      jumpRamps.push({
        x: x,
        z: z,
        halfW: w * 0.5,
        halfD: d * 0.5,
        pitch: pitch
      });
      return ramp;
    }

    function buildCupAndFlag(pos) {
      // 1. Üç Boyutlu Çukur Kupa Duvarı (3D Sunken Cup Cavity - Açık Silindir İç Yüzey)
      const cupDepth = 0.22;
      const cupRadius = 0.21;
      const cupWallGeo = new THREE.CylinderGeometry(cupRadius, cupRadius * 0.90, cupDepth, 48, 1, true);
      const cupWallTex = createCupWallTexture();
      const cupWallMat = new THREE.MeshStandardMaterial({
        map: cupWallTex,
        roughness: 0.65,
        metalness: 0.15,
        side: THREE.BackSide // Kameranın derinliği ve kupa içini görebilmesi için iç yüzey
      });
      const cupWall = new THREE.Mesh(cupWallGeo, cupWallMat);
      cupWall.position.set(pos.x, pos.y - cupDepth * 0.5 + 0.002, pos.z);
      courseGroup.add(cupWall);

      // 2. Kupanın Çukur Dip Tabanı (Sunken Bottom Floor - Simsiyah Derinlik)
      const cupBottomGeo = new THREE.CircleGeometry(cupRadius * 0.90, 48);
      const cupBottomMat = new THREE.MeshStandardMaterial({
        color: 0x050608,
        roughness: 0.90,
        metalness: 0.05
      });
      const cupBottom = new THREE.Mesh(cupBottomGeo, cupBottomMat);
      cupBottom.rotation.x = -Math.PI / 2;
      cupBottom.position.set(pos.x, pos.y - cupDepth + 0.002, pos.z);
      courseGroup.add(cupBottom);

      // 3. Bayrak Direği Taban Kovası (Merkezdeki metalik kovan soket)
      const socketGeo = new THREE.CylinderGeometry(0.036, 0.040, 0.04, 16);
      const socketMat = new THREE.MeshStandardMaterial({ color: 0x15181c, metalness: 0.4, roughness: 0.5 });
      const socketMesh = new THREE.Mesh(socketGeo, socketMat);
      socketMesh.position.set(pos.x, pos.y - cupDepth + 0.02, pos.z);
      courseGroup.add(socketMesh);

      // 4. Deliğin Üst Çevresindeki Net Beyaz Çember Çizgisi (Net ve belirgin hedef halkası)
      const rimGeo = new THREE.RingGeometry(cupRadius - 0.004, cupRadius + 0.036, 48);
      const rimMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
      const rimMesh = new THREE.Mesh(rimGeo, rimMat);
      rimMesh.rotation.x = -Math.PI / 2;
      rimMesh.position.set(pos.x, pos.y + 0.004, pos.z);
      courseGroup.add(rimMesh);

      // 5. İlgi Çekici Kırmızı-Beyaz Şeritli Bayrak Direği (Kullanıcı Talebi)
      const poleTex = createStripedFlagPoleTexture();
      const poleMat = new THREE.MeshStandardMaterial({
        map: poleTex,
        roughness: 0.25,
        metalness: 0.15
      });
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.020, 0.020, 2.2, 16), poleMat);
      pole.position.set(pos.x, pos.y - cupDepth * 0.5 + 0.95, pos.z);
      pole.castShadow = true;
      courseGroup.add(pole);

      const finial = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 }));
      finial.position.set(pos.x, pos.y - cupDepth * 0.5 + 2.05, pos.z);
      courseGroup.add(finial);

      // 6. Şampiyona Kırmızı Üçgen Bayrak
      const flagGeo = new THREE.BufferGeometry();
      const flagVertices = new Float32Array([
        0, 2.00, 0,
        0.48, 1.82, 0,
        0, 1.64, 0
      ]);
      flagGeo.setAttribute('position', new THREE.BufferAttribute(flagVertices, 3));
      flagGeo.computeVertexNormals();
      const flagMat = new THREE.MeshLambertMaterial({ color: 0xff2535, side: THREE.DoubleSide });
      const flag = new THREE.Mesh(flagGeo, flagMat);
      flag.position.set(pos.x, pos.y - cupDepth * 0.5, pos.z);
      flag.castShadow = true;
      courseGroup.add(flag);
    }

    // --- Golf Battle Tarzı Köşeli Ahşap / Kalas / Kiriş Engeli (Square Timber Beam) ---
    function createWoodLogMesh(length = 1.8, width = 0.34, height = 0.30) {
      const group = new THREE.Group();

      // 1. Ana köşeli ahşap kalas gövdesi (BoxGeometry: length X ekseni boyunca, height Y, width Z)
      const geo = new THREE.BoxGeometry(length, height, width);

      // UV haritalama: uzun yüzeylerde ahşap deseni boylu boyunca aksın
      const uvs = geo.attributes.uv.array;
      const rep = Math.max(1, length / 1.5);
      // BoxGeometry: +Y, -Y, +Z, -Z yüzeyleri (indeks 16...47)
      for (let i = 16; i < 48; i += 2) {
        uvs[i] *= rep;
      }
      geo.attributes.uv.needsUpdate = true;

      // [face+X (end), face-X (end), face+Y (top), face-Y (bottom), face+Z (front), face-Z (back)]
      const materials = [logEndMat, logEndMat, woodMat, woodMat, woodMat, woodMat];
      const beamMesh = new THREE.Mesh(geo, materials);
      beamMesh.castShadow = true;
      beamMesh.receiveShadow = true;
      group.add(beamMesh);

      // 2. Golf Battle tarzı dövme demir sabitleme kelepçeleri (Köşeli metal kuşaklar)
      const strapGeo = new THREE.BoxGeometry(0.055, height * 1.05, width * 1.05);
      const strapMat = new THREE.MeshStandardMaterial({
        color: 0x3d3126,
        roughness: 0.45,
        metalness: 0.65
      });

      const offsetDist = length * 0.5 - 0.16;
      if (offsetDist > 0.15) {
        const strap1 = new THREE.Mesh(strapGeo, strapMat);
        strap1.position.set(-offsetDist, 0, 0);
        strap1.castShadow = true;
        group.add(strap1);

        const strap2 = new THREE.Mesh(strapGeo, strapMat);
        strap2.position.set(offsetDist, 0, 0);
        strap2.castShadow = true;
        group.add(strap2);
      }

      return group;
    }

    function addWoodLog(x, y, z, length = 1.8, width = 0.34, angle = 0, isDrawn = false) {
      // Köşeli kereste boyutları (Genişlik: 0.34m, Yükseklik: 0.30m)
      const beamW = (width !== undefined && width > 0.22) ? width : (width ? width * 2.0 : 0.34);
      const beamH = 0.30;
      const mesh = createWoodLogMesh(length, beamW, beamH);
      mesh.position.set(x, y + beamH * 0.5, z);
      mesh.rotation.y = angle;

      if (isDrawn) {
        // Çizilen duvara özel şık altın/amber neon üst şerit
        const trimGeo = new THREE.BoxGeometry(length * 0.94, 0.03, beamW * 0.45);
        const trimMat = new THREE.MeshStandardMaterial({
          color: 0xffd632,
          emissive: 0xffa500,
          emissiveIntensity: 1.2,
          roughness: 0.2
        });
        const trimMesh = new THREE.Mesh(trimGeo, trimMat);
        trimMesh.position.set(0, beamH * 0.5 + 0.015, 0);
        mesh.add(trimMesh);
      }

      courseGroup.add(mesh);

      woodLogs.push({
        x: x,
        y: y + beamH * 0.5,
        z: z,
        baseY: y,
        length: length,
        halfL: length * 0.5,
        width: beamW,
        halfW: beamW * 0.5,
        height: beamH,
        angle: angle,
        cosA: Math.cos(angle),
        sinA: Math.sin(angle),
        mesh: mesh,
        isDrawn: isDrawn
      });
      return mesh;
    }

      const holeWoodLogs = [

    // --- Camera Orbit & Slingshot Touch Controls ---
    const urlParams = new URLSearchParams(window.location.search);
    let camYaw = urlParams.has('yaw') ? parseFloat(urlParams.get('yaw')) : 0;
    let camPitch = urlParams.has('pitch') ? parseFloat(urlParams.get('pitch')) : 0.42;
    let camDist = urlParams.has('dist') ? parseFloat(urlParams.get('dist')) : 5.4;
    const camHeightOffset = 0.35;
    let cameraLookCurrent = new THREE.Vector3();

    // Interaction modes: 'NONE', 'SLINGSHOT', 'ORBIT', 'PINCH'
    let interactionMode = 'NONE';
    let touchStart = { x: 0, y: 0 };
    let lastPointer = { x: 0, y: 0 };
    let pinchStartDist = 0;
    let pinchStartCamDist = 5.4;
    let lockedCamDir = new THREE.Vector3(0, 0, 1);
    let lockedCamRight = new THREE.Vector3(1, 0, 0);

    let aimDir = new THREE.Vector3(0, 0, 1);
    let powerRatio = 0;
    const maxDragPx = 180;

    const powerBadge = document.getElementById('power-badge');

    function getBallScreenPos() {
      const v = ballPos.clone().project(camera);
      return {
        x: (v.x * 0.5 + 0.5) * window.innerWidth,
        y: (-v.y * 0.5 + 0.5) * window.innerHeight,
        inFront: v.z < 1.0
      };
    }

    function onPointerDown(e) {
      initAudio();
      if (isMoving || isInHole) return;
      if (e.target && e.target.closest && e.target.closest('#hud, #voodoo-mode-bar, #gate-sub-bar, #draw-wall-panel, #modal, #gameover-modal')) {
        return;
      }

      // İki parmakla yakınlaştırma/uzaklaştırma (Pinch-to-zoom)
      if (e.touches && e.touches.length === 2) {
        interactionMode = 'PINCH';
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchStartDist = Math.hypot(dx, dy);
        pinchStartCamDist = camDist;
        return;
      }

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      lastPointer = { x: clientX, y: clientY };

      const ballScreen = getBallScreenPos();
      const distToBall = Math.hypot(clientX - ballScreen.x, clientY - ballScreen.y);

      // Oyuncu dokunduğu anda öğretici el anında kaybolur
      tutorialDismissed = true;
      const tutHandEl = document.getElementById('tutorial-hand');
      if (tutHandEl) tutHandEl.style.display = 'none';

      // 2. Mekanik: Duvar Çizme Modu Aktifse
      if (currentVoodooMode === 'draw' && drawToolActive) {
        if (drawnWalls.length >= maxDrawnWalls) {
          clearDrawnWalls();
        }
        const p = getFloorIntersection(clientX, clientY);
        if (p) {
          interactionMode = 'DRAW_WALL';
          isDrawingWall = true;
          drawStart3D = p.clone();
          drawEnd3D = p.clone();
          if (!drawPreviewMesh) drawPreviewMesh = createDrawPreviewMesh();
          drawPreviewMesh.position.set(p.x, 0.25, p.z);
          drawPreviewMesh.rotation.set(0, 0, 0);
          drawPreviewMesh.scale.set(0.01, 1, 1);
          drawPreviewMesh.visible = true;
          return;
        }
      }

      // Sapan özelliği SADECE topun üzerine dokunulup çekildiğinde çalışır (55px temas yarıçapı)
      if (distToBall <= 55) {
        interactionMode = 'SLINGSHOT';
        touchStart = { x: clientX, y: clientY };
        powerRatio = 0;

        // Dokunma anında kamera yönünü kilitle (Böylece nişan alırken matematik milim şaşmaz)
        lockedCamDir = new THREE.Vector3();
        camera.getWorldDirection(lockedCamDir);
        lockedCamDir.y = 0;
        lockedCamDir.normalize();

        lockedCamRight = new THREE.Vector3();
        lockedCamRight.crossVectors(lockedCamDir, new THREE.Vector3(0, 1, 0)).normalize();
      } else {
        // Ekranda top harici herhangi bir yere dokunulursa: Sadece kamera açısı döner
        interactionMode = 'ORBIT';
      }
    }

    function onPointerMove(e) {
      if (isMoving || isInHole) return;
      if (e.cancelable && interactionMode !== 'NONE') e.preventDefault();

      // İki parmakla yakınlaştırma hareketi
      if (interactionMode === 'PINCH' && e.touches && e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const curDist = Math.hypot(dx, dy);
        if (pinchStartDist > 10) {
          const factor = pinchStartDist / Math.max(10, curDist);
          camDist = Math.max(2.8, Math.min(12.0, pinchStartCamDist * factor));
        }
        return;
      }

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const prevX = (lastPointer && lastPointer.x !== undefined) ? lastPointer.x : clientX;
      const prevY = (lastPointer && lastPointer.y !== undefined) ? lastPointer.y : clientY;
      lastPointer = { x: clientX, y: clientY };

      if (interactionMode === 'DRAW_WALL' && isDrawingWall && drawStart3D) {
        const curP = getFloorIntersection(clientX, clientY);
        if (curP) {
          drawEnd3D = curP.clone();
          const dx = drawEnd3D.x - drawStart3D.x;
          const dz = drawEnd3D.z - drawStart3D.z;
          const len = Math.hypot(dx, dz);
          if (len > 0.05) {
            const midX = (drawStart3D.x + drawEnd3D.x) * 0.5;
            const midZ = (drawStart3D.z + drawEnd3D.z) * 0.5;
            const angle = Math.atan2(-dz, dx);
            drawPreviewMesh.position.set(midX, 0.25, midZ);
            drawPreviewMesh.rotation.y = angle;
            drawPreviewMesh.scale.set(Math.max(len, 0.1), 1, 1);
            drawPreviewMesh.visible = true;
          }
        }
        return;
      }

      if (interactionMode === 'ORBIT') {
        const dx = clientX - prevX;
        const dy = clientY - prevY;

        // Ekran kaydırması ile kamera açısını top etrafında pürüzsüz döndür
        camYaw -= dx * 0.0065;
        camPitch = Math.max(0.12, Math.min(1.25, camPitch + dy * 0.0045));
        return;
      }

      if (interactionMode === 'SLINGSHOT') {
        // Sapan çekiş vektörü: Kamera 100% kilitlidir, top ekranda milim oynamaz!
        const pullX = clientX - touchStart.x;
        const pullY = clientY - touchStart.y;
        const dist = Math.hypot(pullX, pullY);

        if (dist > 8) {
          powerRatio = Math.min(dist / maxDragPx, 1.0);

          const normForward = pullY / dist;  // geriye (kendimize) doğru çekildikçe ileri fırlar
          const normRight = -pullX / dist;   // sola çekildikçe sağa fırlar

          aimDir.copy(lockedCamDir).multiplyScalar(normForward).addScaledVector(lockedCamRight, normRight);
          aimDir.y = 0;
          aimDir.normalize();

          updateAimVisuals();
        } else {
          powerRatio = 0;
          hideAimVisuals();
        }
      }
    }

    function onPointerUp(e) {
      if (interactionMode === 'PINCH') {
        interactionMode = 'NONE';
        return;
      }

      if (interactionMode === 'DRAW_WALL' && isDrawingWall && drawStart3D) {
        if (drawPreviewMesh) drawPreviewMesh.visible = false;
        isDrawingWall = false;
        interactionMode = 'NONE';

        if (e && e.changedTouches && e.changedTouches.length > 0) {
          const t = e.changedTouches[0];
          const curP = getFloorIntersection(t.clientX, t.clientY);
          if (curP) drawEnd3D = curP.clone();
        } else if (lastPointer) {
          const curP = getFloorIntersection(lastPointer.x, lastPointer.y);
          if (curP) drawEnd3D = curP.clone();
        }

        if (drawEnd3D && drawStart3D) {
          const dx = drawEnd3D.x - drawStart3D.x;
          const dz = drawEnd3D.z - drawStart3D.z;
          const len = Math.hypot(dx, dz);
          if (len >= 0.20) {
            const midX = (drawStart3D.x + drawEnd3D.x) * 0.5;
            const midZ = (drawStart3D.z + drawEnd3D.z) * 0.5;
            const angle = Math.atan2(-dz, dx);
            const wallLen = Math.max(0.8, Math.min(len, 4.8));
            const wallMesh = addWoodLog(midX, 0.10, midZ, wallLen, 0.34, angle, true);
            drawnWalls.push(wallMesh);
            createSparkBurst(midX, 0.25, midZ, 0xffd632);
            playWallSpawn();
            triggerHaptic('medium');

            if (drawnWalls.length >= maxDrawnWalls) {
              showVoodooToast("🎯 Duvar(lar) Kuruldu! Şimdi Topu Sektir!");
              setDrawTool('shoot');
            } else {
              showVoodooToast(`✏️ 1. Duvar Kuruldu! (${drawnWalls.length}/${maxDrawnWalls}) - İkinciyi Çiz!`);
            }
            updateDrawUI();
          } else if (len > 0.05) {
            showVoodooToast("⚠️ Biraz daha uzun çizgi çek!");
          }
        }
        return;
      }

      if (interactionMode === 'SLINGSHOT') {
        hideAimVisuals();
        if (powerRatio >= 0.04 && !isMoving && !isInHole) {
          shootBall(aimDir, powerRatio);
        }
      }
      interactionMode = 'NONE';
      powerRatio = 0;
    }

    function getAimColor(t) {
      const clampedT = Math.max(0, Math.min(1, t));
      let r, g, b, er, eg, eb;
      if (clampedT < 0.5) {
        const k = clampedT / 0.5;
        r = Math.round(0 + k * 255);
        g = Math.round(245 - k * 50);
        b = Math.round(120 - k * 120);
        er = Math.round(0 + k * 230);
        eg = Math.round(210 - k * 50);
        eb = Math.round(80 - k * 80);
      } else {
        const k = (clampedT - 0.5) / 0.5;
        r = 255;
        g = Math.round(195 - k * 165);
        b = Math.round(0 + k * 75);
        er = 255;
        eg = Math.round(160 - k * 145);
        eb = Math.round(0 + k * 60);
      }
      const hex = (r << 16) | (g << 8) | b;
      const emissiveHex = (er << 16) | (eg << 8) | eb;
      const hexStr = '#' + hex.toString(16).padStart(6, '0');
      return { hex, emissiveHex, hexStr };
    }

    // --- 2D Ray-Segment Çarpışma ve Açılı Bant Sekme Kılavuzu (Ricochet Trajectory) ---
    function intersectAimRaySegment(p1x, p1z, p2x, p2z, s1x, s1z, s2x, s2z) {
      const rDx = p2x - p1x;
      const rDz = p2z - p1z;
      const sDx = s2x - s1x;
      const sDz = s2z - s1z;

      const denom = rDx * sDz - rDz * sDx;
      if (Math.abs(denom) < 1e-6) return null;

      const t = ((s1x - p1x) * sDz - (s1z - p1z) * sDx) / denom;
      const u = ((s1x - p1x) * rDz - (s1z - p1z) * rDx) / denom;

      if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
        const totalDist = Math.hypot(rDx, rDz);
        return { dist: t * totalDist, t, x: p1x + t * rDx, z: p1z + t * rDz };
      }
      return null;
    }

    function computeAimTrajectory(originX, originZ, dirX, dirZ, maxDist) {
      const segments = [];
      let curX = originX;
      let curZ = originZ;
      let curDx = dirX;
      let curDz = dirZ;
      let remDist = maxDist;

      // Maksimum 2 kez sekme hesaplanır (Trickshot kalitesi)
      for (let bounce = 0; bounce < 2 && remDist > 0.05; bounce++) {
        let closestT = remDist;
        let hitNormX = 0;
        let hitNormZ = 0;
        let didHit = false;

        // 1. Köşe Pahları (45-derece ahşap bantlar)
        for (let i = 0; i < cornerWedges.length; i++) {
          const w = cornerWedges[i];
          const s1x = w.v1x + w.nx * ballRadius;
          const s1z = w.v1z + w.nz * ballRadius;
          const s2x = w.v2x + w.nx * ballRadius;
          const s2z = w.v2z + w.nz * ballRadius;

          const dot = curDx * w.nx + curDz * w.nz;
          if (dot < -0.01) {
            const hit = intersectAimRaySegment(curX, curZ, curX + curDx * remDist, curZ + curDz * remDist, s1x, s1z, s2x, s2z);
            if (hit && hit.dist < closestT && hit.dist > 0.05) {
              closestT = hit.dist;
              hitNormX = w.nx;
              hitNormZ = w.nz;
              didHit = true;
            }
          }
        }

        // 2. Düz Duvarlar (Kutu Çarpışıcılar)
        for (let i = 0; i < colliders.length; i++) {
          const c = colliders[i];
          const minX = c.box.min.x - ballRadius;
          const maxX = c.box.max.x + ballRadius;
          const minZ = c.box.min.z - ballRadius;
          const maxZ = c.box.max.z + ballRadius;

          // Güney yüzey
          if (curDz > 0.01) {
            const hit = intersectAimRaySegment(curX, curZ, curX + curDx * remDist, curZ + curDz * remDist, minX, minZ, maxX, minZ);
            if (hit && hit.dist < closestT && hit.dist > 0.05) {
              closestT = hit.dist;
              hitNormX = 0; hitNormZ = -1; didHit = true;
            }
          }
          // Kuzey yüzey
          if (curDz < -0.01) {
            const hit = intersectAimRaySegment(curX, curZ, curX + curDx * remDist, curZ + curDz * remDist, minX, maxZ, maxX, maxZ);
            if (hit && hit.dist < closestT && hit.dist > 0.05) {
              closestT = hit.dist;
              hitNormX = 0; hitNormZ = 1; didHit = true;
            }
          }
          // Batı yüzey
          if (curDx > 0.01) {
            const hit = intersectAimRaySegment(curX, curZ, curX + curDx * remDist, curZ + curDz * remDist, minX, minZ, minX, maxZ);
            if (hit && hit.dist < closestT && hit.dist > 0.05) {
              closestT = hit.dist;
              hitNormX = -1; hitNormZ = 0; didHit = true;
            }
          }
          // Doğu yüzey
          if (curDx < -0.01) {
            const hit = intersectAimRaySegment(curX, curZ, curX + curDx * remDist, curZ + curDz * remDist, maxX, minZ, maxX, maxZ);
            if (hit && hit.dist < closestT && hit.dist > 0.05) {
              closestT = hit.dist;
              hitNormX = 1; hitNormZ = 0; didHit = true;
            }
          }
        }

        // 3. Ahşap Kalas / Kiriş Engelleri (Wood Logs)
        for (let i = 0; i < woodLogs.length; i++) {
          const log = woodLogs[i];
          const hw = log.halfW + ballRadius;
          const hl = log.halfL + ballRadius;
          const corners = [
            { lx: -hl, lz: -hw },
            { lx:  hl, lz: -hw },
            { lx:  hl, lz:  hw },
            { lx: -hl, lz:  hw }
          ].map(p => ({
            x: log.x + p.lx * log.cosA + p.lz * log.sinA,
            z: log.z - p.lx * log.sinA + p.lz * log.cosA
          }));

          for (let e = 0; e < 4; e++) {
            const pA = corners[e];
            const pB = corners[(e + 1) % 4];
            const edx = pB.x - pA.x;
            const edz = pB.z - pA.z;
            const eLen = Math.hypot(edx, edz);
            if (eLen < 0.001) continue;
            const enx = edz / eLen;
            const enz = -edx / eLen;
            const dot = curDx * enx + curDz * enz;
            if (dot < -0.01) {
              const hit = intersectAimRaySegment(curX, curZ, curX + curDx * remDist, curZ + curDz * remDist, pA.x, pA.z, pB.x, pB.z);
              if (hit && hit.dist < closestT && hit.dist > 0.05) {
                closestT = hit.dist;
                hitNormX = enx;
                hitNormZ = enz;
                didHit = true;
              }
            }
          }
        }

        // 5. Kilitli Delik Enerji Kalkanı (Cup Shield Gate)
        if (isCupLocked && cupShieldGate && !cupShieldGate.shattering) {
          const rx = curX - cupShieldGate.pos.x;
          const rz = curZ - cupShieldGate.pos.z;
          const b = rx * curDx + rz * curDz;
          const c = rx * rx + rz * rz - (cupShieldGate.radius + ballRadius) * (cupShieldGate.radius + ballRadius);
          if (c > 0 && b < 0) {
            const discr = b * b - c;
            if (discr >= 0) {
              const t = -b - Math.sqrt(discr);
              if (t > 0.05 && t < closestT) {
                closestT = t;
                const hx = curX + curDx * t - cupShieldGate.pos.x;
                const hz = curZ + curDz * t - cupShieldGate.pos.z;
                const hlen = Math.hypot(hx, hz) || 1;
                hitNormX = hx / hlen;
                hitNormZ = hz / hlen;
                didHit = true;
              }
            }
          }
        }

        // 6. Kuantum Portal Işın Kırılması & Boyut Atlama
        let hitPortal = null;
        for (let p = 0; p < portalPairs.length; p++) {
          const pair = portalPairs[p];
          const dot = curDx * pair.blue.norm.x + curDz * pair.blue.norm.z;
          if (dot > 0.05) {
            const toCenter = { x: pair.blue.pos.x - curX, z: pair.blue.pos.z - curZ };
            const t = (toCenter.x * pair.blue.norm.x + toCenter.z * pair.blue.norm.z) / dot;
            if (t > 0.05 && t < closestT) {
              const px = curX + curDx * t;
              const pz = curZ + curDz * t;
              const dist = Math.hypot(px - pair.blue.pos.x, pz - pair.blue.pos.z);
              if (dist <= pair.blue.radius) {
                closestT = t;
                hitPortal = pair;
                didHit = true;
              }
            }
          }
        }

        if (hitPortal) {
          segments.push({
            x1: curX, z1: curZ,
            x2: curX + curDx * closestT, z2: curZ + curDz * closestT,
            dist: closestT,
            dirX: curDx, dirZ: curDz
          });
          curX = hitPortal.orange.pos.x + hitPortal.orange.norm.x * 0.40;
          curZ = hitPortal.orange.pos.z + hitPortal.orange.norm.z * 0.40;
          curDx = hitPortal.orange.norm.x;
          curDz = hitPortal.orange.norm.z;
          remDist -= closestT;
          continue;
        }

        if (didHit) {
          segments.push({
            x1: curX, z1: curZ,
            x2: curX + curDx * closestT, z2: curZ + curDz * closestT,
            dist: closestT,
            dirX: curDx, dirZ: curDz
          });

          curX = curX + curDx * closestT;
          curZ = curZ + curDz * closestT;
          remDist -= closestT;

          // Yansıma vektörü hesabı: r = d - 2*(d.n)*n
          const vDotN = curDx * hitNormX + curDz * hitNormZ;
          curDx = curDx - 2 * vDotN * hitNormX;
          curDz = curDz - 2 * vDotN * hitNormZ;
          const len = Math.hypot(curDx, curDz);
          if (len > 0.001) {
            curDx /= len;
            curDz /= len;
          }
        } else {
          segments.push({
            x1: curX, z1: curZ,
            x2: curX + curDx * remDist, z2: curZ + curDz * remDist,
            dist: remDist,
            dirX: curDx, dirZ: curDz
          });
          remDist = 0;
          break;
        }
      }

      return segments;
    }

    function updateAimVisuals() {
      aim3DGroup.visible = true;

      const aimCol = getAimColor(powerRatio);
      const activeCount = Math.min(Math.max(Math.floor(powerRatio * (maxBars - 0.1)) + 1, 1), maxBars);
      const spacing = 0.28 + powerRatio * 0.14;
      const animPhase = gameElapsedTime * 7.5;

      const totalAimDist = 0.30 + activeCount * spacing;
      const trajectory = computeAimTrajectory(ballPos.x, ballPos.z, aimDir.x, aimDir.z, totalAimDist);

      for (let i = 0; i < maxBars; i++) {
        if (i < activeCount) {
          const targetDistAlongPath = 0.30 + (i + 1) * spacing;

          let distAcc = 0;
          let targetX = ballPos.x + aimDir.x * targetDistAlongPath;
          let targetZ = ballPos.z + aimDir.z * targetDistAlongPath;
          let barDirX = aimDir.x;
          let barDirZ = aimDir.z;

          for (let s = 0; s < trajectory.length; s++) {
            const seg = trajectory[s];
            if (targetDistAlongPath <= distAcc + seg.dist || s === trajectory.length - 1) {
              const segT = Math.max(0, Math.min(seg.dist, targetDistAlongPath - distAcc));
              targetX = seg.x1 + seg.dirX * segT;
              targetZ = seg.z1 + seg.dirZ * segT;
              barDirX = seg.dirX;
              barDirZ = seg.dirZ;
              break;
            }
            distAcc += seg.dist;
          }

          const barAngle = Math.atan2(barDirX, barDirZ);

          // Zemin kotunu ve rampa eğimini tam örnekle
          const groundY = (getGroundHeight(targetX, targetZ, ballPos.y - ballRadius) ?? (ballPos.y - ballRadius)) + 0.024;
          const aheadDist = 0.16;
          const aheadY = (getGroundHeight(targetX + barDirX * aheadDist, targetZ + barDirZ * aheadDist, groundY) ?? groundY);
          const slopePitch = Math.atan2(aheadY - groundY, aheadDist);

          aimBars[i].position.set(targetX, groundY, targetZ);
          aimBars[i].rotation.set(0, 0, 0);
          aimBars[i].rotation.y = barAngle;
          aimBars[i].rotateX(-slopePitch);

          // Aerodinamik barem genişlemesi
          const barScaleX = 0.85 + (i / maxBars) * 0.45;
          const barScaleZ = 0.80 + (i / maxBars) * 0.30;
          aimBars[i].scale.set(barScaleX, 1, barScaleZ);

          const barRatio = (i + 1) / maxBars;
          const barCol = getAimColor(barRatio);

          const pulse = 0.70 + 0.35 * Math.sin(animPhase - i * 0.65);
          aimBars[i].material.color.setHex(barCol.hex);
          aimBars[i].material.emissive.setHex(barCol.emissiveHex);
          aimBars[i].material.emissiveIntensity = 0.60 * pulse + (i === activeCount - 1 ? 0.30 : 0.10);
          aimBars[i].visible = true;
        } else {
          aimBars[i].visible = false;
        }
      }

      // Uçtaki Hedef Göstergesi Yayı ve Lazer Noktası (Sekme açısını takip eder)
      const lastSeg = trajectory[trajectory.length - 1];
      const tipX = lastSeg ? lastSeg.x2 : ballPos.x + aimDir.x * totalAimDist;
      const tipZ = lastSeg ? lastSeg.z2 : ballPos.z + aimDir.z * totalAimDist;
      const tipDirX = lastSeg ? lastSeg.dirX : aimDir.x;
      const tipDirZ = lastSeg ? lastSeg.dirZ : aimDir.z;
      const tipAngle = Math.atan2(tipDirX, tipDirZ);

      const tipGroundY = (getGroundHeight(tipX, tipZ, ballPos.y - ballRadius) ?? (ballPos.y - ballRadius)) + 0.026;
      const tipAheadY = (getGroundHeight(tipX + tipDirX * 0.16, tipZ + tipDirZ * 0.16, tipGroundY) ?? tipGroundY);
      const tipSlope = Math.atan2(tipAheadY - tipGroundY, 0.16);

      reticleArcMesh.position.set(tipX, tipGroundY, tipZ);
      reticleArcMesh.rotation.set(0, 0, 0);
      reticleArcMesh.rotation.y = tipAngle;
      reticleArcMesh.rotateX(-tipSlope);
      const arcScale = 0.95 + powerRatio * 0.35;
      reticleArcMesh.scale.set(arcScale, arcScale, arcScale);
      reticleArcMesh.material.color.setHex(aimCol.hex);
      reticleArcMesh.material.emissive.setHex(aimCol.emissiveHex);
      reticleArcMesh.material.emissiveIntensity = 0.90 + powerRatio * 0.30;
      reticleArcMesh.visible = true;

      reticlePipMesh.position.set(tipX, tipGroundY + 0.005, tipZ);
      reticlePipMesh.rotation.set(0, 0, 0);
      reticlePipMesh.rotation.y = tipAngle;
      reticlePipMesh.rotateX(-tipSlope);
      reticlePipMesh.material.color.setHex(aimCol.hex);
      reticlePipMesh.material.emissive.setHex(aimCol.emissiveHex);
      reticlePipMesh.visible = true;
    }

    function hideAimVisuals() {
      aim3DGroup.visible = false;
      // powerBadge zaten gizli
      for (let i = 0; i < maxBars; i++) {
        aimBars[i].visible = false;
      }
      reticleArcMesh.visible = false;
      reticlePipMesh.visible = false;
    }

    function shootBall(dir, power) {
      isMoving = true;
      isAirborne = false;
      strokes++;
      updateHUD();
      lastSafePos.copy(ballPos);

      // Hassas kısa vuruşlar (putt) ve güçlü uzun atışlar:
      // 5% çekme: ~0.65 m/s (nazik kısa dokunuş)
      // 20% çekme: ~2.3 m/s (orta-kısa mesafe)
      // 50% çekme: ~10.2 m/s (sağlam fairway sürüşü)
      // 100% çekme: ~34.5 m/s (tam güç roket atış)
      const curvedPower = Math.pow(power, 1.8);
      const speed = 0.5 + curvedPower * 34.0;
      ballVel.copy(dir).multiplyScalar(speed);
      ballVel.y = 0;

      playPutt(power);
    }
