<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MiniGolf 3D">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Velocity Mini-Golf 3D (Mobile Edition)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #6bb4de;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }
    /* Top HUD - Premium Golf Championship Bar */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      box-sizing: border-box;
      padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
      padding-bottom: 8px;
      padding-left: 12px;
      padding-right: 12px;
      background: linear-gradient(180deg, rgba(6, 18, 10, 0.94) 0%, rgba(6, 18, 10, 0.78) 70%, rgba(6, 18, 10, 0.0) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      z-index: 10;
    }
    #hud::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 12px;
      right: 12px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 214, 50, 0.35), rgba(77, 243, 115, 0.35), transparent);
    }
    .hud-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #hole-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1fc953, #0d8a2e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      color: #fff;
      box-shadow: 0 2px 8px rgba(31, 201, 83, 0.4);
      flex-shrink: 0;
    }
    #hole-name {
      font-weight: 700;
      font-size: 13px;
      color: #e8f5ec;
      max-width: 90px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.2px;
    }
    .hud-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      pointer-events: none;
    }
    #par-badge {
      background: rgba(255, 214, 50, 0.15);
      border: 1px solid rgba(255, 214, 50, 0.35);
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      color: #ffd632;
      letter-spacing: 0.4px;
    }
    .hud-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #stroke-badge {
      background: linear-gradient(135deg, rgba(77, 243, 115, 0.2), rgba(77, 243, 115, 0.08));
      border: 1px solid rgba(77, 243, 115, 0.4);
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 800;
      color: #4df373;
      letter-spacing: 0.3px;
    }
    .stroke-icon {
      font-size: 13px;
    }
    #restart-btn {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 0.12s, background 0.12s;
      flex-shrink: 0;
      padding: 0;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #restart-btn:active {
      transform: scale(0.88);
      background: rgba(255, 255, 255, 0.28);
    }
    /* Slingshot Power Badge */
    #power-badge {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 16, 20, 0.88);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 6px 18px;
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.5px;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      z-index: 10;
    }
    /* Restart Button */
    #restart-btn {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      margin-left: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 0.12s, background 0.12s;
      flex-shrink: 0;
      padding: 0;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #restart-btn:active {
      transform: scale(0.88);
      background: rgba(255, 255, 255, 0.28);
    }

    /* Voodoo Style Dynamic Tutorial Hand & Slingshot Guide */
    #tutorial-hand {
      position: absolute;
      pointer-events: none;
      z-index: 50;
      width: 0;
      height: 0;
      display: none;
    }
    .tut-touch-pulse {
      position: absolute;
      left: 0;
      top: 0;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid #4df373;
      background: rgba(77, 243, 115, 0.25);
      animation: tutPulse 2.0s ease-out infinite;
    }
    @keyframes tutPulse {
      0% { transform: translate(-50%, -50%) scale(0.7); opacity: 0.9; }
      50% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
    }
    .tut-aim-guide {
      position: absolute;
      left: 0;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateX(-50%);
      animation: tutBeam 2.0s ease-in-out infinite;
    }
    .tut-arrow {
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 18px solid #4df373;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 10px rgba(77, 243, 115, 1));
    }
    .tut-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4df373;
      margin: 5px 0;
      box-shadow: 0 0 8px rgba(77, 243, 115, 1);
    }
    @keyframes tutBeam {
      0%, 100% { opacity: 0.85; transform: translateX(-50%) translateY(0); }
      50% { opacity: 1; transform: translateX(-50%) translateY(-14px); }
    }
    .tut-hand-icon {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-32px, -18px);
      animation: tutDragHand 2.0s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    @keyframes tutDragHand {
      0% { transform: translate(-32px, -18px) scale(1); }
      15% { transform: translate(-32px, -18px) scale(0.92); }
      55%, 70% { transform: translate(-32px, calc(-18px + 75px)) scale(0.88); }
      82% { transform: translate(-32px, -18px) scale(1.05); }
      100% { transform: translate(-32px, -18px) scale(1); }
    }
    .tut-pill-badge {
      position: absolute;
      left: 0;
      top: 72px;
      transform: translateX(-50%);
      background: rgba(6, 18, 10, 0.94);
      border: 1.5px solid rgba(77, 243, 115, 0.8);
      border-radius: 20px;
      padding: 6px 14px;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: tutPillPulse 2.0s ease-in-out infinite;
    }
    @keyframes tutPillPulse {
      0%, 100% { transform: translateX(-50%) scale(1.0); }
      50% { transform: translateX(-50%) scale(1.06); }
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 150;
    }

    /* Instruction Hint (Hidden in Voodoo style - replaced by animated tutorial hand) */
    #hint {
      display: none !important;
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 14, 10, 0.72);
      border-radius: 16px;
      padding: 8px 16px;
      color: #e5f5eb;
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      z-index: 10;
      text-align: center;
      width: 86%;
      max-width: 320px;
    }
    /* Modal */
    #modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-card {
      background: rgba(14, 28, 18, 0.95);
      border: 2px solid rgba(255, 222, 67, 0.4);
      border-radius: 28px;
      padding: 30px 24px;
      width: 85%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-title {
      font-size: 26px;
      font-weight: 900;
      color: #ffde43;
      margin-bottom: 8px;
    }
    .modal-stars {
      font-size: 34px;
      margin: 10px 0;
      color: #ffd214;
    }
    .modal-score {
      font-size: 16px;
      color: #fff;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .modal-btn {
      background: linear-gradient(135deg, #1fc953, #169e3f);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 18px;
      padding: 14px 28px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(31, 201, 83, 0.4);
    }
  
    /* Voodoo Innovation Top Bar */
    #voodoo-mode-bar {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 50px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(8, 16, 12, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      padding: 4px 6px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 12;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      max-width: 96%;
      overflow-x: auto;
      white-space: nowrap;
    }
    .voodoo-tab {
      background: transparent;
      border: 1px solid transparent;
      color: #b8d4c2;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .voodoo-tab:active {
      transform: scale(0.94);
    }
    .voodoo-tab.active {
      background: linear-gradient(135deg, #1fc953, #169e3f);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 2px 8px rgba(31, 201, 83, 0.45);
    }

    /* Voodoo Guidance Dynamic Toast */
    #voodoo-toast {
      display: none;
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 126px);
      left: 50%;
      transform: translateX(-50%) scale(1);
      background: rgba(10, 20, 15, 0.94);
      border: 1.5px solid #4df373;
      border-radius: 16px;
      padding: 6px 16px;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.3px;
      pointer-events: none;
      z-index: 15;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      transition: opacity 0.25s ease, transform 0.25s ease;
      white-space: nowrap;
      text-align: center;
      opacity: 0;
    }

    /* Unit 2: Şalter & Kilit Sub-Navigation Bar */
    #gate-sub-bar {
      display: none;
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 88px);
      left: 50%;
      transform: translateX(-50%);
      align-items: center;
      gap: 5px;
      background: rgba(8, 20, 14, 0.94);
      border: 1px solid rgba(0, 255, 136, 0.35);
      border-radius: 18px;
      padding: 3px 6px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 12;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      max-width: 96%;
      overflow-x: auto;
      white-space: nowrap;
    }
    .gate-sub-tab {
      background: transparent;
      border: 1px solid transparent;
      color: #9cd3ae;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .gate-sub-tab:active {
      transform: scale(0.94);
    }
    .gate-sub-tab.active {
      background: linear-gradient(135deg, #00e676, #00a84e);
      color: #061e0f;
      font-weight: 800;
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 2px 8px rgba(0, 230, 118, 0.45);
    }

    #draw-sub-bar {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 88px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(18, 16, 8, 0.92);
      border: 1px solid rgba(255, 214, 50, 0.45);
      border-radius: 18px;
      padding: 3px 8px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 12;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      max-width: 96%;
      overflow-x: auto;
      white-space: nowrap;
    }
    .draw-sub-tab {
      background: transparent;
      border: 1px solid transparent;
      color: #ffd632;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .draw-sub-tab:active {
      transform: scale(0.94);
    }
    .draw-sub-tab.active {
      background: linear-gradient(135deg, #ffd632, #ffaa00);
      color: #1a1202;
      font-weight: 800;
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 2px 8px rgba(255, 214, 50, 0.45);
    }

    /* Draw-a-Bant Floating Controls (Option 2) */
    #draw-wall-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 18, 14, 0.94);
      border: 1.5px solid rgba(255, 214, 50, 0.6);
      border-radius: 22px;
      padding: 6px 12px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 25;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5);
    }
    .draw-mode-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      padding: 7px 12px;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.12s;
    }
    .draw-mode-btn.active {
      background: linear-gradient(135deg, #ffd632, #f5a623);
      color: #1a1a1a;
      border-color: #ffe680;
      box-shadow: 0 2px 10px rgba(255, 214, 50, 0.5);
    }
    .draw-action-btn {
      background: rgba(255, 75, 75, 0.2);
      border: 1px solid rgba(255, 75, 75, 0.4);
      border-radius: 14px;
      padding: 7px 10px;
      color: #ff9999;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    #draw-status-badge {
      color: #ffd632;
      font-size: 11px;
      font-weight: 800;
      padding: 0 4px;
    }

  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <div class="hud-left">
      <div id="hole-num">1</div>
      <div id="hole-name">İlk Vuruş</div>
    </div>
    <div class="hud-center">
      <div id="par-badge">PAR 2</div>
    </div>
    <div class="hud-right">
      <span class="stroke-icon">🏌️</span>
      <div id="stroke-badge">0</div>
      <button id="restart-btn" onclick="retryHole()" title="Yeniden Başlat">🔄</button>
    </div>
  </div>

  <!-- Voodoo Innovation Mode Switcher Bar -->
  <div id="voodoo-mode-bar">
    <button class="voodoo-tab active" id="tab-classic" onclick="switchVoodooMode('classic')">⛳ Klasik</button>
    <button class="voodoo-tab" id="tab-gate" onclick="switchVoodooMode('gate')">🔒 1. Şalter & Kilit</button>
    <button class="voodoo-tab" id="tab-draw" onclick="switchVoodooMode('draw')">✏️ 2. Duvar Çiz</button>
    <button class="voodoo-tab" id="tab-portal" onclick="switchVoodooMode('portal')">🌀 3. Portal</button>
  </div>

  <!-- Şalter & Kilit Seviye Seçim Barı (Unit 2: 5 Handcrafted Levels) -->
  <div id="gate-sub-bar" style="display:none;">
    <button class="gate-sub-tab active" id="gate-tab-0" onclick="loadGateHole(0)">1. İlk Şalter</button>
    <button class="gate-sub-tab" id="gate-tab-1" onclick="loadGateHole(1)">2. Açılı Bant</button>
    <button class="gate-sub-tab" id="gate-tab-2" onclick="loadGateHole(2)">3. Çifte Kilit</button>
    <button class="gate-sub-tab" id="gate-tab-3" onclick="loadGateHole(3)">4. Dönen Rotor</button>
    <button class="gate-sub-tab" id="gate-tab-4" onclick="loadGateHole(4)">5. Zirve 🏆</button>
  </div>

  <!-- Duvar Çiz Seviye Seçim Barı (Unit 3: 5 Handcrafted Levels) -->
  <div id="draw-sub-bar" style="display:none;">
    <button class="draw-sub-tab active" id="draw-tab-0" onclick="loadDrawHole(0)">1. İlk Bant</button>
    <button class="draw-sub-tab" id="draw-tab-1" onclick="loadDrawHole(1)">2. V-Sektirme</button>
    <button class="draw-sub-tab" id="draw-tab-2" onclick="loadDrawHole(2)">3. Uçurum</button>
    <button class="draw-sub-tab" id="draw-tab-3" onclick="loadDrawHole(3)">4. Çifte Bant 2x</button>
    <button class="draw-sub-tab" id="draw-tab-4" onclick="loadDrawHole(4)">5. Zirve 🏆</button>
  </div>

  <!-- Dynamic Guidance Toast for Voodoo Mechanics -->
  <div id="voodoo-toast"></div>

  <!-- Draw-a-Bant Floating Controls (Option 2) -->
  <div id="draw-wall-panel" style="display:none;">
    <button id="draw-btn-draw" class="draw-mode-btn active" onclick="setDrawTool('draw')">✏️ Duvar Çiz</button>
    <button id="draw-btn-shoot" class="draw-mode-btn" onclick="setDrawTool('shoot')">🏌️ Vuruş Yap</button>
    <button id="draw-btn-clear" class="draw-action-btn" onclick="clearDrawnWalls()">🗑️ Temizle</button>
    <span id="draw-status-badge">Bant: 0/1</span>
  </div>


  <div id="power-badge" style="display:none !important;"></div>

  <div id="tutorial-hand">
    <div class="tut-touch-pulse"></div>
    <div class="tut-aim-guide">
      <div class="tut-arrow"></div>
      <div class="tut-dot"></div>
      <div class="tut-dot"></div>
      <div class="tut-dot"></div>
      <div class="tut-dot"></div>
    </div>
    <div class="tut-hand-icon">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="18" r="14" fill="rgba(77,243,115,0.30)" />
        <circle cx="32" cy="18" r="6" fill="#4df373" />
        <path d="M32 20 C28 20 25 24 25 30 L25 40 C25 46 29 50 34 50 L38 50 C43 50 47 46 47 40 L47 35 C47 32 45 30 42 30 C40 30 39 31 38 32 L38 25 C38 22 35 20 32 20 Z" fill="white" stroke="#1f2937" stroke-width="2.6" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="tut-pill-badge">🎯 Topu Geri Çek ve Bırak</div>
  </div>
  <canvas id="confetti-canvas"></canvas>

  <div id="hint">🎯 Vuruş: Topa dokun ve geri çek | 🔄 Kamera: Boşlukta kaydır</div>

  <script>
    // --- iOS Safari & Mobile Compatible Web Audio Engine ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new AudioCtx();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        // iOS WebKit Audio Unlock: Boş sessiz buffer çalarak donanım ses kanalını anında aç
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
      } catch (err) {
        console.warn('Audio init warning:', err);
      }
    }

    // Mobilde ilk dokunmada (touchstart, touchend, pointerdown, click) ses kilidini kaldır
    const unlockEvents = ['touchstart', 'touchend', 'pointerdown', 'mousedown', 'click'];
    function unlockOnFirstTouch() {
      initAudio();
      unlockEvents.forEach(evt => window.removeEventListener(evt, unlockOnFirstTouch, true));
    }
    unlockEvents.forEach(evt => window.addEventListener(evt, unlockOnFirstTouch, { capture: true, passive: false }));

    function ensureAudioReady() {
      if (!audioCtx) initAudio();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // --- Mobile Haptic Feedback (Titreşim) Motoru ---
    function triggerHaptic(type = 'light') {
      // 1. Standart HTML5 Vibration API (Android Chrome, Edge vb.)
      try {
        if (navigator && typeof navigator.vibrate === 'function') {
          if (type === 'light') navigator.vibrate(15);
          else if (type === 'medium') navigator.vibrate(28);
          else if (type === 'hole') navigator.vibrate([25, 45, 35, 45, 60]);
        }
      } catch (err) {}

      // 2. iOS Safari Taptic Engine Workaround (Native Switch Hack)
      try {
        const hapticLabel = document.getElementById('ios-haptic-label');
        if (hapticLabel) {
          hapticLabel.click();
        }
      } catch (err) {}
    }

    function playPutt(p) {
      const ctx = ensureAudioReady();
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(160 + p * 120, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.12);
      gain.gain.setValueAtTime(0.5 + p * 0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.12);
    }

    function playBounce() {
      triggerHaptic('light');
      const ctx = ensureAudioReady();
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(280, t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 0.08);
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.08);
    }

    function playBumper() {
      triggerHaptic('medium');
      const ctx = ensureAudioReady();
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(784, t);
      osc.frequency.exponentialRampToValueAtTime(392, t + 0.25);
      gain.gain.setValueAtTime(0.5, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.25);
    }

    function playHoleIn() {
      triggerHaptic('hole');
      const ctx = ensureAudioReady();
      if (!ctx) return;
      const t = ctx.currentTime;
      const notes = [523, 659, 784, 1046];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const startT = t + idx * 0.09;
        osc.frequency.setValueAtTime(freq, startT);
        gain.gain.setValueAtTime(0.35, startT);
        gain.gain.exponentialRampToValueAtTime(0.01, startT + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startT);
        osc.stop(startT + 0.28);
      });
    }

    function playSwitchTrigger() {
      triggerHaptic('medium');
      const ctx = ensureAudioReady();
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = 'sawtooth';
      osc1.frequency.setValueAtTime(220, t);
      osc1.frequency.exponentialRampToValueAtTime(880, t + 0.14);
      gain1.gain.setValueAtTime(0.5, t);
      gain1.gain.exponentialRampToValueAtTime(0.01, t + 0.14);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(t);
      osc1.stop(t + 0.14);

      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(587.33, t + 0.04);
      osc2.frequency.setValueAtTime(880, t + 0.10);
      gain2.gain.setValueAtTime(0.4, t + 0.04);
      gain2.gain.exponentialRampToValueAtTime(0.01, t + 0.30);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(t + 0.04);
      osc2.stop(t + 0.30);
    }

    function playGateOpen() {
      triggerHaptic('heavy');
      const ctx = ensureAudioReady();
      if (!ctx) return;
      const t = ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t + idx * 0.04);
        gain.gain.setValueAtTime(0.35, t + idx * 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.04 + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t + idx * 0.04);
        osc.stop(t + idx * 0.04 + 0.45);
      });
    }

    function playShieldDeflect() {

    function playWallSpawn() {

    function playPortalWarp() {
      triggerHaptic('hole');
      const ctx = ensureAudioReady();
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, t);
      osc.frequency.exponentialRampToValueAtTime(1150, t + 0.16);
      osc.frequency.exponentialRampToValueAtTime(280, t + 0.38);
      gain.gain.setValueAtTime(0.5, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.38);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.38);
    }


    // --- Three.js Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7dc2eb);
    scene.fog = new THREE.Fog(0x8ecdf7, 35, 140);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.35, 180);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    // Lights (Golf Battle Tarzı Canlı Güneş ve Doğal Çevre Işığı)
    const ambientLight = new THREE.AmbientLight(0xd5ecff, 0.35);
    scene.add(ambientLight);
    const hemiLight = new THREE.HemisphereLight(0xd8edff, 0x164218, 0.52);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffae8, 1.15);
    sunLight.position.set(24, 42, -18);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 2.0;
    sunLight.shadow.camera.far = 110;
    sunLight.shadow.camera.left = -28;
    sunLight.shadow.camera.right = 28;
    sunLight.shadow.camera.top = 28;
    sunLight.shadow.camera.bottom = -28;
    sunLight.shadow.bias = -0.0004;
    sunLight.shadow.normalBias = 0.02;
    scene.add(sunLight);

    // Doğal golf sahası çevresi (buildGolfEnvironment fonksiyonu ile zenginleştirildi)
    let envClouds = null;
    let envRiverTex = null;

    // --- Golf Battle Birebir Şampiyona Damalı Çim Dokusu (Golf Battle Renk & Desenleri) ---
        // --- Professional Tournament Putting Green (Kesintisiz, Canlı Zümrüt Yeşili - Asla Yapboz Değil!) ---
    function createGolfGrassTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext("2d");

      // Golf Battle Birebir Orijinal Renk Paleti (Canlı açık fıstık yeşili & zengin koyu zümrüt):
      const cLight = "#36a218"; // Golf Battle canlı açık çim karesi
      const cDark  = "#1f750c"; // Golf Battle koyu zümrüt çim karesi

      // 4 Büyük Çeyrek Kare (512x512 her biri - Golf Battle ölçeğinde)
      // Asla yapboz bordür/siyah çizgi yok, pürüzsüz ve temiz geçiş!
      ctx.fillStyle = cDark;
      ctx.fillRect(0, 0, 512, 512);
      ctx.fillRect(512, 512, 512, 512);

      ctx.fillStyle = cLight;
      ctx.fillRect(512, 0, 512, 512);
      ctx.fillRect(0, 512, 512, 512);

      // İnce doğal kadife çim mikro-dokusu (Golf Battle tarzı taze golf yeşili)
      const imgData = ctx.getImageData(0, 0, 1024, 1024);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 5;
        data[i] = Math.min(255, Math.max(0, data[i] + noise * 0.2));
        data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise * 0.5));
        data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise * 0.2));
      }
      ctx.putImageData(imgData, 0, 0);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 1);
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      return tex;
    }

    // --- Procedural High-End Cedar Wood Plank Texture with Rich Grain & Knots ---
        // --- Ultra-Crisp High-Definition Cedar Wood Plank Texture (Yüksek Netlik & Kalas Ayrıntıları) ---
    function createWoodTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");

      // 1. Golf Battle Birebir Sıcak Kestane / Çikolata Temel Ahşap Tonu (#5c2d16)
      ctx.fillStyle = "#5c2d16";
      ctx.fillRect(0, 0, 1024, 512);

      // 2. Belirgin ve stilize ahşap damarları
      for (let y = 0; y < 512; y++) {
        const wave1 = Math.sin(y * 0.07) * 20;
        const wave2 = Math.cos(y * 0.03 + 1.0) * 25;
        const wave = wave1 + wave2;

        const isDarkBand = (Math.floor((y + wave * 0.35) / 14) % 2 === 0);
        const alpha = 0.14 + Math.sin(y * 0.12) * 0.06;

        ctx.fillStyle = isDarkBand ? "rgba(35, 14, 5, " + alpha + ")" : "rgba(130, 68, 34, " + (alpha * 0.95) + ")";
        ctx.fillRect(0, y, 1024, 1);
      }

      // 3. Kalas Seviyeleri (Derin, net yatay kalas gölgeleri ve pah yansımaları)
      const plankY = [0, 128, 256, 384, 512];
      plankY.forEach(py => {
        ctx.fillStyle = "rgba(18, 7, 2, 0.88)";
        ctx.fillRect(0, py - 4, 1024, 6);
        ctx.fillStyle = "rgba(160, 85, 45, 0.45)";
        ctx.fillRect(0, py + 2, 1024, 4);
      });

      // 4. Kalas Bağlantı Vidaları / Çivileri
      for (let px = 64; px < 1024; px += 256) {
        [64, 192, 320, 448].forEach(py => {
          ctx.fillStyle = "rgba(20, 8, 3, 0.75)";
          ctx.beginPath();
          ctx.arc(px, py, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(175, 100, 55, 0.45)";
          ctx.beginPath();
          ctx.arc(px - 1, py - 1, 1.5, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // 5. Doğal Ahşap Budakları
      function drawWoodKnot(kx, ky, r) {
        ctx.fillStyle = "#2a1205";
        ctx.beginPath();
        ctx.ellipse(kx, ky, r * 0.45, r * 0.35, 0.2, 0, Math.PI * 2);
        ctx.fill();

        for (let rad = r * 0.6; rad <= r * 2.2; rad += 4) {
          ctx.strokeStyle = (Math.floor(rad) % 8 === 0) ? "rgba(35, 14, 5, 0.40)" : "rgba(145, 75, 38, 0.25)";
          ctx.lineWidth = 2.0;
          ctx.beginPath();
          ctx.ellipse(kx, ky, rad, rad * 0.65, 0.2, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      drawWoodKnot(180, 190, 24);
      drawWoodKnot(640, 320, 26);
      drawWoodKnot(880, 100, 20);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 1);
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      return tex;
    }

    // --- Procedural High-End Wooden Wall Top Rail Cap (Ultra-Sharp, Beveled, Zero-Aliasing) ---
        // --- Ultra-Crisp Top Rail Cap (Yüksek Netlikte Pahlı Üst Küpeşte) ---
    function createWoodRailTopTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      // 1. Golf Battle Birebir Üst Küpeşte Kestane Tonu (#66331a)
      ctx.fillStyle = "#66331a";
      ctx.fillRect(0, 0, 1024, 256);

      // 2. Boyuna pürüzsüz saten ahşap damarları
      for (let y = 14; y < 242; y++) {
        const wave = Math.sin(y * 0.09) * 10 + Math.cos(y * 0.03) * 14;
        const isDark = (Math.floor((y + wave * 0.35) / 14) % 2 === 0);
        const alpha = 0.10 + Math.sin(y * 0.15) * 0.05;
        ctx.fillStyle = isDark ? "rgba(35, 14, 5, " + alpha + ")" : "rgba(150, 80, 42, " + alpha + ")";
        ctx.fillRect(0, y, 1024, 1);
      }

      // 3. İnce doğal ahşap lifleri
      ctx.fillStyle = "rgba(30, 12, 4, 0.12)";
      for (let i = 0; i < 400; i++) {
        const px = Math.random() * 1024;
        const py = 18 + Math.random() * 220;
        const plen = 25 + Math.random() * 90;
        ctx.fillRect(px, py, plen, 1.2);
      }

      // 4. Kenar Pahları (Beveled Chamfers)
      ctx.fillStyle = "rgba(15, 6, 2, 0.85)";
      ctx.fillRect(0, 0, 1024, 4);
      ctx.fillStyle = "rgba(175, 95, 52, 0.70)";
      ctx.fillRect(0, 4, 1024, 4);
      const gradTop = ctx.createLinearGradient(0, 8, 0, 20);
      gradTop.addColorStop(0.0, "rgba(175, 95, 52, 0.30)");
      gradTop.addColorStop(1.0, "rgba(175, 95, 52, 0.0)");
      ctx.fillStyle = gradTop;
      ctx.fillRect(0, 8, 1024, 12);

      const gradBottom = ctx.createLinearGradient(0, 236, 0, 248);
      gradBottom.addColorStop(0.0, "rgba(175, 95, 52, 0.0)");
      gradBottom.addColorStop(1.0, "rgba(175, 95, 52, 0.30)");
      ctx.fillStyle = gradBottom;
      ctx.fillRect(0, 236, 1024, 12);
      ctx.fillStyle = "rgba(175, 95, 52, 0.70)";
      ctx.fillRect(0, 248, 1024, 4);
      ctx.fillStyle = "rgba(15, 6, 2, 0.85)";
      ctx.fillRect(0, 252, 1024, 4);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      return tex;
    }

    // --- 3D Kupa İçi Duvar Dokusu (Derin Siyah Çukur ve Gölge Derinliği) ---
    function createCupWallTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // Üstten alta derin siyah çukur gradyanı (Kullanıcı Talebi: simsiyah delik içi):
      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0, '#1a1d22');
      grad.addColorStop(0.20, '#101215');
      grad.addColorStop(0.55, '#060709');
      grad.addColorStop(1, '#010203');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 256);

      // İnce dikey kupa iç çizgileri
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let x = 8; x < 128; x += 16) {
        ctx.beginPath();
        ctx.moveTo(x, 10);
        ctx.lineTo(x, 256);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    // --- Kırmızı-Beyaz Şeritli Şampiyona Bayrak Direği Dokusu (Kullanıcı Talebi) ---
    function createStripedFlagPoleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // 8 adet dönüşümlü kırmızı ve beyaz şerit
      const numStripes = 8;
      const stripeH = 256 / numStripes;

      for (let i = 0; i < numStripes; i++) {
        const isRed = (i % 2 === 0);
        ctx.fillStyle = isRed ? '#e52521' : '#ffffff';
        ctx.fillRect(0, i * stripeH, 64, stripeH);

        // Şerit birleşim konturları
        ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
        ctx.fillRect(0, (i + 1) * stripeH - 1.5, 64, 1.5);
      }

      // Direğe dikey silindirik hacim ve parlama gölgesi
      const cylGrad = ctx.createLinearGradient(0, 0, 64, 0);
      cylGrad.addColorStop(0, 'rgba(0,0,0,0.25)');
      cylGrad.addColorStop(0.35, 'rgba(255,255,255,0.35)');
      cylGrad.addColorStop(0.70, 'rgba(255,255,255,0.0)');
      cylGrad.addColorStop(1, 'rgba(0,0,0,0.35)');
      ctx.fillStyle = cylGrad;
      ctx.fillRect(0, 0, 64, 256);

    // --- Procedural Golf Battle Köşeli Ahşap Engel Kesit Dokusu (Square Timber End Cap) ---
    function createWoodLogEndTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // 1. Dış koyu ahşap kenar çerçevesi (Köşeli kereste)
      ctx.fillStyle = '#3c200c';
      ctx.fillRect(0, 0, 256, 256);

      // 2. Ana doğal açık çam gövdesi
      ctx.fillStyle = '#b8814c';
      ctx.fillRect(8, 8, 240, 240);

      // 3. Yıllık büyüme halkaları (Tree growth rings)
      const cx = 134, cy = 122;
      const numRings = 9;
      for (let i = 1; i <= numRings; i++) {
        const r = (i / numRings) * 115;
        ctx.strokeStyle = (i % 2 === 0) ? 'rgba(92, 49, 17, 0.70)' : 'rgba(125, 71, 28, 0.50)';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        for (let a = 0; a <= Math.PI * 2 + 0.1; a += 0.1) {
          const wobble = Math.sin(a * 4 + i) * 2.0 + Math.cos(a * 3) * 1.5;
          const x = cx + (r + wobble) * Math.cos(a);
          const y = cy + (r + wobble) * Math.sin(a);
          if (a === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // 4. Merkez öz odun (Center pith)
      ctx.fillStyle = '#5c2d0c';
      ctx.beginPath();
      ctx.arc(cx, cy, 7, 0, Math.PI * 2);
      ctx.fill();

      // 5. Kılcal kuruma çatlakları
      ctx.strokeStyle = 'rgba(60, 28, 8, 0.65)';
      ctx.lineWidth = 1.6;
      const crackAngles = [0.35, 1.85, 3.45, 5.0];
      crackAngles.forEach(ang => {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        const len = 48 + ((ang * 23) % 40);
        ctx.lineTo(cx + Math.cos(ang) * len, cy + Math.sin(ang) * len);
        ctx.stroke();
      });

      // 6. 4 Köşede Golf Battle Dövme Demir Köşebent Plakaları ve Perçin Cıvataları
      const bracketSize = 44;
      const bracketThick = 14;
      ctx.fillStyle = '#2d2218';

      // Sol üst, sağ üst, sol alt, sağ alt L-şekilli köşebentler
      const corners = [
        [0, 0, 1, 1],
        [256, 0, -1, 1],
        [0, 256, 1, -1],
        [256, 256, -1, -1]
      ];
      corners.forEach(([x, y, sx, sy]) => {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + sx * bracketSize, y);
        ctx.lineTo(x + sx * bracketSize, y + sy * bracketThick);
        ctx.lineTo(x + sx * bracketThick, y + sy * bracketThick);
        ctx.lineTo(x + sx * bracketThick, y + sy * bracketSize);
        ctx.lineTo(x, y + sy * bracketSize);
        ctx.closePath();
        ctx.fill();

        // Demir perçin cıvatası (Rivet bolt)
        ctx.fillStyle = '#6e5a48';
        ctx.beginPath();
        ctx.arc(x + sx * (bracketThick * 0.5 + 2), y + sy * (bracketThick * 0.5 + 2), 3.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2d2218';
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy() || 8;
      return tex;
    }

    // --- Procedural Golf Battle Snowy Valley Çatlak Mozaik Buz Dokusu ---
    function createIceTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // 1. Golf Battle Snowy Valley Zengin Arktik Mavi Degrade
      const bgGrad = ctx.createRadialGradient(256, 256, 40, 256, 256, 360);
      bgGrad.addColorStop(0.0, '#1cb8ff');
      bgGrad.addColorStop(0.5, '#0096e6');
      bgGrad.addColorStop(1.0, '#006fb8');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 512, 512);

      // 2. Mozaik Buz Blokları ve Kırılma Poligonları (Golf Battle Cleavage Facets)
      const cells = [
        [[0,0], [140,0], [170,110], [90,160], [0,120]],
        [[140,0], [320,0], [350,90], [260,140], [170,110]],
        [[320,0], [512,0], [512,130], [390,160], [350,90]],
        [[0,120], [90,160], [120,290], [0,270]],
        [[90,160], [170,110], [260,140], [280,260], [190,300], [120,290]],
        [[260,140], [350,90], [390,160], [430,280], [360,310], [280,260]],
        [[390,160], [512,130], [512,290], [430,280]],
        [[0,270], [120,290], [140,430], [0,410]],
        [[120,290], [190,300], [280,260], [310,390], [210,450], [140,430]],
        [[280,260], [360,310], [430,280], [460,420], [370,440], [310,390]],
        [[430,280], [512,290], [512,440], [460,420]],
        [[0,410], [140,430], [120,512], [0,512]],
        [[140,430], [210,450], [310,390], [290,512], [120,512]],
        [[310,390], [370,440], [460,420], [470,512], [290,512]],
        [[460,420], [512,440], [512,512], [470,512]]
      ];

      cells.forEach((poly, idx) => {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(poly[0][0], poly[0][1]);
        for(let i=1; i<poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
        ctx.closePath();
        ctx.clip();

        const cx = poly.reduce((s, p) => s + p[0], 0) / poly.length;
        const cy = poly.reduce((s, p) => s + p[1], 0) / poly.length;
        const radGrad = ctx.createRadialGradient(cx - 20, cy - 20, 5, cx, cy, 90);
        const tint = (idx % 3 === 0) ? 'rgba(80, 220, 255, 0.35)' : (idx % 3 === 1) ? 'rgba(255, 255, 255, 0.22)' : 'rgba(0, 110, 190, 0.25)';
        radGrad.addColorStop(0, tint);
        radGrad.addColorStop(1, 'rgba(0,0,0,0.12)');
        ctx.fillStyle = radGrad;
        ctx.fillRect(0,0,512,512);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      });

      // 3. Bloklar Arasındaki Işıltılı Geniş Buz Çatlakları
      ctx.strokeStyle = 'rgba(180, 240, 255, 0.60)';
      ctx.lineWidth = 5.0;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      cells.forEach(poly => {
        ctx.beginPath();
        ctx.moveTo(poly[0][0], poly[0][1]);
        for(let i=1; i<poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
        ctx.closePath();
        ctx.stroke();
      });

      // 4. Keskin ve Net Beyaz Çatlak Çizgileri
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.2;
      cells.forEach(poly => {
        ctx.beginPath();
        ctx.moveTo(poly[0][0], poly[0][1]);
        for(let i=1; i<poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
        ctx.closePath();
        ctx.stroke();
      });

      // 5. Kılcal Çatlak Damarları (Micro-cracks)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth = 1.2;
      for (let i = 0; i < 40; i++) {
        const x = (i * 97 + 23) % 512;
        const y = (i * 83 + 47) % 512;
        const len = 14 + ((i * 19) % 22);
        const ang = ((i * 51) % 360) * Math.PI / 180;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
        ctx.lineTo(x + Math.cos(ang + 0.6) * (len * 0.7), y + Math.sin(ang + 0.6) * (len * 0.7));
        ctx.stroke();
      }

      // 6. Işıltılı Don Kristalleri
      for (let i = 0; i < 30; i++) {
        const sx = (i * 137 + 15) % 512;
        const sy = (i * 151 + 29) % 512;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(sx, sy, 1.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(200, 245, 255, 0.4)';
        ctx.beginPath();
        ctx.arc(sx, sy, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    // --- 3D Oyulmuş Petek Desenli Saf Beyaz Golf Topu (100% Pure White Honeycomb Carved Ball) ---
    function createGolfBallTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // 1. Kusursuz Saf Beyaz Turnuva Tabanı (Başka hiçbir renk yok)
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 1024, 1024);

      // 2. 3D Oyulmuş Petek (Hexagonal) Deseni - Staggered Honeycomb Grid
      const r = 16;
      const hexW = Math.sqrt(3) * r; // ~27.7px
      const hexH = 1.5 * r;          // 24px

      const cols = Math.ceil(1024 / hexW) + 2;
      const rows = Math.ceil(1024 / hexH) + 2;

      function drawHexagon(cx, cy, radius) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = (i * Math.PI) / 3 - Math.PI / 6;
          const x = cx + radius * Math.cos(angle);
          const y = cy + radius * Math.sin(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
      }

      // Her bir petek hücresi saf beyaz zemin üzerine oyulmuş gölge ve pah ışıltısıyla işlenir
      for (let row = -1; row < rows; row++) {
        const y = row * hexH;
        const isOdd = row % 2 !== 0;
        const xOffset = isOdd ? hexW * 0.5 : 0;

        for (let col = -1; col < cols; col++) {
          const x = col * hexW + xOffset;

          // 1. Oyuk çukur iç derinlik gradyanı (saf beyazdan açık gümüşi beyaza)
          const grad = ctx.createRadialGradient(x - r * 0.22, y - r * 0.22, r * 0.1, x, y, r * 0.88);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.55, '#f4f6f9');
          grad.addColorStop(0.85, '#e1e7ed');
          grad.addColorStop(1.0, '#cbd4dc');

          ctx.save();
          drawHexagon(x, y, r * 0.88);
          ctx.fillStyle = grad;
          ctx.fill();

          // 2. Üst ve sol-iç oyuk kenar gölgesi (Ambiyans oklüzyonu)
          ctx.strokeStyle = 'rgba(150, 165, 180, 0.45)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          for (let i = 2; i <= 4; i++) {
            const angle = (i * Math.PI) / 3 - Math.PI / 6;
            const hx = x + r * 0.88 * Math.cos(angle);
            const hy = y + r * 0.88 * Math.sin(angle);
            if (i === 2) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.stroke();

          // 3. Alt ve sağ-iç oyuk pah ışıltısı (Parlak beyaz yansıma)
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          for (let i = 5; i <= 7; i++) {
            const angle = ((i % 6) * Math.PI) / 3 - Math.PI / 6;
            const hx = x + r * 0.88 * Math.cos(angle);
            const hy = y + r * 0.88 * Math.sin(angle);
            if (i === 5) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.stroke();

          ctx.restore();
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.generateMipmaps = true;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy() || 8;
      return tex;
    }

    // 3D Oyulmuş Petek Yükseklik Haritası (Gerçekçi PBR Bump Mapping)
    function createGolfBallBumpTexture() {
      const canvas = document.createElement('canvas');

      const hexW = Math.sqrt(3) * r;
      const hexH = 1.5 * r;

      const cols = Math.ceil(1024 / hexW) + 2;
      const rows = Math.ceil(1024 / hexH) + 2;

      function drawHexagon(cx, cy, radius) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = (i * Math.PI) / 3 - Math.PI / 6;
          const x = cx + radius * Math.cos(angle);
          const y = cy + radius * Math.sin(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
      }

      for (let row = -1; row < rows; row++) {
        const y = row * hexH;
        const isOdd = row % 2 !== 0;
        const xOffset = isOdd ? hexW * 0.5 : 0;

        for (let col = -1; col < cols; col++) {

          ctx.save();
          drawHexagon(x, y, r * 0.90);
          ctx.fillStyle = grad;
          ctx.fill();
          ctx.restore();
        }
      }

      const tex = new THREE.CanvasTexture(canvas);

      tex.wrapT = THREE.RepeatWrapping;

        color: 0x382213, // Doğal sedir/çam ağacı kabuğu

      const rockMat = new THREE.MeshStandardMaterial({

        roughness: 0.92,
        flatShading: true
      });

      const mossRockMat = new THREE.MeshStandardMaterial({
        color: 0x3d5c38,

      });

      // Zengin ve Doygun Çam İğnesi Tonları (Golf Battle Tarzı Çok Katmanlı İğne Kümeleri)

      const pineMid = new THREE.MeshStandardMaterial({ color: 0x135021, roughness: 0.8, flatShading: true });
      const pineLight = new THREE.MeshStandardMaterial({ color: 0x1a662c, roughness: 0.8, flatShading: true });
      const pineTip = new THREE.MeshStandardMaterial({ color: 0x227c38, roughness: 0.8, flatShading: true });

      // 1. Ufka Kadar Uzanan Kesintisiz ve Sağlam Ana Zemin Tabanı (y = -0.05)
      const groundGeo = new THREE.PlaneGeometry(340, 340);
      const ground = new THREE.Mesh(groundGeo, groundMat);

      // 2. Doğal Vadi Sırtları & Çimenli Tepeler (Rolling Forest Berms)
      function addBerm(x, z, sx, sy, sz) {
        const geo = new THREE.SphereGeometry(1, 16, 12);
        const mesh = new THREE.Mesh(geo, groundMat);
        mesh.scale.set(sx, sy, sz);

      }
      addBerm(-24, -8, 16, 3.8, 20);
      addBerm(-28, 10, 18, 4.5, 22);
      addBerm(26, -10, 16, 4.0, 20);
      addBerm(30, 10, 18, 4.2, 22);
      addBerm(0, 36, 28, 4.8, 18);
      addBerm(0, -30, 24, 3.8, 16);

      // 3. Sağ Tarafta Doğal Orman Göleti (Scenic Forest Lake & Lily Pads)
      const lakeGroup = new THREE.Group();
      envGroup.add(lakeGroup);

      const sandBeachGeo = new THREE.RingGeometry(0, 1, 32);
      const sandBeach = new THREE.Mesh(sandBeachGeo, sandMat);
      sandBeach.rotation.x = -Math.PI / 2;
      sandBeach.scale.set(9.0, 14.5, 1);
      sandBeach.position.set(22.0, -0.03, 1.5);
      sandBeach.receiveShadow = true;
      lakeGroup.add(sandBeach);

      const waterMeshGeo = new THREE.RingGeometry(0, 1, 32);
      const waterMesh = new THREE.Mesh(waterMeshGeo, waterMat);
      waterMesh.rotation.x = -Math.PI / 2;
      waterMesh.scale.set(8.0, 13.5, 1);
      waterMesh.position.set(22.0, 0.02, 1.5);
      waterMesh.receiveShadow = true;
      lakeGroup.add(waterMesh);

      // Nilüfer Yaprakları (Water Lilies)
      const lilyGeo = new THREE.CircleGeometry(0.35, 12);
      const lilyMat = new THREE.MeshStandardMaterial({ color: 0x1f7a30, roughness: 0.6 });
      [
        [18.5, 4.0], [19.2, 4.8], [18.0, 5.5],
        [20.5, -3.5], [21.2, -2.8],
        [23.5, 2.5], [24.2, 3.2]
      ].forEach(([lx, lz]) => {
        const lily = new THREE.Mesh(lilyGeo, lilyMat);
        lily.rotation.x = -Math.PI / 2;
        lily.position.set(lx, 0.035, lz);
        lakeGroup.add(lily);
      });

      // 4. Golf Battle Tarzı Profesyonel Çam Ağacı (Cluster Pine - ASLA Havada Durmaz!)
      // Gövde y = 1.2'den yerin 3.5 metre derinine uzanır; tüm eğim ve açılarda yere sapasağlam basar.
      function createClusterPine(px, pz, scale = 1.0, rotY = 0) {
        const tree = new THREE.Group();
        tree.position.set(px, 0, pz);
        tree.rotation.y = rotY;
        tree.scale.set(scale, scale, scale);

        // Yerin metrelerce derinine kök salan sağlam gövde (Asla havada duramaz)
        const trunkGeo = new THREE.CylinderGeometry(0.12, 0.24, 4.5, 8);
        const trunk = new THREE.Mesh(trunkGeo, pineBarkMat);
        trunk.position.y = -0.85;
        trunk.castShadow = true;
        trunk.receiveShadow = true;
        tree.add(trunk);

        // Zeminle temas noktasında doğal çam kök halkası/tümseği
        const mound = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.22, 8), pineDark);
        mound.position.y = 0.08;
        tree.add(mound);

        // 4 Katmanlı Organik Fasetli Çam İğnesi Kümeleri (Doğal gölgelenmeli ve hacimli)
        // 1. Katman (Taban, 5 küme)
        const t1 = new THREE.Group();
        t1.position.y = 1.35;
        for (let i = 0; i < 5; i++) {
          const angle = (i * Math.PI * 2) / 5;
          const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(0.58, 0), pineDark);
          puff.scale.set(1.15, 0.72, 1.15);
          puff.position.set(Math.cos(angle) * 0.52, 0, Math.sin(angle) * 0.52);
          puff.castShadow = true;
          puff.receiveShadow = true;
          t1.add(puff);
        }
        tree.add(t1);

        // 2. Katman (Orta-alt, 4 küme)
        const t2 = new THREE.Group();
        t2.position.y = 2.05;
        for (let i = 0; i < 4; i++) {
          const angle = (i * Math.PI * 2) / 4 + 0.3;
          const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(0.50, 0), pineMid);
          puff.scale.set(1.1, 0.75, 1.1);
          puff.position.set(Math.cos(angle) * 0.40, 0, Math.sin(angle) * 0.40);
          puff.castShadow = true;
          puff.receiveShadow = true;
          t2.add(puff);
        }
        tree.add(t2);

        // 3. Katman (Orta-üst, 3 küme)
        const t3 = new THREE.Group();
        t3.position.y = 2.68;
        for (let i = 0; i < 3; i++) {
          const angle = (i * Math.PI * 2) / 3 + 0.6;
          const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(0.42, 0), pineLight);
          puff.scale.set(1.05, 0.8, 1.05);
          puff.position.set(Math.cos(angle) * 0.28, 0, Math.sin(angle) * 0.28);
          puff.castShadow = true;
          puff.receiveShadow = true;
          t3.add(puff);
        }
        tree.add(t3);

        // 4. Katman (Zirve İğne Tacı)
        const crown = new THREE.Mesh(new THREE.DodecahedronGeometry(0.38, 0), pineTip);
        crown.position.set(0, 3.25, 0);
        crown.scale.set(0.9, 1.25, 0.9);
        crown.castShadow = true;
        crown.receiveShadow = true;
        tree.add(crown);

        envGroup.add(tree);
      }

      // 5. Doğal Granit Kaya Kümeleri (Weathered Low-Poly Granite Boulders)
      function createRockCluster(px, pz, s = 1.0, rot = 0) {
        const rockGroup = new THREE.Group();
        rockGroup.position.set(px, 0, pz);
        rockGroup.rotation.y = rot;

        const geo1 = new THREE.DodecahedronGeometry(0.70 * s, 1);
        const r1 = new THREE.Mesh(geo1, rockMat);
        r1.scale.set(1.25, 0.75, 1.0);
        r1.position.set(0, 0.28 * s, 0);
        r1.castShadow = true;
        r1.receiveShadow = true;
        rockGroup.add(r1);

        const geo2 = new THREE.DodecahedronGeometry(0.48 * s, 1);
        const r2 = new THREE.Mesh(geo2, mossRockMat);
        r2.scale.set(1.1, 0.7, 0.9);
        r2.position.set(0.60 * s, 0.18 * s, 0.22 * s);
        r2.castShadow = true;
        r2.receiveShadow = true;
        rockGroup.add(r2);

        const geo3 = new THREE.DodecahedronGeometry(0.30 * s, 1);
        const r3 = new THREE.Mesh(geo3, rockMat);
        r3.scale.set(1.0, 0.6, 0.8);
        r3.position.set(-0.50 * s, 0.10 * s, 0.30 * s);
        rockGroup.add(r3);

        envGroup.add(rockGroup);
      }

      // 6. Rustik Devrilmiş Ağaç Gövdeleri (Fallen Timber Logs)
      function createFallenLog(px, pz, len = 2.4, rotY = 0.4) {
        const logGeo = new THREE.CylinderGeometry(0.16, 0.18, len, 8);
        logGeo.rotateZ(Math.PI / 2);
        const logMesh = new THREE.Mesh(logGeo, pineBarkMat);
        logMesh.position.set(px, 0.12, pz);
        logMesh.rotation.y = rotY;
        logMesh.castShadow = true;
        logMesh.receiveShadow = true;
        envGroup.add(logMesh);
      }

      // 7. Golf Battle Rustik Ahşap Çitler (Split-Rail Wooden Fences)
      function createSplitRailFence(x1, z1, x2, z2) {
        const dx = x2 - x1;
        const dz = z2 - z1;
        const dist = Math.sqrt(dx * dx + dz * dz);
        const angle = Math.atan2(dz, dx);

        const fenceGroup = new THREE.Group();
        fenceGroup.position.set(x1, 0, z1);
        fenceGroup.rotation.y = -angle;

        const numPosts = Math.max(2, Math.ceil(dist / 2.6) + 1);
        const postStep = dist / (numPosts - 1);

        for (let i = 0; i < numPosts; i++) {
          const postGeo = new THREE.CylinderGeometry(0.07, 0.09, 1.4, 6);
          const post = new THREE.Mesh(postGeo, pineBarkMat);
          post.position.set(i * postStep, 0.35, 0);
          post.castShadow = true;
          fenceGroup.add(post);
        }

        for (let r = 0; r < 2; r++) {
          const railGeo = new THREE.BoxGeometry(dist, 0.06, 0.08);
          const rail = new THREE.Mesh(railGeo, pineBarkMat);
          rail.position.set(dist * 0.5, 0.42 + r * 0.32, 0);
          rail.castShadow = true;
          fenceGroup.add(rail);
        }

        envGroup.add(fenceGroup);
      }

      // 8. Ufukta Karlı Alpin Dağ Sıraları (Panoramic Horizon Peaks)
      function createMountainPeak(mx, mz, radius, height, colorHex, snowH = 0) {
        const mGroup = new THREE.Group();
        mGroup.position.set(mx, 0, mz);

        const geo = new THREE.ConeGeometry(radius, height, 7);
        const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.95, flatShading: true });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = height * 0.5 - 2;
        mGroup.add(mesh);

        if (snowH > 0) {
          const sGeo = new THREE.ConeGeometry(radius * (snowH / height), snowH, 7);
          const sMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, flatShading: true });
          const sMesh = new THREE.Mesh(sGeo, sMat);
          sMesh.position.y = height - snowH * 0.5 - 1.95;
          mGroup.add(sMesh);
        }

        envGroup.add(mGroup);
      }

      const peaks = [
        [-50, 80, 36, 44, 0x485a6a, 15],
        [-15, 90, 40, 50, 0x3d4e5d, 18],
        [25, 85, 38, 46, 0x455666, 16],
        [70, 75, 36, 42, 0x405161, 14],
        [85, 20, 38, 44, 0x465768, 15],
        [90, -35, 40, 48, 0x3c4c5a, 16],

      peaks.forEach(([x, z, r, h, c, s]) => createMountainPeak(x, z, r, h, c, s));

      // --- DOĞAL VE ORGANİK ÇAM KORULUKLARI (Golf Battle Tarzı Kümelenmiş Çamlar) ---
      // Sol Vadi Korulukları: Doğal 2-3'lü ağaç aileleri, parkur görüşünü ferah tutan yerleşim
      const leftGrove1 = [
        [-9.5, -6.5, 1.45, 0.4],
        [-11.2, -4.5, 1.15, 1.2],
        [-12.8, -8.0, 1.60, 2.1]
      ];
      leftGrove1.forEach(([x, z, s, r]) => createClusterPine(x, z, s, r));

      const leftGrove2 = [
        [-9.0, 3.5, 1.35, 1.8],
        [-11.0, 5.8, 1.55, 0.7],
        [-13.2, 2.0, 1.20, 2.4]
      ];
      leftGrove2.forEach(([x, z, s, r]) => createClusterPine(x, z, s, r));

      const leftGrove3 = [
        [-9.8, 13.0, 1.40, 2.2],
        [-12.0, 15.5, 1.65, 1.3],
        [-14.5, 11.5, 1.25, 0.9]
      ];
      leftGrove3.forEach(([x, z, s, r]) => createClusterPine(x, z, s, r));

      // Sağ Vadi & Gölet Korulukları: Gölet etrafını ve parkurun sağını çerçeveleyen kümeler
      const rightGrove1 = [
        [10.0, -7.5, 1.35, 0.6],
        [12.2, -5.0, 1.55, 1.3],
        [14.0, -9.0, 1.20, 2.0]
      ];
      rightGrove1.forEach(([x, z, s, r]) => createClusterPine(x, z, s, r));

      const rightGrove2 = [
        [10.2, 5.0, 1.40, 2.1],
        [12.5, 7.5, 1.60, 0.5],
        [14.2, 3.2, 1.15, 1.7]
      ];
      rightGrove2.forEach(([x, z, s, r]) => createClusterPine(x, z, s, r));

      const rightGrove3 = [
        [10.5, 14.5, 1.35, 1.7],
        [12.8, 16.5, 1.55, 0.8],
        [30.0, 2.0, 1.65, 0.3],
        [31.0, 10.0, 1.50, 1.5]
      ];
      rightGrove3.forEach(([x, z, s, r]) => createClusterPine(x, z, s, r));

      // Arka Ufuk Çamları: Kupanın hemen arkasını açık bırakan, sağ ve soldan ufku saran derinlik çamları
      // Merkez koridoru (x: -5 ile +5 arası) ferah bırakılarak dağların ve vadinin muhteşem manzarası açılır!
      const backPines = [
        [-8.5, 22.0, 1.55, 1.2],
        [-11.5, 25.0, 1.70, 0.5],
        [-6.5, 26.0, 1.40, 1.8],
        [8.5, 22.5, 1.50, 1.9],
        [11.5, 25.5, 1.75, 0.6],
        [6.5, 26.5, 1.45, 1.0],
        // Uzak arka dağ eteği silüeti (z: 36 - 48)
        [-18.0, 42.0, 2.1, 0.8],
        [-3.0, 46.0, 2.3, 1.4],
        [16.0, 44.0, 2.2, 2.0]
      ];
      backPines.forEach(([x, z, s, r]) => createClusterPine(x, z, s, r));

      // Ön Başlangıç Arkası Ağaçları (Kameranın arkasında kalan orman hattı z: -14 - -22)
      const frontPines = [
        [-8.0, -15.0, 1.40, 0.5],
        [-11.0, -18.0, 1.60, 1.8],
        [8.0, -15.5, 1.45, 1.4],
        [11.0, -18.5, 1.65, 2.0],
        [0.0, -20.0, 1.75, 0.9]
      ];
      frontPines.forEach(([x, z, s, r]) => createClusterPine(x, z, s, r));

      // Doğal Granit Kayalar
      createRockCluster(-6.5, -5.5, 1.05, 0.4);
      createRockCluster(-6.8, 6.0, 1.15, 1.8);
      createRockCluster(-7.2, 14.0, 1.1, 2.3);
      createRockCluster(6.8, -6.0, 1.05, 0.9);
      createRockCluster(14.5, -2.0, 1.25, 1.5);
      createRockCluster(15.0, 6.0, 1.2, 2.1);
      createRockCluster(7.0, 11.5, 1.1, 0.6);

      // Devrilmiş Kütükler
      createFallenLog(-7.5, 0.5, 2.6, 0.5);
      createFallenLog(7.5, -2.5, 2.4, -0.3);
      createFallenLog(-8.0, 10.5, 2.8, 0.2);

      // Ahşap Çitler
      createSplitRailFence(-11.0, -10.0, -11.0, 18.0);
      createSplitRailFence(11.0, -10.0, 13.0, 18.0);

      // 9. Gökyüzü Bulutları
      const cloudMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.9,
        metalness: 0.05,
        transparent: true,
        opacity: 0.88
      });
      const cloudGroup = new THREE.Group();
      for (let c = 0; c < 8; c++) {
        const cloud = new THREE.Group();
        const cx = ((c * 17) % 60) - 30;
        const cz = ((c * 23) % 60) - 30;
        const cy = 20 + (c % 3) * 2.5;
        cloud.position.set(cx, cy, cz);

        const puffGeo = new THREE.SphereGeometry(1.6, 7, 7);
        const p1 = new THREE.Mesh(puffGeo, cloudMat);
        p1.scale.set(1.8, 0.7, 1.2);
        cloud.add(p1);

        const p2 = new THREE.Mesh(puffGeo, cloudMat);
        p2.position.set(1.2, 0.3, 0.3);
        p2.scale.set(1.4, 0.6, 1.0);
        cloud.add(p2);

        const p3 = new THREE.Mesh(puffGeo, cloudMat);
        p3.position.set(-1.1, 0.2, -0.2);
        p3.scale.set(1.3, 0.55, 0.9);
        cloud.add(p3);

        cloudGroup.add(cloud);
      }
      envGroup.add(cloudGroup);
      envClouds = cloudGroup;
    }
    buildGolfEnvironment();

    // --- Golf Battle Tarzı 3D Dinamik Hız Baremi & Hedef Yayı (Velocity Power Runway) ---
    const aim3DGroup = new THREE.Group();
    scene.add(aim3DGroup);

    // 1. Dinamik Hız Baremi Seviye Çubukları (Aerodinamik kavisli pod / barem blokları)
    const maxBars = 16;
    const aimBars = [];
    const barGeo = new THREE.BoxGeometry(0.24, 0.018, 0.14);

    for (let i = 0; i < maxBars; i++) {
      const mat = new THREE.MeshStandardMaterial({
        color: 0x00f576,

    // 2. Hedef Kılavuz Yayı ve Hassas Lazer Noktası (Aerodinamik vizör braketi)
    function createTargetBracketShape() {
      const s = new THREE.Shape();
      s.moveTo(-0.16, -0.05);
      s.quadraticCurveTo(0, 0.08, 0.16, -0.05);
      s.lineTo(0.13, -0.08);
      s.quadraticCurveTo(0, 0.04, -0.13, -0.08);
      s.closePath();
      return s;
    }

    const bracketGeo = new THREE.ExtrudeGeometry(createTargetBracketShape(), {
      depth: 0.016,
      bevelEnabled: true,
      bevelThickness: 0.003,
      bevelSize: 0.003,
      bevelSegments: 2
    });
    bracketGeo.rotateX(Math.PI / 2);

    const reticleMat = new THREE.MeshStandardMaterial({
      color: 0x00f576,
      roughness: 0.15,
      metalness: 0.3,
      emissive: 0x00d060,
      emissiveIntensity: 0.9,
      transparent: true,
      opacity: 0.98
    });
    const reticleArcMesh = new THREE.Mesh(bracketGeo, reticleMat);
    reticleArcMesh.visible = false;
    aim3DGroup.add(reticleArcMesh);

    const reticlePipGeo = new THREE.CylinderGeometry(0.028, 0.028, 0.018, 16);
    const reticlePipMat = new THREE.MeshStandardMaterial({
      color: 0x00f576,
      roughness: 0.1,
      metalness: 0.3,
      emissive: 0x00f576,
      emissiveIntensity: 1.0
    });
    const reticlePipMesh = new THREE.Mesh(reticlePipGeo, reticlePipMat);
    reticlePipMesh.visible = false;
    aim3DGroup.add(reticlePipMesh);

    // Glowing Touch Ring around Ball (Clean emerald green glow)
    const ballRingGeo = new THREE.RingGeometry(0.18, 0.24, 32);
    const ballRingMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
    const ballRing = new THREE.Mesh(ballRingGeo, ballRingMat);
    ballRing.rotation.x = -Math.PI / 2;
    scene.add(ballRing);

    // Ground Tracking & Level Meshes
    let floorMeshes = [];
    const downRay = new THREE.Raycaster();
    const downRayOrigin = new THREE.Vector3();
    const downRayDir = new THREE.Vector3(0, -1, 0);
    let lastGroundY = 0.1;

    function getGroundHeight(x, z, fallbackY = null) {
      downRayOrigin.set(x, 15.0, z);
      downRay.set(downRayOrigin, downRayDir);
      let hits = downRay.intersectObjects(floorMeshes, false);
      if (hits.length > 0) {
        return hits[0].point.y;
      }
      // Mikro-derz / karo birleşim dikişlerinde dikey ışının boşluğa düşmesini önleyen mikro örnekleme
      const offsets = [
        [0.025, 0], [-0.025, 0], [0, 0.025], [0, -0.025],
        [0.035, 0.035], [-0.035, -0.035]
      ];
      for (let i = 0; i < offsets.length; i++) {
        downRayOrigin.set(x + offsets[i][0], 15.0, z + offsets[i][1]);
        downRay.set(downRayOrigin, downRayDir);
        hits = downRay.intersectObjects(floorMeshes, false);
        if (hits.length > 0) {
          return hits[0].point.y;
        }
      }
      return fallbackY;
    }

    // Game State
    let currentHole = 0;
    let strokes = 0;
    let isMoving = false;
    let isInHole = false;
    let isSinking = false;

    let ballVel = new THREE.Vector3(0, 0, 0);
    let lastSafePos = new THREE.Vector3(0, 0.22, -6);
    let courseGroup = new THREE.Group();
    scene.add(courseGroup);

    let colliders = [];
    let cornerWedges = [];
    let treeColliders = [];
    let woodLogs = [];
    let speedBoosters = [];
    let sandTraps = [];
    let bumpers = [];
    let rotatingBars = [];
    let icePatches = [];
    let jumpRamps = [];
    let holeCupPos = new THREE.Vector3(0, 0.1, 6.5);

    let toastTimeout = null;
    function showToast(text = "Piste Geri Döndü 🔄") {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.innerText = text;
      toast.style.display = 'block';
      toast.style.opacity = '1';
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => { toast.style.display = 'none'; }, 300);
      }, 1600);
    }

    function respawnBall() {
      isMoving = false;

    function createSparkBurst(x, y, z, color = 0x00ff88) {
      const pCount = 14;
      const geom = new THREE.SphereGeometry(0.04, 6, 6);
      const mat = new THREE.MeshBasicMaterial({ color: color });
      for (let i = 0; i < pCount; i++) {
        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.set(x, y, z);
        courseGroup.add(mesh);
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI * 0.5;
        const speed = 2.5 + Math.random() * 3.5;
        sparkParticles.push({
          mesh: mesh,
          vel: new THREE.Vector3(
            Math.cos(theta) * Math.cos(phi) * speed,
            Math.sin(phi) * speed + 1.2,
            Math.sin(theta) * Math.cos(phi) * speed
          ),
          life: 0.35,
          maxLife: 0.35
        });
      }
    }

    function updateSparks(dt) {
      for (let i = sparkParticles.length - 1; i >= 0; i--) {
        const p = sparkParticles[i];
        p.life -= dt;
        if (p.life <= 0) {
          if (p.mesh.parent) p.mesh.parent.remove(p.mesh);
          sparkParticles.splice(i, 1);
        } else {
          p.vel.y -= 9.8 * dt;
          p.mesh.position.addScaledVector(p.vel, dt);
          const s = Math.max(0.1, p.life / p.maxLife);
          p.mesh.scale.set(s, s, s);
        }
      }
    }

    function updateShockwaves(dt) {
      for (let i = shockwaveRings.length - 1; i >= 0; i--) {
        const sw = shockwaveRings[i];
        sw.life -= dt;
        if (sw.life <= 0) {
          if (sw.mesh.parent) sw.mesh.parent.remove(sw.mesh);
          shockwaveRings.splice(i, 1);
        } else {
          const progress = 1.0 - (sw.life / sw.maxLife);
          const s = 1.0 + progress * 2.6;
          sw.mesh.scale.set(s, s, 1);
          sw.ringMat.opacity = Math.max(0, 1.0 - progress);
        }
      }
    }

    function createLightningArc(from, to, color = 0x00f0ff) {
      const points = [];
      const segments = 8;
      const start = new THREE.Vector3(from.x, 0.18, from.z);
      const end = new THREE.Vector3(to.x, 0.55, to.z);

      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const p = new THREE.Vector3().lerpVectors(start, end, t);
        if (i > 0 && i < segments) {
          p.x += (Math.random() - 0.5) * 0.45;
          p.y += (Math.random() - 0.5) * 0.35 + 0.35 * Math.sin(t * Math.PI);
          p.z += (Math.random() - 0.5) * 0.45;
        }
        points.push(p);
      }

      const curve = new THREE.CatmullRomCurve3(points);
      const tubeGeo = new THREE.TubeGeometry(curve, 18, 0.032, 6, false);
      const tubeMat = new THREE.MeshBasicMaterial({ color: color, wireframe: false });
      const mesh = new THREE.Mesh(tubeGeo, tubeMat);
      courseGroup.add(mesh);

      lightningArcs.push({
        mesh,
        life: 0.32,
        maxLife: 0.32
      });
    }

        }
      }
    }

        const dx = x2 - x1;
        const dz = z2 - z1;
        const len = Math.hypot(dx, dz);
        const angle = Math.atan2(dx, dz);

        [0.30, 0.52].forEach(beamY => {
          const beamGeo = new THREE.CylinderGeometry(0.016, 0.016, len, 8);
          beamGeo.rotateX(Math.PI * 0.5);
          const beam = new THREE.Mesh(beamGeo, laserMat);
          beam.position.set((x1 + x2) * 0.5, beamY, (z1 + z2) * 0.5);

      const bodyGeo = new THREE.BoxGeometry(0.24, 0.18, 0.10);

        cupShieldGate.pylons.forEach(p => {
          p.group.position.y = -elapsed * 1.6;

      baseMesh.position.y = -0.45;

    function addPortalPair(bluePos, blueNorm, orangePos, orangeNorm) {
      const blueGroup = createPortalMesh(0x00d4ff, 0x0066ff);
      blueGroup.position.copy(bluePos);
      blueGroup.rotation.y = Math.atan2(blueNorm.x, blueNorm.z);
      courseGroup.add(blueGroup);

      const orangeGroup = createPortalMesh(0xff7700, 0xff3300);
      orangeGroup.position.copy(orangePos);
      orangeGroup.rotation.y = Math.atan2(orangeNorm.x, orangeNorm.z);
      courseGroup.add(orangeGroup);

      const pair = {
        blue: {
          pos: bluePos.clone(),
          norm: blueNorm.clone().normalize(),
          group: blueGroup,
          radius: 0.45
        },
        orange: {
          pos: orangePos.clone(),
          norm: orangeNorm.clone().normalize(),
          group: orangeGroup,
          radius: 0.45
        },
        cooldown: 0
      };
      portalPairs.push(pair);
      return pair;
    }

    function loadGateHole(idx) {
      if (idx < 0 || idx >= gateLevels.length) idx = 0;
      currentGateHole = idx;

      while(courseGroup.children.length > 0) courseGroup.remove(courseGroup.children[0]);
      colliders = []; cornerWedges = []; treeColliders = []; woodLogs = [];
      speedBoosters = []; sandTraps = []; bumpers = []; rotatingBars = [];
      icePatches = []; jumpRamps = []; floorMeshes = [];
      targetSwitches = []; cupShieldGate = null; isCupLocked = false;
      sparkParticles = []; shockwaveRings = []; lightningArcs = [];
      drawnWalls = []; isDrawingWall = false;
      if (drawPreviewMesh) drawPreviewMesh.visible = false;
      portalPairs = [];

      const data = gateLevels[idx];
      holeCupPos.copy(data.cup);
      ballPos.copy(data.spawn);
      lastSafePos.copy(data.spawn);
      ballVel.set(0, 0, 0);
      isMoving = false; isInHole = false; isSinking = false; isAirborne = false;
      sinkFallVel = 0; strokes = 0;
      ballMesh.scale.set(1, 1, 1);
      ballMesh.rotation.set(0, 0, 0);
      ballMesh.visible = true;

      // Update UI tabs
      document.querySelectorAll('.voodoo-tab').forEach(t => t.classList.remove('active'));
      const activeTabGate = document.getElementById('tab-gate');
      if (activeTabGate) activeTabGate.classList.add('active');

      const gateSubBar = document.getElementById('gate-sub-bar');
      if (gateSubBar) {
        gateSubBar.style.display = 'flex';
        document.querySelectorAll('.gate-sub-tab').forEach(t => t.classList.remove('active'));
        const activeSubTab = document.getElementById(`gate-tab-${idx}`);
        if (activeSubTab) activeSubTab.classList.add('active');
      }

      const tutHandGate = document.getElementById('tutorial-hand');
      if (tutHandGate) tutHandGate.style.display = 'none';
      const drawPanelGate = document.getElementById('draw-wall-panel');
      if (drawPanelGate) drawPanelGate.style.display = 'none';

      updateHUD();
      document.getElementById('gameover-modal').style.display = 'none';
      document.getElementById('modal').style.display = 'none';

      data.build();
      buildCupAndFlag(holeCupPos);
      scene.updateMatrixWorld(true);

      const initGroundY = getGroundHeight(ballPos.x, ballPos.z, data.spawn.y - ballRadius) ?? 0.0;
      lastGroundY = initGroundY;
      ballPos.y = initGroundY + ballRadius;
      lastSafePos.copy(ballPos);

      camYaw = 0;
      camPitch = 0.44;
      showVoodooToast(`🔒 Bölüm ${idx + 1}: ${data.name.replace(/^\d+\.\s*/, '')}`, 3500);
    }
