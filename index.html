<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MiniGolf 3D">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Velocity Mini-Golf 3D (Mobile Edition)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #6bb4de;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }
    /* Top HUD - Premium Golf Championship Bar */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
      padding-bottom: 10px;
      padding-left: 14px;
      padding-right: 14px;
      background: linear-gradient(180deg, rgba(6, 18, 10, 0.92) 0%, rgba(6, 18, 10, 0.78) 70%, rgba(6, 18, 10, 0.0) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      z-index: 10;
    }
    #hud::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 16px;
      right: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 214, 50, 0.35), rgba(77, 243, 115, 0.35), transparent);
    }
    .hud-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    #hole-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1fc953, #0d8a2e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
      color: #fff;
      box-shadow: 0 2px 8px rgba(31, 201, 83, 0.4);
      flex-shrink: 0;
    }
    #hole-name {
      font-weight: 700;
      font-size: 14px;
      color: #e8f5ec;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.3px;
    }
    .hud-center {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #par-badge {
      background: rgba(255, 214, 50, 0.15);
      border: 1px solid rgba(255, 214, 50, 0.35);
      border-radius: 12px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
      color: #ffd632;
      letter-spacing: 0.5px;
    }
    .hud-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    #stroke-badge {
      background: linear-gradient(135deg, rgba(77, 243, 115, 0.2), rgba(77, 243, 115, 0.08));
      border: 1px solid rgba(77, 243, 115, 0.4);
      border-radius: 14px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 800;
      color: #4df373;
      letter-spacing: 0.3px;
    }
    .stroke-icon {
      font-size: 14px;
    }
    /* Slingshot Power Badge */
    #power-badge {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 16, 20, 0.88);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 6px 18px;
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.5px;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      z-index: 10;
    }
    /* Instruction Hint */
    #hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 14, 10, 0.72);
      border-radius: 16px;
      padding: 8px 16px;
      color: #e5f5eb;
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      z-index: 10;
      text-align: center;
      width: 86%;
      max-width: 320px;
    }
    /* Modal */
    #modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-card {
      background: rgba(14, 28, 18, 0.95);
      border: 2px solid rgba(255, 222, 67, 0.4);
      border-radius: 28px;
      padding: 30px 24px;
      width: 85%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-title {
      font-size: 26px;
      font-weight: 900;
      color: #ffde43;
      margin-bottom: 8px;
    }
    .modal-stars {
      font-size: 34px;
      margin: 10px 0;
      color: #ffd214;
    }
    .modal-score {
      font-size: 16px;
      color: #fff;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .modal-btn {
      background: linear-gradient(135deg, #1fc953, #169e3f);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 18px;
      padding: 14px 28px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(31, 201, 83, 0.4);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <div class="hud-left">
      <div id="hole-num">1</div>
      <div id="hole-name">Çam Vadisi</div>
    </div>
    <div class="hud-center">
      <div id="par-badge">PAR 2</div>
    </div>
    <div class="hud-right">
      <span class="stroke-icon">🏌️</span>
      <div id="stroke-badge">0</div>
    </div>
  </div>

  <div id="power-badge" style="display:none !important;"></div>

  <div id="hint">🎯 Vuruş: Topa dokun ve geri çek | 🔄 Kamera: Boşlukta kaydır</div>
  <div id="toast" style="display:none; position:fixed; top:75px; left:50%; transform:translateX(-50%); background:rgba(15,23,42,0.92); color:#38bdf8; font-family:-apple-system,sans-serif; font-weight:800; font-size:15px; padding:10px 22px; border-radius:24px; border:1px solid rgba(56,189,248,0.4); box-shadow:0 8px 24px rgba(0,0,0,0.4); z-index:9999; pointer-events:none; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); transition:opacity 0.3s; opacity:0;">Piste Geri Döndü 🔄</div>

  <div id="modal">
    <div class="modal-card">
      <div class="modal-title" id="modal-title">TEBRİKLER! ⛳</div>
      <div class="modal-stars" id="modal-stars">⭐⭐⭐</div>
      <div class="modal-score" id="modal-score">1 Vuruşta Deliğe Girdi! (Par 2)</div>
      <button class="modal-btn" id="next-btn" onclick="nextHole()">SONRAKİ DELİK ➡️</button>
    </div>
  </div>

  <div id="gameover-modal" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); justify-content:center; align-items:center; z-index:100;">
    <div class="modal-card" style="border: 2px solid rgba(255, 60, 60, 0.7); box-shadow: 0 16px 40px rgba(255, 30, 30, 0.3);">
      <div class="modal-title" style="color: #ff3b30;">PARKUR DIŞI! ⚠️</div>
      <div style="font-size: 42px; margin: 12px 0;">💥</div>
      <div class="modal-score" style="color: #ffcccc;">Top pist sınırlarının dışına çıktı!</div>
      <button class="modal-btn" style="background: linear-gradient(135deg, #ff3b30, #c4180f); box-shadow: 0 6px 18px rgba(255, 59, 48, 0.4);" onclick="retryHole()">TEKRAR DENE 🔄</button>
    </div>
  </div>

  <input type="checkbox" id="ios-haptic-switch" style="position:fixed;top:-100px;left:-100px;opacity:0.01;pointer-events:none;" switch>
  <label id="ios-haptic-label" for="ios-haptic-switch" style="position:fixed;top:-100px;left:-100px;opacity:0.01;pointer-events:none;"></label>

  <script>
    // --- iOS Safari & Mobile Compatible Web Audio Engine ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new AudioCtx();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        // iOS WebKit Audio Unlock: Boş sessiz buffer çalarak donanım ses kanalını anında aç
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
      } catch (err) {
        console.warn('Audio init warning:', err);
      }
    }

    // Mobilde ilk dokunmada (touchstart, touchend, pointerdown, click) ses kilidini kaldır
    const unlockEvents = ['touchstart', 'touchend', 'pointerdown', 'mousedown', 'click'];
    function unlockOnFirstTouch() {
      initAudio();
      unlockEvents.forEach(evt => window.removeEventListener(evt, unlockOnFirstTouch, true));
    }
    unlockEvents.forEach(evt => window.addEventListener(evt, unlockOnFirstTouch, { capture: true, passive: false }));

    function ensureAudioReady() {
      if (!audioCtx) initAudio();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // --- Mobile Haptic Feedback (Titreşim) Motoru ---
    function triggerHaptic(type = 'light') {
      // 1. Standart HTML5 Vibration API (Android Chrome, Edge vb.)
      try {
        if (navigator && typeof navigator.vibrate === 'function') {
          if (type === 'light') navigator.vibrate(15);
          else if (type === 'medium') navigator.vibrate(28);
          else if (type === 'hole') navigator.vibrate([25, 45, 35, 45, 60]);
        }
      } catch (err) {}

      // 2. iOS Safari Taptic Engine Workaround (Native Switch Hack)
      try {
        const hapticLabel = document.getElementById('ios-haptic-label');
        if (hapticLabel) {
          hapticLabel.click();
        }
      } catch (err) {}
    }

    function playPutt(p) {
      const ctx = ensureAudioReady();
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(160 + p * 120, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.12);
      gain.gain.setValueAtTime(0.5 + p * 0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.12);
    }

    function playBounce() {
      triggerHaptic('light');
      const ctx = ensureAudioReady();
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(280, t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 0.08);
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.08);
    }

    function playBumper() {
      triggerHaptic('medium');
      const ctx = ensureAudioReady();
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(784, t);
      osc.frequency.exponentialRampToValueAtTime(392, t + 0.25);
      gain.gain.setValueAtTime(0.5, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.25);
    }

    function playHoleIn() {
      triggerHaptic('hole');
      const ctx = ensureAudioReady();
      if (!ctx) return;
      const t = ctx.currentTime;
      const notes = [523, 659, 784, 1046];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const startT = t + idx * 0.09;
        osc.frequency.setValueAtTime(freq, startT);
        gain.gain.setValueAtTime(0.35, startT);
        gain.gain.exponentialRampToValueAtTime(0.01, startT + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startT);
        osc.stop(startT + 0.28);
      });
    }

    // --- Three.js Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7dc2eb);
    scene.fog = new THREE.Fog(0x8ecdf7, 35, 140);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.35, 180);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    // Lights (Golf Battle Tarzı Canlı Güneş ve Doğal Çevre Işığı)
    const ambientLight = new THREE.AmbientLight(0xd5ecff, 0.35);
    scene.add(ambientLight);
    const hemiLight = new THREE.HemisphereLight(0xd8edff, 0x164218, 0.52);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffae8, 1.15);
    sunLight.position.set(24, 42, -18);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 2.0;
    sunLight.shadow.camera.far = 110;
    sunLight.shadow.camera.left = -28;
    sunLight.shadow.camera.right = 28;
    sunLight.shadow.camera.top = 28;
    sunLight.shadow.camera.bottom = -28;
    sunLight.shadow.bias = -0.0004;
    sunLight.shadow.normalBias = 0.02;
    scene.add(sunLight);

    // Doğal golf sahası çevresi (buildGolfEnvironment fonksiyonu ile zenginleştirildi)
    let envClouds = null;
    let envRiverTex = null;

    // --- Golf Battle Birebir Şampiyona Damalı Çim Dokusu (Golf Battle Renk & Desenleri) ---
        // --- Professional Tournament Putting Green (Kesintisiz, Canlı Zümrüt Yeşili - Asla Yapboz Değil!) ---
    function createGolfGrassTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext("2d");

      // Golf Battle Birebir Orijinal Renk Paleti (Canlı açık fıstık yeşili & zengin koyu zümrüt):
      const cLight = "#36a218"; // Golf Battle canlı açık çim karesi
      const cDark  = "#1f750c"; // Golf Battle koyu zümrüt çim karesi

      // 4 Büyük Çeyrek Kare (512x512 her biri - Golf Battle ölçeğinde)
      // Asla yapboz bordür/siyah çizgi yok, pürüzsüz ve temiz geçiş!
      ctx.fillStyle = cDark;
      ctx.fillRect(0, 0, 512, 512);
      ctx.fillRect(512, 512, 512, 512);

      ctx.fillStyle = cLight;
      ctx.fillRect(512, 0, 512, 512);
      ctx.fillRect(0, 512, 512, 512);

      // İnce doğal kadife çim mikro-dokusu (Golf Battle tarzı taze golf yeşili)
      const imgData = ctx.getImageData(0, 0, 1024, 1024);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 5;
        data[i] = Math.min(255, Math.max(0, data[i] + noise * 0.2));
        data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise * 0.5));
        data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise * 0.2));
      }
      ctx.putImageData(imgData, 0, 0);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 1);
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      return tex;
    }

    // --- Procedural High-End Cedar Wood Plank Texture with Rich Grain & Knots ---
        // --- Ultra-Crisp High-Definition Cedar Wood Plank Texture (Yüksek Netlik & Kalas Ayrıntıları) ---
    function createWoodTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");

      // 1. Golf Battle Birebir Sıcak Kestane / Çikolata Temel Ahşap Tonu (#5c2d16)
      ctx.fillStyle = "#5c2d16";
      ctx.fillRect(0, 0, 1024, 512);

      // 2. Belirgin ve stilize ahşap damarları
      for (let y = 0; y < 512; y++) {
        const wave1 = Math.sin(y * 0.07) * 20;
        const wave2 = Math.cos(y * 0.03 + 1.0) * 25;
        const wave = wave1 + wave2;

        const isDarkBand = (Math.floor((y + wave * 0.35) / 14) % 2 === 0);
        const alpha = 0.14 + Math.sin(y * 0.12) * 0.06;

        ctx.fillStyle = isDarkBand ? "rgba(35, 14, 5, " + alpha + ")" : "rgba(130, 68, 34, " + (alpha * 0.95) + ")";
        ctx.fillRect(0, y, 1024, 1);
      }

      // 3. Kalas Seviyeleri (Derin, net yatay kalas gölgeleri ve pah yansımaları)
      const plankY = [0, 128, 256, 384, 512];
      plankY.forEach(py => {
        ctx.fillStyle = "rgba(18, 7, 2, 0.88)";
        ctx.fillRect(0, py - 4, 1024, 6);
        ctx.fillStyle = "rgba(160, 85, 45, 0.45)";
        ctx.fillRect(0, py + 2, 1024, 4);
      });

      // 4. Kalas Bağlantı Vidaları / Çivileri
      for (let px = 64; px < 1024; px += 256) {
        [64, 192, 320, 448].forEach(py => {
          ctx.fillStyle = "rgba(20, 8, 3, 0.75)";
          ctx.beginPath();
          ctx.arc(px, py, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(175, 100, 55, 0.45)";
          ctx.beginPath();
          ctx.arc(px - 1, py - 1, 1.5, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // 5. Doğal Ahşap Budakları
      function drawWoodKnot(kx, ky, r) {
        ctx.fillStyle = "#2a1205";
        ctx.beginPath();
        ctx.ellipse(kx, ky, r * 0.45, r * 0.35, 0.2, 0, Math.PI * 2);
        ctx.fill();

        for (let rad = r * 0.6; rad <= r * 2.2; rad += 4) {
          ctx.strokeStyle = (Math.floor(rad) % 8 === 0) ? "rgba(35, 14, 5, 0.40)" : "rgba(145, 75, 38, 0.25)";
          ctx.lineWidth = 2.0;
          ctx.beginPath();
          ctx.ellipse(kx, ky, rad, rad * 0.65, 0.2, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      drawWoodKnot(180, 190, 24);
      drawWoodKnot(640, 320, 26);
      drawWoodKnot(880, 100, 20);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 1);
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      return tex;
    }

    // --- Procedural High-End Wooden Wall Top Rail Cap (Ultra-Sharp, Beveled, Zero-Aliasing) ---
        // --- Ultra-Crisp Top Rail Cap (Yüksek Netlikte Pahlı Üst Küpeşte) ---
    function createWoodRailTopTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      // 1. Golf Battle Birebir Üst Küpeşte Kestane Tonu (#66331a)
      ctx.fillStyle = "#66331a";
      ctx.fillRect(0, 0, 1024, 256);

      // 2. Boyuna pürüzsüz saten ahşap damarları
      for (let y = 14; y < 242; y++) {
        const wave = Math.sin(y * 0.09) * 10 + Math.cos(y * 0.03) * 14;
        const isDark = (Math.floor((y + wave * 0.35) / 14) % 2 === 0);
        const alpha = 0.10 + Math.sin(y * 0.15) * 0.05;
        ctx.fillStyle = isDark ? "rgba(35, 14, 5, " + alpha + ")" : "rgba(150, 80, 42, " + alpha + ")";
        ctx.fillRect(0, y, 1024, 1);
      }

      // 3. İnce doğal ahşap lifleri
      ctx.fillStyle = "rgba(30, 12, 4, 0.12)";
      for (let i = 0; i < 400; i++) {
        const px = Math.random() * 1024;
        const py = 18 + Math.random() * 220;
        const plen = 25 + Math.random() * 90;
        ctx.fillRect(px, py, plen, 1.2);
      }

      // 4. Kenar Pahları (Beveled Chamfers)
      ctx.fillStyle = "rgba(15, 6, 2, 0.85)";
      ctx.fillRect(0, 0, 1024, 4);
      ctx.fillStyle = "rgba(175, 95, 52, 0.70)";
      ctx.fillRect(0, 4, 1024, 4);
      const gradTop = ctx.createLinearGradient(0, 8, 0, 20);
      gradTop.addColorStop(0.0, "rgba(175, 95, 52, 0.30)");

    // --- Procedural Golf Battle Köşeli Ahşap Engel Kesit Dokusu (Square Timber End Cap) ---
    function createWoodLogEndTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // 1. Dış koyu ahşap kenar çerçevesi (Köşeli kereste)
      ctx.fillStyle = '#3c200c';
      ctx.fillRect(0, 0, 256, 256);

      // 2. Ana doğal açık çam gövdesi
      ctx.fillStyle = '#b8814c';
      ctx.fillRect(8, 8, 240, 240);

      // 3. Yıllık büyüme halkaları (Tree growth rings)
      const cx = 134, cy = 122;
      const numRings = 9;
      for (let i = 1; i <= numRings; i++) {
        const r = (i / numRings) * 115;
        ctx.strokeStyle = (i % 2 === 0) ? 'rgba(92, 49, 17, 0.70)' : 'rgba(125, 71, 28, 0.50)';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        for (let a = 0; a <= Math.PI * 2 + 0.1; a += 0.1) {
          const wobble = Math.sin(a * 4 + i) * 2.0 + Math.cos(a * 3) * 1.5;
          const x = cx + (r + wobble) * Math.cos(a);
          const y = cy + (r + wobble) * Math.sin(a);
          if (a === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // 4. Merkez öz odun (Center pith)
      ctx.fillStyle = '#5c2d0c';
      ctx.beginPath();
      ctx.arc(cx, cy, 7, 0, Math.PI * 2);
      ctx.fill();

      // 5. Kılcal kuruma çatlakları
      ctx.strokeStyle = 'rgba(60, 28, 8, 0.65)';
      ctx.lineWidth = 1.6;
      const crackAngles = [0.35, 1.85, 3.45, 5.0];
      crackAngles.forEach(ang => {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        const len = 48 + ((ang * 23) % 40);
        ctx.lineTo(cx + Math.cos(ang) * len, cy + Math.sin(ang) * len);
        ctx.stroke();
      });

      // 6. 4 Köşede Golf Battle Dövme Demir Köşebent Plakaları ve Perçin Cıvataları
      const bracketSize = 44;
      const bracketThick = 14;
      ctx.fillStyle = '#2d2218';

      // Sol üst, sağ üst, sol alt, sağ alt L-şekilli köşebentler
      const corners = [
        [0, 0, 1, 1],
        [256, 0, -1, 1],
        [0, 256, 1, -1],
        [256, 256, -1, -1]
      ];
      corners.forEach(([x, y, sx, sy]) => {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + sx * bracketSize, y);
        ctx.lineTo(x + sx * bracketSize, y + sy * bracketThick);
        ctx.lineTo(x + sx * bracketThick, y + sy * bracketThick);
        ctx.lineTo(x + sx * bracketThick, y + sy * bracketSize);
        ctx.lineTo(x, y + sy * bracketSize);
        ctx.closePath();
        ctx.fill();

        // Demir perçin cıvatası (Rivet bolt)
        ctx.fillStyle = '#6e5a48';
        ctx.beginPath();
        ctx.arc(x + sx * (bracketThick * 0.5 + 2), y + sy * (bracketThick * 0.5 + 2), 3.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2d2218';
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy() || 8;
      return tex;
    }

    // --- Procedural Golf Battle Snowy Valley Çatlak Mozaik Buz Dokusu ---
    function createIceTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // 1. Golf Battle Snowy Valley Zengin Arktik Mavi Degrade
      const bgGrad = ctx.createRadialGradient(256, 256, 40, 256, 256, 360);
      bgGrad.addColorStop(0.0, '#1cb8ff');
      bgGrad.addColorStop(0.5, '#0096e6');
      bgGrad.addColorStop(1.0, '#006fb8');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 512, 512);

      // 2. Mozaik Buz Blokları ve Kırılma Poligonları (Golf Battle Cleavage Facets)
      const cells = [
        [[0,0], [140,0], [170,110], [90,160], [0,120]],
        [[140,0], [320,0], [350,90], [260,140], [170,110]],
        [[320,0], [512,0], [512,130], [390,160], [350,90]],
        [[0,120], [90,160], [120,290], [0,270]],
        [[90,160], [170,110], [260,140], [280,260], [190,300], [120,290]],
        [[260,140], [350,90], [390,160], [430,280], [360,310], [280,260]],
        [[390,160], [512,130], [512,290], [430,280]],
        [[0,270], [120,290], [140,430], [0,410]],
        [[120,290], [190,300], [280,260], [310,390], [210,450], [140,430]],
        [[280,260], [360,310], [430,280], [460,420], [370,440], [310,390]],
        [[430,280], [512,290], [512,440], [460,420]],
        [[0,410], [140,430], [120,512], [0,512]],
        [[140,430], [210,450], [310,390], [290,512], [120,512]],
        [[310,390], [370,440], [460,420], [470,512], [290,512]],
        [[460,420], [512,440], [512,512], [470,512]]
      ];

      cells.forEach((poly, idx) => {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(poly[0][0], poly[0][1]);
        for(let i=1; i<poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
        ctx.closePath();
        ctx.clip();

        const cx = poly.reduce((s, p) => s + p[0], 0) / poly.length;
        const cy = poly.reduce((s, p) => s + p[1], 0) / poly.length;
        const radGrad = ctx.createRadialGradient(cx - 20, cy - 20, 5, cx, cy, 90);
        const tint = (idx % 3 === 0) ? 'rgba(80, 220, 255, 0.35)' : (idx % 3 === 1) ? 'rgba(255, 255, 255, 0.22)' : 'rgba(0, 110, 190, 0.25)';
        radGrad.addColorStop(0, tint);
        radGrad.addColorStop(1, 'rgba(0,0,0,0.12)');
        ctx.fillStyle = radGrad;
        ctx.fillRect(0,0,512,512);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      });

      // 3. Bloklar Arasındaki Işıltılı Geniş Buz Çatlakları
      ctx.strokeStyle = 'rgba(180, 240, 255, 0.60)';
      ctx.lineWidth = 5.0;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      cells.forEach(poly => {
        ctx.beginPath();
        ctx.moveTo(poly[0][0], poly[0][1]);
        for(let i=1; i<poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
        ctx.closePath();
        ctx.stroke();
      });

      // 4. Keskin ve Net Beyaz Çatlak Çizgileri
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.2;
      cells.forEach(poly => {
        ctx.beginPath();
        ctx.moveTo(poly[0][0], poly[0][1]);
        for(let i=1; i<poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
        ctx.closePath();
        ctx.stroke();
      });

      // 5. Kılcal Çatlak Damarları (Micro-cracks)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth = 1.2;
      for (let i = 0; i < 40; i++) {
        const x = (i * 97 + 23) % 512;
        const y = (i * 83 + 47) % 512;
        const len = 14 + ((i * 19) % 22);
        const ang = ((i * 51) % 360) * Math.PI / 180;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
        ctx.lineTo(x + Math.cos(ang + 0.6) * (len * 0.7), y + Math.sin(ang + 0.6) * (len * 0.7));
        ctx.stroke();
      }

      // 6. Işıltılı Don Kristalleri
      for (let i = 0; i < 30; i++) {
        const sx = (i * 137 + 15) % 512;
        const sy = (i * 151 + 29) % 512;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(sx, sy, 1.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(200, 245, 255, 0.4)';
        ctx.beginPath();
        ctx.arc(sx, sy, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    // --- 3D Oyulmuş Petek Desenli Saf Beyaz Golf Topu (100% Pure White Honeycomb Carved Ball) ---
    function createGolfBallTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // 1. Kusursuz Saf Beyaz Turnuva Tabanı (Başka hiçbir renk yok)
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 1024, 1024);

      // 2. 3D Oyulmuş Petek (Hexagonal) Deseni - Staggered Honeycomb Grid
      const r = 16;
      const hexW = Math.sqrt(3) * r; // ~27.7px
      const hexH = 1.5 * r;          // 24px

      const cols = Math.ceil(1024 / hexW) + 2;
      const rows = Math.ceil(1024 / hexH) + 2;

      function drawHexagon(cx, cy, radius) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = (i * Math.PI) / 3 - Math.PI / 6;
          const x = cx + radius * Math.cos(angle);
          const y = cy + radius * Math.sin(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
      }

      // Her bir petek hücresi saf beyaz zemin üzerine oyulmuş gölge ve pah ışıltısıyla işlenir
      for (let row = -1; row < rows; row++) {
        const y = row * hexH;
        const isOdd = row % 2 !== 0;
        const xOffset = isOdd ? hexW * 0.5 : 0;

        for (let col = -1; col < cols; col++) {
          const x = col * hexW + xOffset;

          // 1. Oyuk çukur iç derinlik gradyanı (saf beyazdan açık gümüşi beyaza)
          const grad = ctx.createRadialGradient(x - r * 0.22, y - r * 0.22, r * 0.1, x, y, r * 0.88);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.55, '#f4f6f9');
          grad.addColorStop(0.85, '#e1e7ed');
          grad.addColorStop(1.0, '#cbd4dc');

          ctx.save();
          drawHexagon(x, y, r * 0.88);
          ctx.fillStyle = grad;
          ctx.fill();

          // 2. Üst ve sol-iç oyuk kenar gölgesi (Ambiyans oklüzyonu)
          ctx.strokeStyle = 'rgba(150, 165, 180, 0.45)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          for (let i = 2; i <= 4; i++) {
            const angle = (i * Math.PI) / 3 - Math.PI / 6;
            const hx = x + r * 0.88 * Math.cos(angle);
            const hy = y + r * 0.88 * Math.sin(angle);
            if (i === 2) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.stroke();

          // 3. Alt ve sağ-iç oyuk pah ışıltısı (Parlak beyaz yansıma)
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          for (let i = 5; i <= 7; i++) {
            const angle = ((i % 6) * Math.PI) / 3 - Math.PI / 6;
            const hx = x + r * 0.88 * Math.cos(angle);
            const hy = y + r * 0.88 * Math.sin(angle);
            if (i === 5) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.stroke();

          ctx.restore();
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.generateMipmaps = true;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy() || 8;
      return tex;
    }

    // 3D Oyulmuş Petek Yükseklik Haritası (Gerçekçi PBR Bump Mapping)
    function createGolfBallBumpTexture() {

      function drawHexagon(cx, cy, radius) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {

          const y = cy + radius * Math.sin(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();

      for (let row = -1; row < rows; row++) {

    // --- Gerçekçi & Estetik Golf Battle "Pine Forest" Doğal Ortamı ---
    function buildGolfEnvironment() {

      // 1. Zengin ve Canlı Golf Orman Çimi Dokusu (Procedural Woodland Turf Texture)
      function createWoodlandTurfTexture() {

        for (let i = 0; i < d.length; i += 4) {
          const n = (Math.random() - 0.5) * 7;
          d[i] = Math.max(0, Math.min(255, d[i] + n * 0.25));
          d[i+1] = Math.max(0, Math.min(255, d[i+1] + n * 0.55));
          d[i+2] = Math.max(0, Math.min(255, d[i+2] + n * 0.25));
        }
        ctx.putImageData(imgData, 0, 0);

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(12, 12);
        tex.generateMipmaps = true;
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.magFilter = THREE.LinearFilter;
        return tex;
      }

      // 2. Berrak ve Yansımalı Göl Suyu Dokusu
      function createLakeWaterTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 256, 256);
        grad.addColorStop(0, '#0ea5e9');
        grad.addColorStop(0.5, '#0284c7');
        grad.addColorStop(1, '#0369a1');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 256, 256);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
        ctx.lineWidth = 1.8;
        for (let y = 14; y < 256; y += 28) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.bezierCurveTo(70, y - 5, 180, y + 5, 256, y);
          ctx.stroke();
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(3, 3);
        return tex;
      }

          puff.position.set(Math.cos(angle) * 0.52, 0, Math.sin(angle) * 0.52);
          puff.castShadow = true;
          puff.receiveShadow = true;
          t1.add(puff);

        tree.add(t1);

        const t2 = new THREE.Group();
        t2.position.y = 2.05;

          puff.position.set(Math.cos(angle) * 0.40, 0, Math.sin(angle) * 0.40);
          puff.castShadow = true;
          puff.receiveShadow = true;
          t2.add(puff);
        }
        tree.add(t2);

        // 3. Katman (Orta-üst, 3 küme)
        const t3 = new THREE.Group();
        t3.position.y = 2.68;

          puff.castShadow = true;
          puff.receiveShadow = true;
          t3.add(puff);

        tree.add(t3);

        // 4. Katman (Zirve İğne Tacı)

        crown.castShadow = true;
        crown.receiveShadow = true;
        tree.add(crown);

        envGroup.add(tree);

      // 7. Golf Battle Rustik Ahşap Çitler (Split-Rail Wooden Fences)
      function createSplitRailFence(x1, z1, x2, z2) {
        const dx = x2 - x1;
        const dz = z2 - z1;
        const dist = Math.sqrt(dx * dx + dz * dz);
        const angle = Math.atan2(dz, dx);

        const fenceGroup = new THREE.Group();
        fenceGroup.position.set(x1, 0, z1);
        fenceGroup.rotation.y = -angle;

        const numPosts = Math.max(2, Math.ceil(dist / 2.6) + 1);
        const postStep = dist / (numPosts - 1);

        for (let i = 0; i < numPosts; i++) {
          const postGeo = new THREE.CylinderGeometry(0.07, 0.09, 1.4, 6);
          const post = new THREE.Mesh(postGeo, pineBarkMat);
          post.position.set(i * postStep, 0.35, 0);
          post.castShadow = true;
          fenceGroup.add(post);
        }

        for (let r = 0; r < 2; r++) {
          const railGeo = new THREE.BoxGeometry(dist, 0.06, 0.08);
          const rail = new THREE.Mesh(railGeo, pineBarkMat);
          rail.position.set(dist * 0.5, 0.42 + r * 0.32, 0);
          rail.castShadow = true;
          fenceGroup.add(rail);
        }

        envGroup.add(fenceGroup);
      }

    // --- Golf Battle Tarzı 3D Dinamik Hız Baremi & Hedef Yayı (Velocity Power Runway) ---

    function getGroundHeight(x, z, fallbackY = null) {
      downRayOrigin.set(x, 15.0, z);
      downRay.set(downRayOrigin, downRayDir);
      let hits = downRay.intersectObjects(floorMeshes, false);
      if (hits.length > 0) {
        return hits[0].point.y;
      }
      // Mikro-derz / karo birleşim dikişlerinde dikey ışının boşluğa düşmesini önleyen mikro örnekleme
      const offsets = [
        [0.025, 0], [-0.025, 0], [0, 0.025], [0, -0.025],
        [0.035, 0.035], [-0.035, -0.035]
      ];
      for (let i = 0; i < offsets.length; i++) {
        downRayOrigin.set(x + offsets[i][0], 15.0, z + offsets[i][1]);
        downRay.set(downRayOrigin, downRayDir);
        hits = downRay.intersectObjects(floorMeshes, false);
        if (hits.length > 0) {
          return hits[0].point.y;
        }
      }
      return fallbackY;
    }

      else if (idx === 8) buildHole9();
      else if (idx === 9) buildHole10();

      buildCupAndFlag(data.cup);
      spawnDecorations(idx);

      // Ensure all world matrices are calculated so raycasts are 100% accurate
      scene.updateMatrixWorld(true);

      // Snap ball perfectly onto the top surface of the green
      const initGroundY = getGroundHeight(ballPos.x, ballPos.z, data.spawn.y - ballRadius) ?? (data.spawn.y - ballRadius);
      lastGroundY = initGroundY;
      ballPos.y = initGroundY + ballRadius;
      lastSafePos.copy(ballPos);

      // Reset Camera Orbit to look from behind the ball toward the fairway / cup
      const toCup = holeCupPos.clone().sub(ballPos);
      toCup.y = 0;
      camYaw = urlParams.has('yaw') ? parseFloat(urlParams.get('yaw')) : (data.initYaw !== undefined ? data.initYaw : Math.atan2(toCup.x, toCup.z));
      camPitch = urlParams.has('pitch') ? parseFloat(urlParams.get('pitch')) : 0.42;

      const lookTarget = ballPos.clone().add(new THREE.Vector3(0, camHeightOffset, 0));
      camera.position.set(
        ballPos.x - Math.sin(camYaw) * Math.cos(camPitch) * camDist,
        ballPos.y + Math.sin(camPitch) * camDist,
        ballPos.z - Math.cos(camYaw) * Math.cos(camPitch) * camDist
      );
      cameraLookCurrent.copy(lookTarget);
      camera.lookAt(lookTarget);
      camera.updateMatrixWorld(true);
    }

    // Dünya koordinatlı dikişsiz UV haritalama (Tüm bölümler ve tüm zemin parçaları 100% aynı hizalı)
    function applyWorldUVs(geo, meshX, meshZ, scale = 2.4) {
      const pos = geo.attributes.position;
      const count = pos.count;
      const uvs = new Float32Array(count * 2);
      for (let i = 0; i < count; i++) {
        const wx = pos.getX(i) + meshX;
        const wz = pos.getZ(i) + meshZ;
        uvs[i * 2] = wx / scale;
        uvs[i * 2 + 1] = wz / scale;
      }
      geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    }

    function addFloor(x, y, z, w, h, d, mat = null) {
      const geo = new THREE.BoxGeometry(w, h, d);
      applyWorldUVs(geo, x, z, 1.8);
      const floorMat = mat || grassMat;
      const mesh = new THREE.Mesh(geo, floorMat);
      mesh.position.set(x, y, z);
      mesh.receiveShadow = true;
      courseGroup.add(mesh);
      floorMeshes.push(mesh);
      return mesh;
    }

    // --- Yuvarlak Delik Çukuru Açılmış Tek Parça Dikişsiz Zemin ---
    // Deliğin önü, arkası ve yanları %100 yemyeşil zeminle kaplıdır; sadece yuvarlak delik çukurdur!
    function addFloorWithCupHole(x, y, z, w, h, d, cupWorldX, cupWorldZ, cupRadius) {
      const hw = w * 0.5;
      const hd = d * 0.5;
      const shape = new THREE.Shape();
      shape.moveTo(-hw, hd);
      shape.lineTo(hw, hd);
      shape.lineTo(hw, -hd);
      shape.lineTo(-hw, -hd);
      shape.closePath();

      const localCupX = cupWorldX - x;
      const localCupZ = cupWorldZ - z;
      const hole = new THREE.Path();
      hole.absarc(localCupX, -localCupZ, cupRadius, 0, Math.PI * 2, true);
      shape.holes = [hole];

      const extrudeSettings = { depth: h, bevelEnabled: false };
      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.rotateX(-Math.PI / 2);
      geo.translate(0, -h * 0.5, 0);

      applyWorldUVs(geo, x, z, 1.8);

      const floorMat = grassMat;
      const mesh = new THREE.Mesh(geo, floorMat);
      mesh.position.set(x, y, z);
      mesh.receiveShadow = true;
      courseGroup.add(mesh);
      floorMeshes.push(mesh);
      return mesh;
    }

    // Duvarların yan ve üst yüzeylerine piksel kalitesinde, açı değiştikçe ASLA bozulmayan UV haritalaması
    function setupWallUVs(geo, w, h, d) {
      const uvs = geo.attributes.uv.array;
      const isAlongZ = d >= w;
      const len = isAlongZ ? d : w;
      const repLen = Math.max(1, len / 1.6);

      function setFaceUV(faceIdx, u0, v0, u1, v1, u2, v2, u3, v3) {
        const base = faceIdx * 8;
        uvs[base + 0] = u0; uvs[base + 1] = v0;
        uvs[base + 2] = u1; uvs[base + 3] = v1;
        uvs[base + 4] = u2; uvs[base + 5] = v2;
        uvs[base + 6] = u3; uvs[base + 7] = v3;
      }

      if (isAlongZ) {
        // Face 2 (+Y Üst Küpeşte / Rail Cap): Boyuna pürüzsüz akış, kenarlarda 3D pah ışıltısı
        setFaceUV(2, 0, 0,  0, 1,  repLen, 0,  repLen, 1);
        // Face 3 (-Y Alt):
        setFaceUV(3, 0, 0,  0, 1,  repLen, 0,  repLen, 1);
        // Face 0 (+X) ve 1 (-X) Uzun Yan Yüzeyler: Boyuna ahşap kalaslar
        setFaceUV(0, 0, 1,  repLen, 1,  0, 0,  repLen, 0);
        setFaceUV(1, 0, 1,  repLen, 1,  0, 0,  repLen, 0);
        // Face 4 (+Z) ve 5 (-Z) Kısa Uç Kapaklar
        setFaceUV(4, 0, 1, 1, 1, 0, 0, 1, 0);
        setFaceUV(5, 0, 1, 1, 1, 0, 0, 1, 0);
      } else {
        // isAlongX:
        // Face 2 (+Y Üst Küpeşte / Rail Cap): Boyuna pürüzsüz akış, kenarlarda 3D pah ışıltısı
        setFaceUV(2, 0, 0,  repLen, 0,  0, 1,  repLen, 1);
        // Face 3 (-Y Alt):
        setFaceUV(3, 0, 0,  repLen, 0,  0, 1,  repLen, 1);
        // Face 4 (+Z) ve 5 (-Z) Uzun Yan Yüzeyler
        setFaceUV(4, 0, 1,  repLen, 1,  0, 0,  repLen, 0);
        setFaceUV(5, 0, 1,  repLen, 1,  0, 0,  repLen, 0);
        // Face 0 (+X) ve 1 (-X) Kısa Uç Kapaklar
        setFaceUV(0, 0, 1, 1, 1, 0, 0, 1, 0);
        setFaceUV(1, 0, 1, 1, 1, 0, 0, 1, 0);
      }
      geo.attributes.uv.needsUpdate = true;
    }

    
    function isPointInTriangle2D(px, pz, x1, z1, x2, z2, x3, z3) {
      const d1 = (px - x2) * (z1 - z2) - (x1 - x2) * (pz - z2);
      const d2 = (px - x3) * (z2 - z3) - (x2 - x3) * (pz - z3);
      const d3 = (px - x1) * (z3 - z1) - (x3 - x1) * (pz - z1);
      const hasNeg = (d1 < -0.0001) || (d2 < -0.0001) || (d3 < -0.0001);
      const hasPos = (d1 > 0.0001) || (d2 > 0.0001) || (d3 > 0.0001);
      return !(hasNeg && hasPos);
    }

    // --- Golf Battle 45-Derece Açılı Ahşap Köşe Pahları (Bank Corner Wedges) ---
    // Altı, üstü ve tüm kenarları 100% kapalı, masif 3D üçgen prizma ahşap blok!
    function addCornerWedge(cx, cz, dirX, dirZ, size = 0.72, y = 0.29, h = 0.58) {
      const extraDepth = 0.35;
      const visualH = h + extraDepth;
      const yBot = (y - h * 0.5) - extraDepth;
      const yTop = y + h * 0.5;

      const geo = new THREE.BufferGeometry();
      const T0 = [cx, yTop, cz];
      const T1 = [cx + dirX * size, yTop, cz];
      const T2 = [cx, yTop, cz + dirZ * size];
      const B0 = [cx, yBot, cz];
      const B1 = [cx + dirX * size, yBot, cz];
      const B2 = [cx, yBot, cz + dirZ * size];

      const nx = dirX * 0.70710678;
      const nz = dirZ * 0.70710678;

      let positions = [];
      let normals = [];
      let uvs = [];

      function addTri(pA, pB, pC, n, uvA, uvB, uvC) {
        positions.push(...pA, ...pB, ...pC);
        normals.push(...n, ...n, ...n);
        uvs.push(...uvA, ...uvB, ...uvC);
      }

      function addQuadPoints(pBL, pBR, pTR, pTL, targetNorm, uvBL, uvBR, uvTR, uvTL) {
        const v1x = pBR[0] - pBL[0], v1y = pBR[1] - pBL[1], v1z = pBR[2] - pBL[2];
        const v2x = pTL[0] - pBL[0], v2y = pTL[1] - pBL[1], v2z = pTL[2] - pBL[2];
        const cxNorm = v1y * v2z - v1z * v2y;
        const cyNorm = v1z * v2x - v1x * v2z;
        const czNorm = v1x * v2y - v1y * v2x;
        const dot = cxNorm * targetNorm[0] + cyNorm * targetNorm[1] + czNorm * targetNorm[2];
        if (dot >= 0) {
          addTri(pBL, pBR, pTR, targetNorm, uvBL, uvBR, uvTR);
          addTri(pBL, pTR, pTL, targetNorm, uvBL, uvTR, uvTL);
        } else {
          addTri(pBL, pTR, pBR, targetNorm, uvBL, uvTR, uvBR);
          addTri(pBL, pTL, pTR, targetNorm, uvBL, uvTL, uvTR);
        }
      }

      // Group 0 (3 vertices): Üst Kapak (Top Cap) - wedgeTopMat (üst ray pahı)
      if (dirX * dirZ > 0) {
        addTri(T0, T2, T1, [0, 1, 0], [0.5, 0.5], [0, 1], [1, 0]);
      } else {
        addTri(T0, T1, T2, [0, 1, 0], [0.5, 0.5], [1, 0], [0, 1]);
      }

      // Group 1 (21 vertices): Masif Ahşap Yan ve Alt Yüzeyler - wedgeMat
      // 1. Alt Kapak (Bottom Cap) - Tam Kapalı Masif Taban!
      if (dirX * dirZ > 0) {
        addTri(B0, B1, B2, [0, -1, 0], [0.5, 0.5], [1, 0], [0, 1]);
      } else {
        addTri(B0, B2, B1, [0, -1, 0], [0.5, 0.5], [0, 1], [1, 0]);
      }

      // 2. Çarpışma ve Bant Yüzeyi (Front 45-deg Face)
      addQuadPoints(B1, B2, T2, T1, [nx, 0, nz], [0, 0], [1, 0], [1, 1], [0, 1]);

      // 3. Arka Yan Yüzey 1 (X eksenine paralel arka yüzey)
      addQuadPoints(B0, B1, T1, T0, [0, 0, -dirZ], [0, 0], [1, 0], [1, 1], [0, 1]);

      // 4. Arka Yan Yüzey 2 (Z eksenine paralel arka yüzey)
      addQuadPoints(B0, B2, T2, T0, [-dirX, 0, 0], [0, 0], [1, 0], [1, 1], [0, 1]);

      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
      geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));

      // Multi-material grupları: 0: wedgeTopMat (üst ray pahı), 1: wedgeMat (masif ahşap yan/alt)
      geo.addGroup(0, 3, 0);
      geo.addGroup(3, 21, 1);

      const mesh = new THREE.Mesh(geo, [wedgeTopMat, wedgeMat]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      courseGroup.add(mesh);

      // Fizik verileri
      const v1x = cx + dirX * size;
      const v1z = cz;
      const v2x = cx;
      const v2z = cz + dirZ * size;
      const segDx = v2x - v1x;
      const segDz = v2z - v1z;
      const segLenSq = segDx * segDx + segDz * segDz;

      const minX = Math.min(cx, v1x, v2x) - 0.25;
      const maxX = Math.max(cx, v1x, v2x) + 0.25;
      const minZ = Math.min(cz, v1z, v2z) - 0.25;
      const maxZ = Math.max(cz, v1z, v2z) + 0.25;

      cornerWedges.push({
        cx: cx,
        cz: cz,
        dirX: dirX,
        dirZ: dirZ,
        size: size,
        v1x: v1x,
        v1z: v1z,
        v2x: v2x,
        v2z: v2z,
        segDx: segDx,
        segDz: segDz,
        segLenSq: segLenSq,
        nx: nx,
        nz: nz,
        midX: cx + dirX * size * 0.5,
        midZ: cz + dirZ * size * 0.5,
        minX: minX,
        maxX: maxX,
        minZ: minZ,
        maxZ: maxZ,
        yMin: yBot,
        yMax: yTop + 2.0
      });

      return mesh;
    }

    function addWall(x, y, z, w, h, d) {
      // Duvarın zeminin altına derinlemesine (0.35m aşağıya) uzanması sağlanır.
      // Bu sayede alttan ışık kaçması (peter-panning / light leakage) kesinlikle engellenir!
      const extraDepth = 0.35;
      const visualH = h + extraDepth;
      const visualY = y - extraDepth * 0.5;

      const geo = new THREE.BoxGeometry(w, visualH, d);
      setupWallUVs(geo, w, visualH, d);

      const mesh = new THREE.Mesh(geo, wallMaterials);
      mesh.position.set(x, visualY, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      courseGroup.add(mesh);

      colliders.push({
        box: new THREE.Box3().setFromObject(mesh),
        normal: null
      });
      return mesh;
    }

    function addBooster(x, y, z, w, d, speed = 20) {
      const geo = new THREE.BoxGeometry(w, 0.04, d);
      const mesh = new THREE.Mesh(geo, boosterMat);
      mesh.position.set(x, y + 0.02, z);
      courseGroup.add(mesh);
      speedBoosters.push({
        box: new THREE.Box3().setFromObject(mesh),
        dir: new THREE.Vector3(0, 0, 1),
        speed: speed
      });
    }

    function addSand(x, y, z, w, d) {
      const geo = new THREE.BoxGeometry(w, 0.02, d);
      const mesh = new THREE.Mesh(geo, sandMat);
      mesh.position.set(x, y + 0.005, z);
      mesh.receiveShadow = true;
      courseGroup.add(mesh);
      sandTraps.push({
        x: x,
        y: y,
        z: z,
        halfW: w * 0.5,
        halfD: d * 0.5
      });
    }

    // --- Kaygan ve Hızlandıran Buz Alanı (Ice Surface) ---
    function addIce(x, y, z, w, d) {
      const geo = new THREE.BoxGeometry(w, 0.026, d);
      const mesh = new THREE.Mesh(geo, iceMat);
      // Çim zemin kotundan 0.012m yukarıda pürüzsüz kaygan katman
      mesh.position.set(x, y + 0.012, z);
      mesh.receiveShadow = true;
      courseGroup.add(mesh);

      // Golf Battle tarzı estetik buz çerçevesi / kristal pah kenarlığı
      const borderGeo = new THREE.BoxGeometry(w + 0.06, 0.016, d + 0.06);
      const borderMat = new THREE.MeshStandardMaterial({
        color: 0x8be4ff,
        roughness: 0.1,
        metalness: 0.2,
        transparent: true,
        opacity: 0.50
      });
      const borderMesh = new THREE.Mesh(borderGeo, borderMat);
      borderMesh.position.set(x, y + 0.008, z);
      borderMesh.receiveShadow = true;
      courseGroup.add(borderMesh);

      icePatches.push({
        x: x,
        y: y,
        z: z,
        halfW: w * 0.5,
        halfD: d * 0.5
      });
      return mesh;
    }

    // --- Dinamik Tramplin / Zıplama Rampası (Jump Ramp) ---
    function addJumpRamp(x, y, z, w, h, d, pitch) {
      const ramp = addFloor(x, y, z, w, h, d);
      ramp.rotation.x = pitch;
      ramp.updateMatrixWorld(true);

      const rw1 = addWall(x - w * 0.5 + 0.13, y + 0.35, z, 0.26, 0.8, d + 0.1);
      rw1.rotation.x = pitch;
      const rw2 = addWall(x + w * 0.5 - 0.13, y + 0.35, z, 0.26, 0.8, d + 0.1);
      rw2.rotation.x = pitch;

      jumpRamps.push({
        x: x,
        z: z,
        halfW: w * 0.5,
        halfD: d * 0.5,
        pitch: pitch
      });
      return ramp;

    function addBumper(x, y, z, radius = 0.4) {

      // 4. Deliğin Üst Çevresindeki Net Beyaz Çember Çizgisi (Net ve belirgin hedef halkası)

    // --- Golf Battle Tarzı Köşeli Ahşap / Kalas / Kiriş Engeli (Square Timber Beam) ---
    function createWoodLogMesh(length = 1.8, width = 0.34, height = 0.30) {
      const group = new THREE.Group();

      // 1. Ana köşeli ahşap kalas gövdesi (BoxGeometry: length X ekseni boyunca, height Y, width Z)
      const geo = new THREE.BoxGeometry(length, height, width);

      // UV haritalama: uzun yüzeylerde ahşap deseni boylu boyunca aksın
      const uvs = geo.attributes.uv.array;
      const rep = Math.max(1, length / 1.5);
      // BoxGeometry: +Y, -Y, +Z, -Z yüzeyleri (indeks 16...47)
      for (let i = 16; i < 48; i += 2) {
        uvs[i] *= rep;
      }
      geo.attributes.uv.needsUpdate = true;

      // [face+X (end), face-X (end), face+Y (top), face-Y (bottom), face+Z (front), face-Z (back)]
      const materials = [logEndMat, logEndMat, woodMat, woodMat, woodMat, woodMat];
      const beamMesh = new THREE.Mesh(geo, materials);
      beamMesh.castShadow = true;
      beamMesh.receiveShadow = true;
      group.add(beamMesh);

      // 2. Golf Battle tarzı dövme demir sabitleme kelepçeleri (Köşeli metal kuşaklar)
      const strapGeo = new THREE.BoxGeometry(0.055, height * 1.05, width * 1.05);
      const strapMat = new THREE.MeshStandardMaterial({
        color: 0x3d3126,
        roughness: 0.45,
        metalness: 0.65
      });

      const offsetDist = length * 0.5 - 0.16;
      if (offsetDist > 0.15) {
        const strap1 = new THREE.Mesh(strapGeo, strapMat);
        strap1.position.set(-offsetDist, 0, 0);
        strap1.castShadow = true;
        group.add(strap1);

        const strap2 = new THREE.Mesh(strapGeo, strapMat);
        strap2.position.set(offsetDist, 0, 0);
        strap2.castShadow = true;
        group.add(strap2);
      }

      return group;
    }

    function addWoodLog(x, y, z, length = 1.8, width = 0.34, angle = 0) {
      // Köşeli kereste boyutları (Genişlik: 0.34m, Yükseklik: 0.30m)
      const beamW = (width !== undefined && width > 0.22) ? width : (width ? width * 2.0 : 0.34);
      const beamH = 0.30;
      const mesh = createWoodLogMesh(length, beamW, beamH);
      mesh.position.set(x, y + beamH * 0.5, z);
      mesh.rotation.y = angle;
      courseGroup.add(mesh);

      woodLogs.push({
        x: x,
        y: y + beamH * 0.5,
        z: z,
        baseY: y,
        length: length,
        halfL: length * 0.5,
        width: beamW,
        halfW: beamW * 0.5,
        height: beamH,
        angle: angle,
        cosA: Math.cos(angle),
        sinA: Math.sin(angle),
        mesh: mesh
      });
      return mesh;
    }
