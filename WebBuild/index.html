<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MiniGolf 3D">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Velocity Mini-Golf 3D (Mobile Edition)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #6bb4de;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }
    /* Top HUD */
    #hud {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      background: rgba(10, 25, 15, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      z-index: 10;
    }
    #hole-name {
      font-weight: 700;
      font-size: 14px;
      color: #ffde43;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #par-badge {
      font-size: 13px;
      font-weight: 600;
      color: #ccc;
    }
    #stroke-badge {
      font-size: 14px;
      font-weight: 800;
      color: #4df373;
    }
    /* Slingshot Power Badge */
    #power-badge {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 16, 20, 0.88);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 6px 18px;
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.5px;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      z-index: 10;
    }
    /* Instruction Hint */
    #hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 14, 10, 0.72);
      border-radius: 16px;
      padding: 8px 16px;
      color: #e5f5eb;
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      z-index: 10;
      text-align: center;
      width: 86%;
      max-width: 320px;
    }
    /* Modal */
    #modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-card {
      background: rgba(14, 28, 18, 0.95);
      border: 2px solid rgba(255, 222, 67, 0.4);
      border-radius: 28px;
      padding: 30px 24px;
      width: 85%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-title {
      font-size: 26px;
      font-weight: 900;
      color: #ffde43;
      margin-bottom: 8px;
    }
    .modal-stars {
      font-size: 34px;
      margin: 10px 0;
      color: #ffd214;
    }
    .modal-score {
      font-size: 16px;
      color: #fff;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .modal-btn {
      background: linear-gradient(135deg, #1fc953, #169e3f);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 18px;
      padding: 14px 28px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(31, 201, 83, 0.4);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <div id="hole-name">1. Çam Vadisi</div>
    <div id="par-badge">PAR: 2</div>
    <div id="stroke-badge">VURUŞ: 0</div>
  </div>

  <div id="power-badge">%0 GÜÇ</div>

  <div id="hint">🎯 Vuruş: Topa dokun ve geri çek | 🔄 Kamera: Boşlukta kaydır</div>

  <div id="modal">
    <div class="modal-card">
      <div class="modal-title" id="modal-title">TEBRİKLER! ⛳</div>
      <div class="modal-stars" id="modal-stars">⭐⭐⭐</div>
      <div class="modal-score" id="modal-score">1 Vuruşta Deliğe Girdi! (Par 2)</div>
      <button class="modal-btn" id="next-btn" onclick="nextHole()">SONRAKİ DELİK ➡️</button>
    </div>
  </div>

  <div id="gameover-modal" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); justify-content:center; align-items:center; z-index:100;">
    <div class="modal-card" style="border: 2px solid rgba(255, 60, 60, 0.7); box-shadow: 0 16px 40px rgba(255, 30, 30, 0.3);">
      <div class="modal-title" style="color: #ff3b30;">PARKUR DIŞI! ⚠️</div>
      <div style="font-size: 42px; margin: 12px 0;">💥</div>
      <div class="modal-score" style="color: #ffcccc;">Top pist sınırlarının dışına çıktı!</div>
      <button class="modal-btn" style="background: linear-gradient(135deg, #ff3b30, #c4180f); box-shadow: 0 6px 18px rgba(255, 59, 48, 0.4);" onclick="retryHole()">TEKRAR DENE 🔄</button>
    </div>
  </div>

  <input type="checkbox" id="ios-haptic-switch" style="position:fixed;top:-100px;left:-100px;opacity:0.01;pointer-events:none;" switch>
  <label id="ios-haptic-label" for="ios-haptic-switch" style="position:fixed;top:-100px;left:-100px;opacity:0.01;pointer-events:none;"></label>

  <script>
    // --- iOS Safari & Mobile Compatible Web Audio Engine ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new AudioCtx();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        // iOS WebKit Audio Unlock: Boş sessiz buffer çalarak donanım ses kanalını anında aç
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
      } catch (err) {
        console.warn('Audio init warning:', err);
      }
    }

    // Mobilde ilk dokunmada (touchstart, touchend, pointerdown, click) ses kilidini kaldır
    const unlockEvents = ['touchstart', 'touchend', 'pointerdown', 'mousedown', 'click'];
    function unlockOnFirstTouch() {
      initAudio();
      unlockEvents.forEach(evt => window.removeEventListener(evt, unlockOnFirstTouch, true));
    }
    unlockEvents.forEach(evt => window.addEventListener(evt, unlockOnFirstTouch, { capture: true, passive: false }));

    function ensureAudioReady() {
      if (!audioCtx) initAudio();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // --- Mobile Haptic Feedback (Titreşim) Motoru ---
    function triggerHaptic(type = 'light') {
      // 1. Standart HTML5 Vibration API (Android Chrome, Edge vb.)
      try {
        if (navigator && typeof navigator.vibrate === 'function') {
          if (type === 'light') navigator.vibrate(15);
          else if (type === 'medium') navigator.vibrate(28);
          else if (type === 'hole') navigator.vibrate([25, 45, 35, 45, 60]);
        }
      } catch (err) {}

      // 2. iOS Safari Taptic Engine Workaround (Native Switch Hack)
      try {
        const hapticLabel = document.getElementById('ios-haptic-label');
        if (hapticLabel) {
          hapticLabel.click();
        }
      } catch (err) {}
    }

    function playPutt(p) {
      const ctx = ensureAudioReady();
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(160 + p * 120, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.12);
      gain.gain.setValueAtTime(0.5 + p * 0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.12);
    }

    function playBounce() {
      triggerHaptic('light');
      const ctx = ensureAudioReady();
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(280, t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 0.08);
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.08);
    }

    function playBumper() {
      triggerHaptic('medium');
      const ctx = ensureAudioReady();
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(784, t);
      osc.frequency.exponentialRampToValueAtTime(392, t + 0.25);
      gain.gain.setValueAtTime(0.5, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.25);
    }

    function playHoleIn() {
      triggerHaptic('hole');
      const ctx = ensureAudioReady();
      if (!ctx) return;
      const t = ctx.currentTime;
      const notes = [523, 659, 784, 1046];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const startT = t + idx * 0.09;
        osc.frequency.setValueAtTime(freq, startT);
        gain.gain.setValueAtTime(0.35, startT);
        gain.gain.exponentialRampToValueAtTime(0.01, startT + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startT);
        osc.stop(startT + 0.28);
      });
    }

    // --- Three.js Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x6bb4de);
    scene.fog = new THREE.FogExp2(0x6bb4de, 0.018);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.35, 50);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    // Lights (Zengin Kontrast ve Canlı Zemin Aydınlatması)
    const ambientLight = new THREE.AmbientLight(0xd0ebd5, 0.50);
    scene.add(ambientLight);
    const sunLight = new THREE.DirectionalLight(0xfffaea, 1.10);
    sunLight.position.set(14, 25, 10);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 60;
    sunLight.shadow.camera.left = -16;
    sunLight.shadow.camera.right = 16;
    sunLight.shadow.camera.top = 18;
    sunLight.shadow.camera.bottom = -18;
    sunLight.shadow.bias = 0.00005;
    sunLight.shadow.normalBias = 0.02;
    scene.add(sunLight);

    // Background Surrounding Ground (Lush Golf Battle Course Outskirts)
    const bgGeo = new THREE.PlaneGeometry(140, 140);
    const bgMat = new THREE.MeshStandardMaterial({ color: 0x16661e, roughness: 0.95, metalness: 0.02 });
    const bgPlane = new THREE.Mesh(bgGeo, bgMat);
    bgPlane.rotation.x = -Math.PI / 2;
    bgPlane.position.y = -0.15;
    bgPlane.receiveShadow = true;
    scene.add(bgPlane);

    // --- Golf Battle Birebir Şampiyona Damalı Çim Dokusu (Golf Battle Renk & Desenleri) ---
    function createGolfGrassTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Golf Battle orijinal renk paleti (Canlı, parlak ve zengin şampiyona yeşilleri):
      const cDark = '#187822';  // Koyu zümrüt çim karesi
      const cLight = '#24a22e'; // Açık canlı çim karesi

      // 4 Büyük Çeyrek Kare (256x256 her biri - Golf Battle ölçeğinde)
      ctx.fillStyle = cDark;
      ctx.fillRect(0, 0, 256, 256);
      ctx.fillRect(256, 256, 256, 256);

      ctx.fillStyle = cLight;
      ctx.fillRect(256, 0, 256, 256);
      ctx.fillRect(0, 256, 256, 256);

      // Golf Battle tarzı şık çim biçme sınır çizgileri (Mowed-lawn bordür)
      ctx.fillStyle = 'rgba(12, 60, 20, 0.20)';
      ctx.fillRect(254, 0, 4, 512);
      ctx.fillRect(0, 254, 512, 4);

      // Pürüzsüz doğal kadife çim mikro-dokusu
      const imgData = ctx.getImageData(0, 0, 512, 512);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 6;
        data[i] = Math.min(255, Math.max(0, data[i] + noise * 0.3));
        data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise * 0.6));
        data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise * 0.3));
      }
      ctx.putImageData(imgData, 0, 0);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      return tex;
    }

    // --- Procedural High-End Cedar Wood Plank Texture with Rich Grain & Knots ---
    function createWoodTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // 1. Zengin sıcak sedir / meşe ahşap temel tonu (#884c24)
      ctx.fillStyle = '#884c24';
      ctx.fillRect(0, 0, 512, 256);

      // 2. Belirgin ahşap damarları ve kalas dalgaları (Rich wavy grain contours)
      for (let y = 0; y < 256; y++) {
        // Doğal ahşap büyüme halkası eğrisi
        const wave1 = Math.sin(y * 0.08) * 18;
        const wave2 = Math.cos(y * 0.035 + 1.2) * 25;
        const wave = wave1 + wave2;

        const isDarkBand = (Math.floor((y + wave * 0.4) / 10) % 2 === 0);
        const alpha = 0.14 + Math.sin(y * 0.15) * 0.08;

        ctx.fillStyle = isDarkBand ? `rgba(45, 18, 6, ${alpha})` : `rgba(185, 110, 55, ${alpha * 0.9})`;
        ctx.fillRect(0, y, 512, 1);
      }

      // 3. Kalas Seviyeleri (3 Adet Belirgin Yatay Ahşap Tahta & Derin Pah Gölgeleri)
      const plankY = [0, 85, 170, 255];
      plankY.forEach(py => {
        // Derin gölge çizgisi
        ctx.fillStyle = 'rgba(25, 10, 4, 0.75)';
        ctx.fillRect(0, py - 3, 512, 5);
        // Üst açık pah yansıması
        ctx.fillStyle = 'rgba(235, 155, 90, 0.45)';
        ctx.fillRect(0, py + 2, 512, 3);
      });

      // 4. Doğal Ahşap Budakları (Organic Wood Knots)
      function drawWoodKnot(kx, ky, r) {
        // Budak merkez çekirdeği
        ctx.fillStyle = '#321406';
        ctx.beginPath();
        ctx.ellipse(kx, ky, r * 0.45, r * 0.35, 0.2, 0, Math.PI * 2);
        ctx.fill();

        // Budak etrafındaki iç içe halkalar
        for (let rad = r * 0.6; rad <= r * 2.2; rad += 3.5) {
          ctx.strokeStyle = (Math.floor(rad) % 7 === 0) ? 'rgba(50, 20, 8, 0.38)' : 'rgba(190, 115, 60, 0.25)';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.ellipse(kx, ky, rad, rad * 0.65, 0.2, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      drawWoodKnot(135, 42, 14);
      drawWoodKnot(370, 128, 16);
      drawWoodKnot(225, 212, 13);

      // 5. Boyuna İnce Ahşap Lifleri ve Gözenek Çizgileri
      ctx.lineWidth = 1.0;
      for (let i = 0; i < 400; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 256;
        const len = 30 + Math.random() * 90;
        const isDark = Math.random() > 0.45;
        ctx.strokeStyle = isDark ? 'rgba(38, 15, 5, 0.22)' : 'rgba(200, 125, 65, 0.18)';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + len, y + (Math.random() - 0.5) * 2.0);
        ctx.stroke();
      }

      // 6. Ahşap Birleşim Yerlerinde Çivi/Vida Başlıkları (Metalik Bağlantılar)
      function drawFastener(fx, fy) {
        ctx.fillStyle = 'rgba(30, 20, 15, 0.7)';
        ctx.beginPath();
        ctx.arc(fx, fy, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(210, 190, 170, 0.4)';
        ctx.beginPath();
        ctx.arc(fx - 1, fy - 1, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
      [42, 128, 212].forEach(fy => {
        drawFastener(24, fy);
        drawFastener(488, fy);
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      return tex;
    }

    // --- Procedural High-End Wooden Wall Top Rail Cap (Ultra-Sharp, Beveled, Zero-Aliasing) ---
    function createWoodRailTopTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      // 1. Sıcak sedir / meşe temel zemin tonu (#96572a)
      ctx.fillStyle = '#96572a';
      ctx.fillRect(0, 0, 512, 128);

      // 2. Boyuna pürüzsüz saten ahşap damarları (Boyuna uzanan zarif dalgalı lifler)
      for (let y = 14; y < 114; y++) {
        const wave = Math.sin(y * 0.12) * 8 + Math.cos(y * 0.04) * 12;
        const isDark = (Math.floor((y + wave * 0.3) / 12) % 2 === 0);
        const alpha = 0.07 + Math.sin(y * 0.2) * 0.04;
        ctx.fillStyle = isDark ? `rgba(60, 28, 10, ${alpha})` : `rgba(215, 145, 85, ${alpha})`;
        ctx.fillRect(0, y, 512, 1);
      }

      // 3. Boyuna ince ahşap lifleri ve gözenekler (Asla moiré/titreme yapmaz)
      ctx.fillStyle = 'rgba(40, 18, 6, 0.10)';
      for (let i = 0; i < 300; i++) {
        const px = Math.random() * 512;
        const py = 16 + Math.random() * 96;
        const plen = 20 + Math.random() * 60;
        ctx.fillRect(px, py, plen, 1);
      }

      // 4. Kenar Pahları (Beveled Chamfers: Üstte ve altta 3D derinlik veren pürüzsüz kenar ışıltıları)
      // Üst Kenar Pahı (y: 0 - 16)
      const gradTop = ctx.createLinearGradient(0, 0, 0, 16);
      gradTop.addColorStop(0.0, 'rgba(25, 10, 4, 0.40)');   // Dış kenar kontrast çizgisi
      gradTop.addColorStop(0.35, 'rgba(245, 195, 145, 0.55)'); // Açık pah ışıltısı
      gradTop.addColorStop(1.0, 'rgba(245, 195, 145, 0.0)');
      ctx.fillStyle = gradTop;
      ctx.fillRect(0, 0, 512, 16);

      // Alt Kenar Pahı (y: 112 - 128)
      const gradBottom = ctx.createLinearGradient(0, 112, 0, 128);
      gradBottom.addColorStop(0.0, 'rgba(245, 195, 145, 0.0)');
      gradBottom.addColorStop(0.65, 'rgba(245, 195, 145, 0.55)'); // Açık pah ışıltısı
      gradBottom.addColorStop(1.0, 'rgba(25, 10, 4, 0.40)');   // Dış kenar kontrast çizgisi
      ctx.fillStyle = gradBottom;
      ctx.fillRect(0, 112, 512, 16);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      return tex;
    }

    // --- 3D Kupa İçi Duvar Dokusu (Beyaz Turnuva Astarı ve Derinlik Gradyanı) ---
    function createCupWallTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // Üstten alta derinlik gradyanı:
      // Üst %18: Beyaz turnuva kupa plastik halkası
      // Orta: Gölgeli kupa içi derinleşmesi
      // Dip: Koyu çukur tabanı
      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.16, '#f2f2f2');
      grad.addColorStop(0.24, '#9e9e9e');
      grad.addColorStop(0.55, '#2c3035');
      grad.addColorStop(1, '#0e1012');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 256);

      // İnce dikey kupa iç kaburga çizgileri
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
      ctx.lineWidth = 1;
      for (let x = 8; x < 128; x += 16) {
        ctx.beginPath();
        ctx.moveTo(x, 50);
        ctx.lineTo(x, 256);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    function createDropShadowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 60);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0.75)');
      grad.addColorStop(0.5, 'rgba(0, 0, 0, 0.35)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);

      return new THREE.CanvasTexture(canvas);
    }

    function createBoosterTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#061c2b';
      ctx.fillRect(0, 0, 128, 256);

      ctx.strokeStyle = '#00f6ff';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let y = 30; y < 256; y += 60) {
        ctx.beginPath();
        ctx.moveTo(25, y + 25);
        ctx.lineTo(64, y);
        ctx.lineTo(103, y + 25);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    // Shared Materials (Turnuva Dokulu Canlı Zemin & Sedir Ahşap Duvarlar)
    const grassTex = createGolfGrassTexture();
    grassTex.anisotropy = renderer.capabilities.getMaxAnisotropy() || 8;
    const grassMat = new THREE.MeshStandardMaterial({
      map: grassTex,
      roughness: 0.85,
      metalness: 0.0
    });

    const woodTex = createWoodTexture();
    woodTex.anisotropy = renderer.capabilities.getMaxAnisotropy() || 8;
    const woodMat = new THREE.MeshStandardMaterial({
      map: woodTex,
      roughness: 0.52,
      metalness: 0.04
    });
    const wallMat = woodMat;

    // Kusursuz, pahlı ve net üst küpeşte malzemesi (Ultra-Crisp Top Rail Cap)
    const woodRailTopTex = createWoodRailTopTexture();
    woodRailTopTex.anisotropy = renderer.capabilities.getMaxAnisotropy() || 8;
    const wallTopMat = new THREE.MeshStandardMaterial({
      map: woodRailTopTex,
      roughness: 0.40,
      metalness: 0.02
    });
    // BoxGeometry yüzey dizilimi: [+X, -X, +Y(üst), -Y(alt), +Z, -Z]
    const wallMaterials = [wallMat, wallMat, wallTopMat, wallMat, wallMat, wallMat];
    const sandMat = new THREE.MeshStandardMaterial({ color: 0xedd68a, roughness: 0.95, metalness: 0.0 });
    const boosterTex = createBoosterTexture();
    const boosterMat = new THREE.MeshBasicMaterial({ map: boosterTex });
    const bumperMat = new THREE.MeshStandardMaterial({ color: 0xff2e6d, roughness: 0.15, metalness: 0.3 });
    const treeMat = new THREE.MeshStandardMaterial({ color: 0x1f7332, roughness: 0.7 });
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a391c, roughness: 0.8 });

    // --- Procedural Championship Dimpled Golf Ball Texture with Alignment Stripe ---
    function createGolfBallTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Parlak inci beyazı turnuva tabanı
      ctx.fillStyle = '#f8f9fb';
      ctx.fillRect(0, 0, 512, 512);

      // Gerçekçi 3D Çukurcuk (Dimple) Deseni - Staggered Hexagonal Grid
      const dimpleRadius = 9;
      const rowSpacing = 19;
      const colSpacing = 22;

      for (let y = 0; y < 512 + rowSpacing; y += rowSpacing) {
        const isOdd = Math.floor(y / rowSpacing) % 2 === 1;
        const xOffset = isOdd ? colSpacing * 0.5 : 0;
        for (let x = -colSpacing; x < 512 + colSpacing; x += colSpacing) {
          const cx = x + xOffset;
          const cy = y;
          const grad = ctx.createRadialGradient(cx - 2, cy - 2, 1, cx, cy, dimpleRadius);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.65, '#e5e9ee');
          grad.addColorStop(1.0, '#c4cbcd');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(cx, cy, dimpleRadius, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(170, 180, 195, 0.30)';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }

      // Velocity Pro Tour Çift Renkli Nişan Çizgisi (Koyu Lacivert & Ateş Kırmızısı)
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 250, 512, 12);
      ctx.fillStyle = '#ff204e';
      ctx.fillRect(0, 246, 512, 4);
      ctx.fillRect(0, 262, 512, 4);

      // Kırmızı Tour "1" Numarası ve Şampiyona Noktası
      ctx.fillStyle = '#ff204e';
      ctx.font = 'bold 38px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('1', 256, 175);
      ctx.beginPath();
      ctx.arc(256, 208, 4.5, 0, Math.PI * 2);
      ctx.fill();

      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy() || 8;
      return tex;
    }

    // Golf Ball (Dokulu, desenli ve gerçekçi dönen şampiyona topu)
    const ballRadius = 0.12;
    const ballGeo = new THREE.SphereGeometry(ballRadius, 32, 32);
    const ballTex = createGolfBallTexture();
    const ballMat = new THREE.MeshStandardMaterial({
      map: ballTex,
      roughness: 0.22,
      metalness: 0.04
    });
    const ballMesh = new THREE.Mesh(ballGeo, ballMat);
    ballMesh.castShadow = true;
    scene.add(ballMesh);

    // Contact drop-shadow decal under ball
    const shadowGeo = new THREE.PlaneGeometry(0.28, 0.28);
    const shadowMat = new THREE.MeshBasicMaterial({
      map: createDropShadowTexture(),
      transparent: true,
      opacity: 0.65,
      depthWrite: false
    });
    const ballShadow = new THREE.Mesh(shadowGeo, shadowMat);
    ballShadow.rotation.x = -Math.PI / 2;
    scene.add(ballShadow);

    // --- Golf Battle Tarzı 3D Dinamik Hız Baremi & Hedef Yayı (Velocity Power Runway) ---
    const aim3DGroup = new THREE.Group();
    scene.add(aim3DGroup);

    // 1. Dinamik Hız Baremi Seviye Çubukları (Aerodinamik kavisli pod / barem blokları)
    const maxBars = 10;
    const aimBars = [];
    const barGeo = new THREE.BoxGeometry(0.24, 0.018, 0.14);

    for (let i = 0; i < maxBars; i++) {
      const mat = new THREE.MeshStandardMaterial({
        color: 0x00f576,
        roughness: 0.2,
        metalness: 0.2,
        emissive: 0x00d060,
        emissiveIntensity: 0.7,
        transparent: true,
        opacity: 0.95
      });
      const mesh = new THREE.Mesh(barGeo, mat);
      mesh.visible = false;
      aim3DGroup.add(mesh);
      aimBars.push(mesh);
    }

    // 2. Hedef Kılavuz Yayı ve Hassas Lazer Noktası (Aerodinamik vizör braketi)
    function createTargetBracketShape() {
      const s = new THREE.Shape();
      s.moveTo(-0.16, -0.05);
      s.quadraticCurveTo(0, 0.08, 0.16, -0.05);
      s.lineTo(0.13, -0.08);
      s.quadraticCurveTo(0, 0.04, -0.13, -0.08);
      s.closePath();
      return s;
    }

    const bracketGeo = new THREE.ExtrudeGeometry(createTargetBracketShape(), {
      depth: 0.016,
      bevelEnabled: true,
      bevelThickness: 0.003,
      bevelSize: 0.003,
      bevelSegments: 2
    });
    bracketGeo.rotateX(Math.PI / 2);

    const reticleMat = new THREE.MeshStandardMaterial({
      color: 0x00f576,
      roughness: 0.15,
      metalness: 0.3,
      emissive: 0x00d060,
      emissiveIntensity: 0.9,
      transparent: true,
      opacity: 0.98
    });
    const reticleArcMesh = new THREE.Mesh(bracketGeo, reticleMat);
    reticleArcMesh.visible = false;
    aim3DGroup.add(reticleArcMesh);

    const reticlePipGeo = new THREE.CylinderGeometry(0.028, 0.028, 0.018, 16);
    const reticlePipMat = new THREE.MeshStandardMaterial({
      color: 0x00f576,
      roughness: 0.1,
      metalness: 0.3,
      emissive: 0x00f576,
      emissiveIntensity: 1.0
    });
    const reticlePipMesh = new THREE.Mesh(reticlePipGeo, reticlePipMat);
    reticlePipMesh.visible = false;
    aim3DGroup.add(reticlePipMesh);

    // Glowing Touch Ring around Ball (Clean emerald green glow)
    const ballRingGeo = new THREE.RingGeometry(0.18, 0.24, 32);
    const ballRingMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
    const ballRing = new THREE.Mesh(ballRingGeo, ballRingMat);
    ballRing.rotation.x = -Math.PI / 2;
    scene.add(ballRing);

    // Ground Tracking & Level Meshes
    let floorMeshes = [];
    const downRay = new THREE.Raycaster();
    const downRayOrigin = new THREE.Vector3();
    const downRayDir = new THREE.Vector3(0, -1, 0);
    let lastGroundY = 0.1;

    function getGroundHeight(x, z, fallbackY = null) {
      downRayOrigin.set(x, 10.0, z);
      downRay.set(downRayOrigin, downRayDir);
      const hits = downRay.intersectObjects(floorMeshes, false);
      if (hits.length > 0) {
        return hits[0].point.y;
      }
      return fallbackY;
    }

    // Game State
    let currentHole = 0;
    let strokes = 0;
    let isMoving = false;
    let isInHole = false;
    let isSinking = false;
    let sinkFallVel = 0;
    let ballPos = new THREE.Vector3(0, 0.22, -6);
    let ballVel = new THREE.Vector3(0, 0, 0);
    let lastSafePos = new THREE.Vector3(0, 0.22, -6);
    let courseGroup = new THREE.Group();
    scene.add(courseGroup);

    let colliders = [];
    let treeColliders = [];
    let speedBoosters = [];
    let sandTraps = [];
    let bumpers = [];
    let rotatingBars = [];
    let holeCupPos = new THREE.Vector3(0, 0.1, 6.5);

    function triggerGameOver() {
      isMoving = false;
      ballVel.set(0, 0, 0);
      document.getElementById('gameover-modal').style.display = 'flex';
    }

    function retryHole() {
      document.getElementById('gameover-modal').style.display = 'none';
      buildCourse(currentHole);
    }

    // Level Definitions (Calibrated with exact ground surfaces)
    const holes = [
      {
        name: "1. Çam Vadisi",
        par: 2,
        spawn: new THREE.Vector3(0, 0.22, -6),
        cup: new THREE.Vector3(0, 0.1, 6.5)
      },
      {
        name: "2. Değirmen & Kum Tuzağı",
        par: 3,
        spawn: new THREE.Vector3(-3.5, 0.22, -6),
        cup: new THREE.Vector3(3.5, 0.1, 7.5)
      },
      {
        name: "3. Zirve & Pinball Tamponları",
        par: 3,
        spawn: new THREE.Vector3(0, 0.22, -6),
        cup: new THREE.Vector3(0, 0.65, 8.5)
      }
    ];

    function buildCourse(idx) {
      // Clear previous course
      while(courseGroup.children.length > 0) {
        courseGroup.remove(courseGroup.children[0]);
      }
      colliders = [];
      treeColliders = [];
      speedBoosters = [];
      sandTraps = [];
      bumpers = [];
      rotatingBars = [];
      floorMeshes = [];

      const data = holes[idx];
      holeCupPos.copy(data.cup);
      ballPos.copy(data.spawn);
      lastSafePos.copy(data.spawn);
      ballVel.set(0, 0, 0);
      isMoving = false;
      isInHole = false;
      isSinking = false;
      sinkFallVel = 0;
      strokes = 0;
      updateHUD();

      // Top görünümünü ve dönüş açısını sıfırla
      ballMesh.scale.set(1, 1, 1);
      ballMesh.rotation.set(0, 0, 0);
      ballMesh.visible = true;

      document.getElementById('gameover-modal').style.display = 'none';
      document.getElementById('modal').style.display = 'none';

      if (idx === 0) buildHole1();
      else if (idx === 1) buildHole2();
      else buildHole3();

      buildCupAndFlag(data.cup);
      spawnDecorations();

      // Ensure all world matrices are calculated so raycasts are 100% accurate
      scene.updateMatrixWorld(true);

      // Snap ball perfectly onto the top surface of the green
      const initGroundY = getGroundHeight(ballPos.x, ballPos.z, data.spawn.y - ballRadius) ?? (data.spawn.y - ballRadius);
      lastGroundY = initGroundY;
      ballPos.y = initGroundY + ballRadius;
      lastSafePos.copy(ballPos);

      // Reset Camera Orbit to look from behind the ball toward the hole cup
      const toCup = holeCupPos.clone().sub(ballPos);
      toCup.y = 0;
      camYaw = urlParams.has('yaw') ? parseFloat(urlParams.get('yaw')) : Math.atan2(toCup.x, toCup.z);
      camPitch = urlParams.has('pitch') ? parseFloat(urlParams.get('pitch')) : 0.42;

      const lookTarget = ballPos.clone().add(new THREE.Vector3(0, camHeightOffset, 0));
      camera.position.set(
        ballPos.x - Math.sin(camYaw) * Math.cos(camPitch) * camDist,
        ballPos.y + Math.sin(camPitch) * camDist,
        ballPos.z - Math.cos(camYaw) * Math.cos(camPitch) * camDist
      );
      cameraLookCurrent.copy(lookTarget);
      camera.lookAt(lookTarget);
      camera.updateMatrixWorld(true);
    }

    // Dünya koordinatlı dikişsiz UV haritalama (Tüm bölümler ve tüm zemin parçaları 100% aynı hizalı)
    function applyWorldUVs(geo, meshX, meshZ, scale = 1.8) {
      const pos = geo.attributes.position;
      const count = pos.count;
      const uvs = new Float32Array(count * 2);
      for (let i = 0; i < count; i++) {
        const wx = pos.getX(i) + meshX;
        const wz = pos.getZ(i) + meshZ;
        uvs[i * 2] = wx / scale;
        uvs[i * 2 + 1] = wz / scale;
      }
      geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    }

    function addFloor(x, y, z, w, h, d, mat = null) {
      const geo = new THREE.BoxGeometry(w, h, d);
      applyWorldUVs(geo, x, z, 1.8);
      const floorMat = mat || grassMat;
      const mesh = new THREE.Mesh(geo, floorMat);
      mesh.position.set(x, y, z);
      mesh.receiveShadow = true;
      courseGroup.add(mesh);
      floorMeshes.push(mesh);
      return mesh;
    }

    // --- Yuvarlak Delik Çukuru Açılmış Tek Parça Dikişsiz Zemin ---
    // Deliğin önü, arkası ve yanları %100 yemyeşil zeminle kaplıdır; sadece yuvarlak delik çukurdur!
    function addFloorWithCupHole(x, y, z, w, h, d, cupWorldX, cupWorldZ, cupRadius) {
      const hw = w * 0.5;
      const hd = d * 0.5;
      const shape = new THREE.Shape();
      shape.moveTo(-hw, hd);
      shape.lineTo(hw, hd);
      shape.lineTo(hw, -hd);
      shape.lineTo(-hw, -hd);
      shape.closePath();

      const localCupX = cupWorldX - x;
      const localCupZ = cupWorldZ - z;
      const hole = new THREE.Path();
      hole.absarc(localCupX, -localCupZ, cupRadius, 0, Math.PI * 2, true);
      shape.holes = [hole];

      const extrudeSettings = { depth: h, bevelEnabled: false };
      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.rotateX(-Math.PI / 2);
      geo.translate(0, -h * 0.5, 0);

      applyWorldUVs(geo, x, z, 1.8);

      const floorMat = grassMat;
      const mesh = new THREE.Mesh(geo, floorMat);
      mesh.position.set(x, y, z);
      mesh.receiveShadow = true;
      courseGroup.add(mesh);
      floorMeshes.push(mesh);
      return mesh;
    }

    // Duvarların yan ve üst yüzeylerine piksel kalitesinde, açı değiştikçe ASLA bozulmayan UV haritalaması
    function setupWallUVs(geo, w, h, d) {
      const uvs = geo.attributes.uv.array;
      const isAlongZ = d >= w;
      const len = isAlongZ ? d : w;
      const repLen = Math.max(1, len / 1.6);

      function setFaceUV(faceIdx, u0, v0, u1, v1, u2, v2, u3, v3) {
        const base = faceIdx * 8;
        uvs[base + 0] = u0; uvs[base + 1] = v0;
        uvs[base + 2] = u1; uvs[base + 3] = v1;
        uvs[base + 4] = u2; uvs[base + 5] = v2;
        uvs[base + 6] = u3; uvs[base + 7] = v3;
      }

      if (isAlongZ) {
        // Face 2 (+Y Üst Küpeşte / Rail Cap): Boyuna pürüzsüz akış, kenarlarda 3D pah ışıltısı
        setFaceUV(2, 0, 0,  0, 1,  repLen, 0,  repLen, 1);
        // Face 3 (-Y Alt):
        setFaceUV(3, 0, 0,  0, 1,  repLen, 0,  repLen, 1);
        // Face 0 (+X) ve 1 (-X) Uzun Yan Yüzeyler: Boyuna ahşap kalaslar
        setFaceUV(0, 0, 1,  repLen, 1,  0, 0,  repLen, 0);
        setFaceUV(1, 0, 1,  repLen, 1,  0, 0,  repLen, 0);
        // Face 4 (+Z) ve 5 (-Z) Kısa Uç Kapaklar
        setFaceUV(4, 0, 1, 1, 1, 0, 0, 1, 0);
        setFaceUV(5, 0, 1, 1, 1, 0, 0, 1, 0);
      } else {
        // isAlongX:
        // Face 2 (+Y Üst Küpeşte / Rail Cap): Boyuna pürüzsüz akış, kenarlarda 3D pah ışıltısı
        setFaceUV(2, 0, 0,  repLen, 0,  0, 1,  repLen, 1);
        // Face 3 (-Y Alt):
        setFaceUV(3, 0, 0,  repLen, 0,  0, 1,  repLen, 1);
        // Face 4 (+Z) ve 5 (-Z) Uzun Yan Yüzeyler
        setFaceUV(4, 0, 1,  repLen, 1,  0, 0,  repLen, 0);
        setFaceUV(5, 0, 1,  repLen, 1,  0, 0,  repLen, 0);
        // Face 0 (+X) ve 1 (-X) Kısa Uç Kapaklar
        setFaceUV(0, 0, 1, 1, 1, 0, 0, 1, 0);
        setFaceUV(1, 0, 1, 1, 1, 0, 0, 1, 0);
      }
      geo.attributes.uv.needsUpdate = true;
    }

    function addWall(x, y, z, w, h, d) {
      // Duvarın zeminin altına derinlemesine (0.35m aşağıya) uzanması sağlanır.
      // Bu sayede alttan ışık kaçması (peter-panning / light leakage) kesinlikle engellenir!
      const extraDepth = 0.35;
      const visualH = h + extraDepth;
      const visualY = y - extraDepth * 0.5;

      const geo = new THREE.BoxGeometry(w, visualH, d);
      setupWallUVs(geo, w, visualH, d);

      const mesh = new THREE.Mesh(geo, wallMaterials);
      mesh.position.set(x, visualY, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      courseGroup.add(mesh);

      colliders.push({
        box: new THREE.Box3().setFromObject(mesh),
        normal: null
      });
      return mesh;
    }

    function addBooster(x, y, z, w, d, speed = 20) {
      const geo = new THREE.BoxGeometry(w, 0.04, d);
      const mesh = new THREE.Mesh(geo, boosterMat);
      mesh.position.set(x, y + 0.02, z);
      courseGroup.add(mesh);
      speedBoosters.push({
        box: new THREE.Box3().setFromObject(mesh),
        dir: new THREE.Vector3(0, 0, 1),
        speed: speed
      });
    }

    function addSand(x, y, z, w, d) {
      const geo = new THREE.BoxGeometry(w, 0.02, d);
      const mesh = new THREE.Mesh(geo, sandMat);
      mesh.position.set(x, y + 0.005, z);
      mesh.receiveShadow = true;
      courseGroup.add(mesh);
      sandTraps.push({
        x: x,
        y: y,
        z: z,
        halfW: w * 0.5,
        halfD: d * 0.5
      });
    }

    function addBumper(x, y, z, radius = 0.4) {
      // Zemine 100% sıfır oturması için gerçek zemin kotunu dinamik örnekle
      const groundY = (getGroundHeight(x, z, y) ?? y);
      const bumperH = 0.36;
      const geo = new THREE.CylinderGeometry(radius, radius * 1.05, bumperH, 32);
      const mesh = new THREE.Mesh(geo, bumperMat);
      mesh.position.set(x, groundY + bumperH * 0.5, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      courseGroup.add(mesh);

      // Zemine sıfır metal/kauçuk taban bileziği (Havada kalmayı kesin engeller)
      const baseGeo = new THREE.CylinderGeometry(radius * 1.15, radius * 1.22, 0.04, 32);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0x22262c, roughness: 0.35, metalness: 0.85 });
      const baseMesh = new THREE.Mesh(baseGeo, baseMat);
      baseMesh.position.set(x, groundY + 0.02, z);
      baseMesh.receiveShadow = true;
      courseGroup.add(baseMesh);

      // Üst neon pembe şapka kubbe
      const capGeo = new THREE.CylinderGeometry(radius * 0.65, radius * 0.72, 0.05, 32);
      const capMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.1,
        metalness: 0.8,
        emissive: 0xff2e6d,
        emissiveIntensity: 0.5
      });
      const capMesh = new THREE.Mesh(capGeo, capMat);
      capMesh.position.set(x, groundY + bumperH + 0.025, z);
      courseGroup.add(capMesh);

      bumpers.push({
        mesh: mesh,
        pos: new THREE.Vector3(x, groundY, z),
        radius: radius
      });
    }

    function addRotor(x, y, z) {
      const pivot = new THREE.Group();
      pivot.position.set(x, y, z);
      courseGroup.add(pivot);

      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.6, 16), woodMat);
      post.position.y = 0.3;
      post.castShadow = true;
      pivot.add(post);

      const armGeo = new THREE.BoxGeometry(2.4, 0.35, 0.2);
      setupWallUVs(armGeo, 2.4, 0.35, 0.2);
      const arm = new THREE.Mesh(armGeo, wallMaterials);
      arm.position.y = 0.25;
      arm.castShadow = true;
      pivot.add(arm);

      rotatingBars.push({
        pivot: pivot,
        arm: arm,
        speed: 1.5,
        halfLen: 1.2,
        halfThick: 0.10,
        postRadius: 0.18
      });

    function buildCupAndFlag(pos) {

    // --- Camera Orbit & Slingshot Touch Controls ---
    const urlParams = new URLSearchParams(window.location.search);
    let camYaw = urlParams.has('yaw') ? parseFloat(urlParams.get('yaw')) : 0;
    let camPitch = urlParams.has('pitch') ? parseFloat(urlParams.get('pitch')) : 0.42;
    const camDist = 5.4;
    const camHeightOffset = 0.35;
    let cameraLookCurrent = new THREE.Vector3();

    // Interaction modes: 'NONE', 'SLINGSHOT', 'ORBIT'
    let interactionMode = 'NONE';
    let touchStart = { x: 0, y: 0 };
    let lastPointer = { x: 0, y: 0 };
    let lockedCamDir = new THREE.Vector3(0, 0, 1);
    let lockedCamRight = new THREE.Vector3(1, 0, 0);

    let aimDir = new THREE.Vector3(0, 0, 1);
    let powerRatio = 0;
    const maxDragPx = 180;

    const powerBadge = document.getElementById('power-badge');

    function getBallScreenPos() {
      const v = ballPos.clone().project(camera);
      return {
        x: (v.x * 0.5 + 0.5) * window.innerWidth,
        y: (-v.y * 0.5 + 0.5) * window.innerHeight,
        inFront: v.z < 1.0
      };
    }

    function onPointerDown(e) {
      initAudio();
      if (isMoving || isInHole) return;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      lastPointer = { x: clientX, y: clientY };

      const ballScreen = getBallScreenPos();
      const distToBall = Math.hypot(clientX - ballScreen.x, clientY - ballScreen.y);

      // Sapan özelliği SADECE topun üzerine dokunulup çekildiğinde çalışır (65px geniş temas yarıçapı)
      if (distToBall <= 65) {
        interactionMode = 'SLINGSHOT';
        touchStart = { x: clientX, y: clientY };
        powerRatio = 0;

        // Dokunma anında kamera yönünü kilitle (Böylece nişan alırken matematik milim şaşmaz)
        lockedCamDir = new THREE.Vector3();
        camera.getWorldDirection(lockedCamDir);
        lockedCamDir.y = 0;
        lockedCamDir.normalize();

        lockedCamRight = new THREE.Vector3();
        lockedCamRight.crossVectors(lockedCamDir, new THREE.Vector3(0, 1, 0)).normalize();
      } else {
        // Ekranda top harici herhangi bir yere dokunulursa: Sadece kamera açısı döner
        interactionMode = 'ORBIT';
      }
    }

    function onPointerMove(e) {
      if (isMoving || isInHole) return;
      if (e.cancelable && interactionMode !== 'NONE') e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      if (interactionMode === 'ORBIT') {
        const dx = clientX - lastPointer.x;
        const dy = clientY - lastPointer.y;
        lastPointer = { x: clientX, y: clientY };

        // Ekran kaydırması ile kamera açısını top etrafında pürüzsüz döndür
        camYaw -= dx * 0.0055;
        camPitch = Math.max(0.12, Math.min(1.22, camPitch + dy * 0.004));
        return;
      }

      if (interactionMode === 'SLINGSHOT') {
        // Sapan çekiş vektörü: Kamera 100% kilitlidir, top ekranda milim oynamaz!
        const pullX = clientX - touchStart.x;
        const pullY = clientY - touchStart.y;
        const dist = Math.hypot(pullX, pullY);

        if (dist > 8) {
          powerRatio = Math.min(dist / maxDragPx, 1.0);

          const normForward = pullY / dist;  // geriye (kendimize) doğru çekildikçe ileri fırlar
          const normRight = -pullX / dist;   // sola çekildikçe sağa fırlar

          aimDir.copy(lockedCamDir).multiplyScalar(normForward).addScaledVector(lockedCamRight, normRight);
          aimDir.y = 0;
          aimDir.normalize();

          updateAimVisuals();
        } else {
          powerRatio = 0;
          hideAimVisuals();
        }
      }
    }

    function onPointerUp() {
      if (interactionMode === 'SLINGSHOT') {
        hideAimVisuals();
        if (powerRatio >= 0.04 && !isMoving && !isInHole) {
          shootBall(aimDir, powerRatio);
        }
      }
      interactionMode = 'NONE';
      powerRatio = 0;
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp, { passive: true });

    function getAimColor(t) {
      const clampedT = Math.max(0, Math.min(1, t));
      let r, g, b, er, eg, eb;
      if (clampedT < 0.5) {
        const k = clampedT / 0.5;
        r = Math.round(0 + k * 255);
        g = Math.round(245 - k * 50);
        b = Math.round(120 - k * 120);
        er = Math.round(0 + k * 230);
        eg = Math.round(210 - k * 50);
        eb = Math.round(80 - k * 80);
      } else {
        const k = (clampedT - 0.5) / 0.5;
        r = 255;
        g = Math.round(195 - k * 165);
        b = Math.round(0 + k * 75);
        er = 255;
        eg = Math.round(160 - k * 145);
        eb = Math.round(0 + k * 60);
      }
      const hex = (r << 16) | (g << 8) | b;
      const emissiveHex = (er << 16) | (eg << 8) | eb;
      const hexStr = '#' + hex.toString(16).padStart(6, '0');
      return { hex, emissiveHex, hexStr };
    }

    function updateAimVisuals() {
      aim3DGroup.visible = true;
      powerBadge.style.display = 'block';

      const aimCol = getAimColor(powerRatio);
      // Çekiş gücüne göre sırayla yanan Golf Battle barem seviye çubukları
      const activeCount = Math.min(Math.max(Math.floor(powerRatio * 9.9) + 1, 1), maxBars);
      const aimAngle = Math.atan2(aimDir.x, aimDir.z);
      const spacing = 0.28 + powerRatio * 0.14;
      const animPhase = gameElapsedTime * 7.5;

      for (let i = 0; i < maxBars; i++) {
        if (i < activeCount) {
          const dist = 0.30 + (i + 1) * spacing;
          const targetX = ballPos.x + aimDir.x * dist;
          const targetZ = ballPos.z + aimDir.z * dist;

          // Zemin kotunu ve rampa eğimini tam örnekle (Rampada ASLA alta batmaz!)
          const groundY = (getGroundHeight(targetX, targetZ, ballPos.y - ballRadius) ?? (ballPos.y - ballRadius)) + 0.024;
          const aheadDist = 0.16;
          const aheadY = (getGroundHeight(targetX + aimDir.x * aheadDist, targetZ + aimDir.z * aheadDist, groundY) ?? groundY);
          const slopePitch = Math.atan2(aheadY - groundY, aheadDist);

          aimBars[i].position.set(targetX, groundY, targetZ);
          aimBars[i].rotation.set(0, 0, 0);
          aimBars[i].rotation.y = aimAngle;
          aimBars[i].rotateX(-slopePitch); // Rampanın eğimini 100% takip eder!

          // Aerodinamik barem genişlemesi (hedefe doğru büyüyen şık enerji çizgileri)
          const barScaleX = 0.85 + (i / maxBars) * 0.45;
          const barScaleZ = 0.80 + (i / maxBars) * 0.30;
          aimBars[i].scale.set(barScaleX, 1, barScaleZ);

          // Barem Seviye Rengi: Düşük kademeler yeşil, orta kademeler sarı, zirve kademeler alev kırmızısı
          const barRatio = (i + 1) / maxBars;
          const barCol = getAimColor(barRatio);

          // İleriye doğru akan neon enerji nabzı dalgası
          const pulse = 0.70 + 0.35 * Math.sin(animPhase - i * 0.65);
          aimBars[i].material.color.setHex(barCol.hex);
          aimBars[i].material.emissive.setHex(barCol.emissiveHex);
          aimBars[i].material.emissiveIntensity = 0.60 * pulse + (i === activeCount - 1 ? 0.30 : 0.10);
          aimBars[i].visible = true;
        } else {
          aimBars[i].visible = false;
        }
      }

      // Uçtaki Hedef Göstergesi Yayı ve Lazer Noktası (Crosshair Target Arc)
      const tipDist = 0.30 + (activeCount + 1) * spacing;
      const tipX = ballPos.x + aimDir.x * tipDist;
      const tipZ = ballPos.z + aimDir.z * tipDist;
      const tipGroundY = (getGroundHeight(tipX, tipZ, ballPos.y - ballRadius) ?? (ballPos.y - ballRadius)) + 0.026;
      const tipAheadY = (getGroundHeight(tipX + aimDir.x * 0.16, tipZ + aimDir.z * 0.16, tipGroundY) ?? tipGroundY);
      const tipSlope = Math.atan2(tipAheadY - tipGroundY, 0.16);

      reticleArcMesh.position.set(tipX, tipGroundY, tipZ);
      reticleArcMesh.rotation.set(0, 0, 0);
      reticleArcMesh.rotation.y = aimAngle;
      reticleArcMesh.rotateX(-tipSlope);
      const arcScale = 0.95 + powerRatio * 0.35;
      reticleArcMesh.scale.set(arcScale, arcScale, arcScale);
      reticleArcMesh.material.color.setHex(aimCol.hex);
      reticleArcMesh.material.emissive.setHex(aimCol.emissiveHex);
      reticleArcMesh.material.emissiveIntensity = 0.90 + powerRatio * 0.30;
      reticleArcMesh.visible = true;

      reticlePipMesh.position.set(tipX, tipGroundY + 0.005, tipZ);
      reticlePipMesh.rotation.set(0, 0, 0);
      reticlePipMesh.rotation.y = aimAngle;
      reticlePipMesh.rotateX(-tipSlope);
      reticlePipMesh.material.color.setHex(aimCol.hex);
      reticlePipMesh.material.emissive.setHex(aimCol.emissiveHex);
      reticlePipMesh.visible = true;

      // Güç Rozeti
      const pct = Math.round(powerRatio * 100);
      powerBadge.innerText = `%${pct} GÜÇ`;
      powerBadge.style.borderColor = aimCol.hexStr;
      powerBadge.style.boxShadow = `0 4px 20px ${aimCol.hexStr}55`;
    }

    function hideAimVisuals() {
      aim3DGroup.visible = false;
      powerBadge.style.display = 'none';
      for (let i = 0; i < maxBars; i++) {
        aimBars[i].visible = false;
      }
      reticleArcMesh.visible = false;
      reticlePipMesh.visible = false;
    }

    function shootBall(dir, power) {
      isMoving = true;
      strokes++;
      updateHUD();
      lastSafePos.copy(ballPos);

      // Hassas kısa vuruşlar (putt) ve güçlü uzun atışlar:
      // 5% çekme: ~0.65 m/s (nazik kısa dokunuş)
      // 20% çekme: ~2.3 m/s (orta-kısa mesafe)
      // 50% çekme: ~10.2 m/s (sağlam fairway sürüşü)
      // 100% çekme: ~34.5 m/s (tam güç roket atış)
      const curvedPower = Math.pow(power, 1.8);
      const speed = 0.5 + curvedPower * 34.0;
      ballVel.copy(dir).multiplyScalar(speed);
      ballVel.y = 0;

      playPutt(power);
    }

    function updateHUD() {
      document.getElementById('hole-name').innerText = holes[currentHole].name;
      document.getElementById('par-badge').innerText = `PAR: ${holes[currentHole].par}`;
      document.getElementById('stroke-badge').innerText = `VURUŞ: ${strokes}`;
    }

    // --- Physics Collision Helpers ---
    function resolveTreeCollisions() {
      treeColliders.forEach(t => {
        const dx = ballPos.x - t.x;
        const dz = ballPos.z - t.z;
        const dist = Math.hypot(dx, dz);
        const minDist = t.radius + ballRadius;
        if (dist < minDist && dist > 0.0001) {
          const nx = dx / dist;
          const nz = dz / dist;
          ballPos.x = t.x + nx * (minDist + 0.008);
          ballPos.z = t.z + nz * (minDist + 0.008);
          const dot = ballVel.x * nx + ballVel.z * nz;
          if (dot < 0) {
            ballVel.x = (ballVel.x - 1.8 * dot * nx) * 0.75;
            ballVel.z = (ballVel.z - 1.8 * dot * nz) * 0.75;
            playBounce();
          }
        }
      });
    }

    function resolveRotatingBarCollision(r) {
      // 1. Merkez silindir direk çarpışması
      const dxPost = ballPos.x - r.pivot.position.x;
      const dzPost = ballPos.z - r.pivot.position.z;
      const distPost = Math.hypot(dxPost, dzPost);
      const minPostDist = r.postRadius + ballRadius;
      if (distPost < minPostDist && distPost > 0.0001) {
        const nx = dxPost / distPost;
        const nz = dzPost / distPost;
        ballPos.x = r.pivot.position.x + nx * (minPostDist + 0.004);
        ballPos.z = r.pivot.position.z + nz * (minPostDist + 0.004);
        const dot = ballVel.x * nx + ballVel.z * nz;
        if (dot < 0) {
          ballVel.x = (ballVel.x - 1.7 * dot * nx) * 0.75;
          ballVel.z = (ballVel.z - 1.7 * dot * nz) * 0.75;
        } else {
          ballVel.x += nx * 1.5;
          ballVel.z += nz * 1.5;
        }
        isMoving = true;
        playBounce();
        return true;
      }

      // 2. Dönen Tahta Kol Çarpışması (Birebir görünüm sınırıyla eşleşen tam OBB Fiziği)
      const theta = r.pivot.rotation.y;
      const cosT = Math.cos(theta);
      const sinT = Math.sin(theta);
      const dx = ballPos.x - r.pivot.position.x;
      const dz = ballPos.z - r.pivot.position.z;

      // Dünya koordinatını tahtanın yerel eksenine dönüştür
      // Three.js Y-rotasyon matrisinin tam tersi (Inverse Transform)
      const lx =  dx * cosT - dz * sinT;
      const lz =  dx * sinT + dz * cosT;

      // Tahta kutusunun kenar yüzeylerine olan en yakın nokta
      const clampedX = Math.max(-r.halfLen, Math.min(r.halfLen, lx));
      const clampedZ = Math.max(-r.halfThick, Math.min(r.halfThick, lz));
      const diffX = lx - clampedX;
      const diffZ = lz - clampedZ;
      const dist = Math.hypot(diffX, diffZ);

      // Top tahtanın görünür modeline fiziksel olarak temas etmiyorsa kesinlikle etkilenmez (Sıfır hayalet çarpışma)
      if (dist >= ballRadius) {
        return false;
      }

      // Temas normali ve dışarı itme miktarı
      let lnx = 0, lnz = 0;
      let pushDist = 0;

      if (dist > 0.0001) {
        // Top dış yüzeyle temas halinde
        lnx = diffX / dist;
        lnz = diffZ / dist;
        pushDist = ballRadius - dist + 0.004;
      } else {
        // Top merkezde örtüşmüşse en kısa eksenden dışarı çıkar
        const ox = r.halfLen - Math.abs(lx);
        const oz = r.halfThick - Math.abs(lz);
        if (oz <= ox) {
          lnx = 0;
          lnz = Math.sign(lz) || 1;
          pushDist = oz + ballRadius + 0.004;
        } else {
          lnx = Math.sign(lx) || 1;
          lnz = 0;
          pushDist = ox + ballRadius + 0.004;
        }
      }

      const pushLx = lx + lnx * pushDist;
      const pushLz = lz + lnz * pushDist;

      // Düzeltilmiş konumu ve normali Dünya koordinatına geri dönüştür
      ballPos.x = r.pivot.position.x + pushLx * cosT + pushLz * sinT;
      ballPos.z = r.pivot.position.z - pushLx * sinT + pushLz * cosT;

      const wnx =  lnx * cosT + lnz * sinT;
      const wnz = -lnx * sinT + lnz * cosT;

      // Tahtanın o noktadaki anlık çizgisel dönüş hızı ve yönü (V = omega x r)
      const vBarX =  r.speed * dz;
      const vBarZ = -r.speed * dx;
      const barSpeed = Math.hypot(vBarX, vBarZ);

      // Topun bağıl hızı ve sekme kontrolü
      const curBallSpd = ballVel.length();
      const vRelX = ballVel.x - vBarX;
      const vRelZ = ballVel.z - vBarZ;
      const vDotN = vRelX * wnx + vRelZ * wnz;

      if (curBallSpd < barSpeed + 1.2 || vDotN >= 0) {
        // Tahtanın etki alanında dururken veya yavaşken: Top tahtanın dönüş yönünde pürüzsüzce sürüklenir
        ballVel.x = vBarX * 1.05 + wnx * 0.35;
        ballVel.z = vBarZ * 1.05 + wnz * 0.35;
      } else {
        // Hızlı atışla tahtaya çarpıldığında: Ahşap yüzeyden temiz ve gerçekçi sekme
        const restitution = 0.65;
        ballVel.x = vBarX + (vRelX - (1.0 + restitution) * vDotN * wnx);
        ballVel.z = vBarZ + (vRelZ - (1.0 + restitution) * vDotN * wnz);
      }

      isMoving = true;
      playBounce();
      return true;
    }

    // --- Physics Simulation Loop (Monotonic High-Precision Timing) ---
    let lastAnimTime = 0;
    let gameElapsedTime = 0;

    function updatePhysics(dt) {
      if (dt > 0.05) dt = 0.05;

      // Rotate windmill rotors (Kesintisiz, sabit ve pürüzsüz dönüş)
      rotatingBars.forEach(r => {
        r.pivot.rotation.y = (r.pivot.rotation.y + r.speed * dt) % (Math.PI * 2);
      });

      // Top dururken dönen tahta topa çarparsa topu hareketlendir
      if (!isSinking && !isInHole) {
        rotatingBars.forEach(r => {
          resolveRotatingBarCollision(r);
        });
      }

      // 1. Top Deliğe Girince: Fiziksel olarak yuvarlak deliğin içine düşüp kaybolması
      if (isSinking) {
        ballPos.x += (holeCupPos.x - ballPos.x) * 16.0 * dt;
        ballPos.z += (holeCupPos.z - ballPos.z) * 16.0 * dt;

        sinkFallVel += 14.0 * dt;
        ballPos.y -= sinkFallVel * dt;

        // Top deliğe girdikçe küçülerek tamamen deliğin içine çekilip kaybolur
        const curScale = ballMesh.scale.x;
        const nextScale = Math.max(0, curScale - 3.2 * dt);
        ballMesh.scale.set(nextScale, nextScale, nextScale);
        if (nextScale <= 0.05) {
          ballMesh.visible = false;
        }
        ballShadow.visible = false;
        return;
      }

      if (!isMoving || isInHole) return;

      // 2. Yüksek Hızlarda Duvarlardan Geçmeyi Kesinlikle Önleyen Sub-stepping (Continuous Collision Detection)
      const curSpeed = ballVel.length();
      const numSteps = Math.min(Math.max(Math.ceil((curSpeed * dt) / 0.035), 1), 10);
      const subDt = dt / numSteps;

      for (let s = 0; s < numSteps; s++) {
        // Hassas kısa vuruş kontrolü: Düşük hızlarda yumuşakça durur, yüksek hızda uzun kayar
        const curSpd = ballVel.length();
        if (curSpd < 2.5) {
          ballVel.multiplyScalar(Math.pow(0.952, subDt * 60));
        } else {
          ballVel.multiplyScalar(Math.pow(0.974, subDt * 60));
        }

        // Alt adımı ilerlet
        ballPos.x += ballVel.x * subDt;
        ballPos.z += ballVel.z * subDt;

        // Dönen Tahta Engel Çarpışmaları (Aktif fiziksel çarpışma)
        rotatingBars.forEach(r => {
          resolveRotatingBarCollision(r);
        });

        // Ağaç Gövdeleri Çarpışmaları (Aktif ağaç çarpışması)
        resolveTreeCollisions();

        // Pinball Tamponları
        bumpers.forEach(b => {
          const dist2D = Math.hypot(ballPos.x - b.pos.x, ballPos.z - b.pos.z);
          if (dist2D < b.radius + ballRadius) {
            const normal = new THREE.Vector3(ballPos.x - b.pos.x, 0, ballPos.z - b.pos.z).normalize();
            ballVel.reflect(normal).multiplyScalar(1.35);
            if (ballVel.length() < 12.0) ballVel.setLength(12.0);
            ballPos.addScaledVector(normal, 0.08);
            playBumper();
          }
        });

        // Duvar Çarpışmaları (Asla duvarın içinden geçemez!)
        colliders.forEach(c => {
          if (c.box.containsPoint(ballPos)) {
            const center = new THREE.Vector3();
            c.box.getCenter(center);
            const size = new THREE.Vector3();
            c.box.getSize(size);

            const dx = ballPos.x - center.x;
            const dz = ballPos.z - center.z;
            const ox = size.x * 0.5 + ballRadius - Math.abs(dx);
            const oz = size.z * 0.5 + ballRadius - Math.abs(dz);

            if (ox < oz) {
              ballVel.x = -ballVel.x * 0.85;
              ballPos.x = center.x + Math.sign(dx) * (size.x * 0.5 + ballRadius + 0.015);
            } else {
              ballVel.z = -ballVel.z * 0.85;
              ballPos.z = center.z + Math.sign(dz) * (size.z * 0.5 + ballRadius + 0.015);
            }
            playBounce();
          }
        });

        // Kum Tuzakları (Top kum alanındayken dengeli kum direnci)
        sandTraps.forEach(s => {
          if (Math.abs(ballPos.x - s.x) <= s.halfW + ballRadius * 0.4 &&
              Math.abs(ballPos.z - s.z) <= s.halfD + ballRadius * 0.4) {
            // Dengeli kum sürtünmesi: 100% güçle rahatça çıkar, zayıf vuruşlar kumda kalır
            ballVel.multiplyScalar(Math.pow(0.915, subDt * 60));
          }
        });
      }

      // 3. Yuvarlak Deliğe Giriş & İçine Çekilme Kontrolü
      const toCup = holeCupPos.clone().sub(ballPos);
      toCup.y = 0;
      const cupDist = toCup.length();

      if (cupDist < 0.45) {
        ballVel.addScaledVector(toCup.normalize(), 8.0 * dt);
        if (cupDist < 0.20 && ballVel.length() < 14.0) {
          isSinking = true;
          isInHole = true;
          isMoving = false;
          sinkFallVel = 0;
          playHoleIn();
          setTimeout(showHoleModal, 900);
          return;
        }
      }

      // 4. Zemin Yüzey Kontrolü & Parkur Dışı (Game Over) Algılama
      const groundY = getGroundHeight(ballPos.x, ballPos.z);
      if (groundY !== null) {
        // Çim pistin üstünde
        lastGroundY = groundY;
        ballPos.y = groundY + ballRadius;
      } else if (cupDist < 0.40) {
        // 3D Çukur kupa ağzının tam üstünde (Doğal çukur seviyesi)
        ballPos.y = holeCupPos.y + ballRadius;
      } else {
        // Pistten dışarı düştü: Aşağı düşme fiziği & GAME OVER
        ballPos.y -= 12.0 * dt;
        if (ballPos.y < -0.45) {
          triggerGameOver();
          return;
        }
      }

      // Ekstra güvenlik sınır kontrolü: Parkur dışı koruması
      if (Math.abs(ballPos.x) > 8.5 || Math.abs(ballPos.z) > 16.0) {
        triggerGameOver();
        return;
      }

      // Topun Tamamen Durması
      if (ballVel.length() < 0.18) {
        ballVel.set(0, 0, 0);
        isMoving = false;
        lastSafePos.copy(ballPos);
      }
    }

    function showHoleModal() {
      const modal = document.getElementById('modal');
      const title = document.getElementById('modal-title');
      const stars = document.getElementById('modal-stars');
      const score = document.getElementById('modal-score');
      const par = holes[currentHole].par;
      const diff = strokes - par;

      if (strokes === 1) {
        title.innerText = "HOLE IN ONE! 🌟";
        stars.innerText = "⭐⭐⭐";
      } else if (diff <= -1) {
        title.innerText = "BIRDIE! 🦅";
        stars.innerText = "⭐⭐⭐";
      } else if (diff === 0) {
        title.innerText = "PAR! 🎯";
        stars.innerText = "⭐⭐☆";
      } else {
        title.innerText = "TEBRİKLER! ⛳";
        stars.innerText = "⭐☆☆";
      }

      score.innerText = `${strokes} Vuruşta Tamamlandı (Par: ${par})`;
      document.getElementById('next-btn').innerText = (currentHole === holes.length - 1) ? "ŞAMPİYONSUN! BAŞTAN OYNA 🏆" : "SONRAKİ DELİK ➡️";
      modal.style.display = 'flex';
    }

    function nextHole() {
      document.getElementById('modal').style.display = 'none';
      currentHole = (currentHole + 1) % holes.length;
      buildCourse(currentHole);
    }

    // --- Camera Smooth Tracking ---
    function updateCamera(dt) {
      // Sapanla nişan alınırken kamera TAMAMEN KİLİTLİDİR (Top ekranda asla kaymaz veya titremez!)
      if (interactionMode === 'SLINGSHOT') {
        return;
      }

      // Top deliğe düşerken kamera açısı ASLA aşağıya eğilmez, zemin/delik seviyesinde kilitli kalır
      const targetLookPos = ballPos.clone();
      if (isSinking || isInHole) {
        targetLookPos.x = holeCupPos.x;
        targetLookPos.z = holeCupPos.z;
        targetLookPos.y = holeCupPos.y;
      }

      const lookTarget = targetLookPos.clone().add(new THREE.Vector3(0, camHeightOffset, 0));
      const targetCamPos = new THREE.Vector3(
        targetLookPos.x - Math.sin(camYaw) * Math.cos(camPitch) * camDist,
        targetLookPos.y + Math.sin(camPitch) * camDist,
        targetLookPos.z - Math.cos(camYaw) * Math.cos(camPitch) * camDist
      );

      if (isMoving) {
        // Top hareket halindeyken pürüzsüz takip
        camera.position.lerp(targetCamPos, dt * 6.0);
        cameraLookCurrent.lerp(lookTarget, dt * 8.0);
        camera.lookAt(cameraLookCurrent);
      } else if (isSinking || isInHole) {
        // Top deliğe düşerken kamera aşağıya eğilmeden sakin ve dengeli şekilde deliği odakta tutar
        camera.position.lerp(targetCamPos, dt * 5.0);
        cameraLookCurrent.lerp(lookTarget, dt * 7.0);
        camera.lookAt(cameraLookCurrent);
      } else if (interactionMode === 'ORBIT') {
        // Ekran kaydırılırken kamera açısını anında ve pürüzsüzce senkronize et (Sıfır mikro-titreme)
        camera.position.copy(targetCamPos);
        cameraLookCurrent.copy(lookTarget);
        camera.lookAt(cameraLookCurrent);
      } else {
        // Dururken hedeflenen orbit açısına yumuşakça otur
        camera.position.lerp(targetCamPos, dt * 8.0);
        cameraLookCurrent.lerp(lookTarget, dt * 10.0);
        camera.lookAt(cameraLookCurrent);
      }
    }

    // --- Render Loop ---
    function animate(timestamp) {
      requestAnimationFrame(animate);
      if (!lastAnimTime) lastAnimTime = timestamp || performance.now();
      const now = timestamp || performance.now();
      let dt = (now - lastAnimTime) / 1000;
      lastAnimTime = now;

      // Delta time sınırlandırma (Dönen engellerde ve fizik adımlarında mikro-duraklamaları kesinlikle engeller)
      if (dt > 0.05) dt = 0.05;
      if (dt <= 0.0001) dt = 0.016;
      gameElapsedTime += dt;

      updatePhysics(dt);
      ballMesh.position.copy(ballPos);

      // Topun zeminde fiziksel olarak yuvarlanma dönüşü (Gerçekçi dönen çukurcuklu top)
      if (isMoving) {
        const speed = Math.hypot(ballVel.x, ballVel.z);
        if (speed > 0.005) {
          const rotAngle = (speed * dt) / ballRadius;
          const rotAxis = new THREE.Vector3(-ballVel.z, 0, ballVel.x).normalize();
          ballMesh.rotateOnWorldAxis(rotAxis, rotAngle);
        }
      }

      // Gerçekçi temas gölgesi (Topun hemen altında yeşil zemin üzerinde)
      if (!isInHole) {
        ballShadow.visible = true;
        ballShadow.position.set(ballPos.x, ballPos.y - ballRadius + 0.004, ballPos.z);
      } else {
        ballShadow.visible = false;
      }

      // Topun altındaki dokunma alanı halkası
      if (!isMoving && !isInHole && interactionMode !== 'SLINGSHOT') {
        ballRing.visible = true;
        ballRing.position.set(ballPos.x, ballPos.y - ballRadius + 0.015, ballPos.z);
        ballRingMat.opacity = 0.45 + 0.25 * Math.sin(gameElapsedTime * 4.0);
      } else {
        ballRing.visible = false;
      }

      // Nişan alma anında akıcı ve canlı enerji nabzı animasyonu
      if (interactionMode === 'SLINGSHOT' && powerRatio > 0) {
        updateAimVisuals();
      }

      updateCamera(dt);
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start Game (Supports ?hole=0..2)
    const startHoleIdx = urlParams.has('hole') ? parseInt(urlParams.get('hole'), 10) : 0;
    currentHole = startHoleIdx;
    buildCourse(currentHole);
    animate();
  </script>
</body>
